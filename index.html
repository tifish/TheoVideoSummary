<script>
const DATA = {"generated_at": "2026-10-29T23:23:59+00:00", "last_fetch": "2026-10-29T23:23:00+00:00", "pending": 0, "videos": [{"id": "uLGxb4F3SyI", "title": "T3 Code broke me", "url": "https://www.youtube.com/watch?v=uLGxb4F3SyI", "date": "20261029", "duration": 2509, "thumbnail": "https://i.ytimg.com/vi/uLGxb4F3SyI/mqdefault.jpg", "title_zh": "T3 Code 如何改变 Theo 的工作方式：多模型协作、远程开发与会话收件箱", "tldr": "Theo 认为 T3 Code 的价值已从整合多种订阅的开源替代品，转向跨模型协作、远程控制和减少注意力负担的开发环境。他主张让正在运行的任务暂时隐藏、完成的任务及时 settle，只把真正需要人工处理的工作留在眼前。", "conclusions": [{"t": "01:41", "text": "Theo 认为 T3 Code 真正形成差异化，是开始改变侧栏、远程控制和订阅协作方式之后，而不只是复制 Claude Code 与 Codex 桌面应用；他坦言早期版本整体体验不如这些替代对象。", "s": 101}, {"t": "07:09", "text": "Theo 认为多模型整合的关键是让它们协作，而非仅提供切换按钮：他演示由一个会话委派不同模型，通过各自官方 harness 和已有订阅参与同一代码库的审查，无须把所有模型塞入同一个 harness。", "s": 429}, {"t": "10:27", "text": "Theo 认为远程开发应允许直接选择任务在哪台机器运行，而不必先进入 SSH 或终端创建会话；他将 T3 Code 的 WebSocket 服务架构与统一桌面、网页和手机入口视为这一体验的基础。", "s": 627}, {"t": "15:55", "text": "Theo 推荐把侧栏当作收件箱，每次打开会话都以完成并清理它为目标；合并改动、回答完问题或确认不再需要，都可以 settle，避免历史会话持续争夺注意力。", "s": 955}, {"t": "19:46", "text": "Theo 认为并行开发界面不应把所有任务一直摆在人面前：正在工作的会话应隐藏到 Working 区，完成或需要输入时再出现；PR 合并后自动 settle 则帮助把工作闭环。", "s": 1186}, {"t": "29:42", "text": "Theo 推荐并行工作默认使用 worktree，使各项工作的管理更容易；同时保留用户选择项目、运行机器和 worktree 创建方式的自由，而不是要求所有人采用固定流程。", "s": 1782}, {"t": "36:51", "text": "Theo 明确指出使用门槛与限制：用户必须自备运行机器，录制时 T3 Connect 限 3 台设备，更多设备要用其他连接方式；产品尚未内置通用 computer use，需要依赖所接入 harness 的能力。", "s": 2211}, {"t": "38:34", "text": "Theo 判断用户可能更快耗尽额度，主要因为同时启动了更多工作，而非 T3 Code 单次调用天然更费 token；他强调产品应继续服务开发者的代码工作，不转向泛办公应用。", "s": 2314}], "key_points": [{"t": "00:00", "text": "回顾因 Codex 应用性能与闭源限制而开发开源替代品的起点，并坦承早期 T3 Code 的不足。", "s": 0}, {"t": "04:56", "text": "介绍多种 harness、订阅及 ACP 接入，以及为同一提供方配置多个实例、独立目录和环境变量的能力。", "s": 296}, {"t": "06:36", "text": "演示 Orchestrator V2 委派四个模型探索代码库，再创建另一项目的会话，展示跨会话通信与外部 MCP 控制。", "s": 396}, {"t": "09:54", "text": "介绍远程服务、Tailscale、运行机器选择、负载分配，以及让 Linux 工作任务调用 Mac 上的移动开发环境。", "s": 594}, {"t": "13:14", "text": "演示 T3 Connect 隧道配对，使旧 Linux 电脑可从桌面端或手机管理，减少手动处理 SSH 和 VPN 的负担。", "s": 794}, {"t": "15:55", "text": "展示会话收件箱的 settle、撤销、snooze、提问提示和定时任务，并区分运行中插入指令与排队发送。", "s": 955}, {"t": "18:41", "text": "展示可选 Working 区、置顶例外、后台启动会话，以及 PR 关联和合并后的自动 settle。", "s": 1121}, {"t": "21:58", "text": "介绍开源后端、远程终端、机器诊断、交互式 HTML 展示、PR 查看器，以及用量和额度恢复后续发消息的能力。", "s": 1318}, {"t": "24:08", "text": "讨论弱网络体验、批量会话操作、标题生成配置、闲置自动 settle、网页入口和草稿暂存。", "s": 1448}, {"t": "25:47", "text": "展示远程移动模拟器、浏览器、外部 MCP 接入和跨 harness 上下文交接，随后介绍系统支持与界面配置。", "s": 1547}, {"t": "29:42", "text": "介绍 worktree、跨机器新建项目、多 Git 平台和内置 PR 监控，并展示远程路由、权限及 webhook 触发任务。", "s": 1782}, {"t": "31:54", "text": "补充多机器应用及提供方更新、通过 SSH 在编辑器打开远程项目、迁移项目和 T3 triage 故障诊断。", "s": 1914}, {"t": "34:06", "text": "展示附件落盘供 agent 使用、远程图片视频、快捷快照及辅助功能上下文，并补充移动端状态展示。", "s": 2046}, {"t": "36:51", "text": "列出自备算力、设备连接数和 computer use 限制，提醒更高并行度会增加额度消耗，并说明 stable 与 nightly 的更新取舍。", "s": 2211}], "takeaways": ["把会话列表作为待处理事项：完成后 settle，暂时不处理的事项 snooze，需要持续关注的会话置顶。", "并行开发时为独立任务使用 worktree，并按任务所需系统和可用资源选择运行机器。", "把 PR 关联到对应会话，使用内置监控跟进检查与审查，减少重复手工查询。", "遇到本地配置或集成问题时，按视频展示的方式运行 npx t3 triage，提供问题背景并保留诊断信息。", "扩大远程并行任务前，确认自备机器、连接方式和模型订阅额度足以支持实际用量。"], "tags": ["T3 Code", "开发工作流", "代码审查", "Codex", "Claude"], "sponsor": "Apify"}, {"id": "NBCM_ZoWZo8", "title": "How To Give Claude Unlimited Usage", "url": "https://www.youtube.com/watch?v=NBCM_ZoWZo8", "date": "20261028", "duration": 2327, "thumbnail": "https://i.ytimg.com/vi/NBCM_ZoWZo8/mqdefault.jpg", "title_zh": "让 Claude 连续工作数周：可验证目标、算力瓶颈与编译器实验", "tldr": "Theo 展示如何用可验证目标、反复评估和持续排除算力瓶颈，让 Claude 在游戏与编译器实验中运行数天乃至数周；这并非取消订阅额度限制。他强调这些实验代价高、问题多，不建议普通开发者照搬，值得学习的是为 agent 建立明确反馈与合适工具。", "conclusions": [{"t": "12:44", "text": "Theo 认为明确且可重复验证的目标能显著改善长任务表现：TS Rust 使用固定版本 TypeScript 在真实项目上的输出作为参照，要求移植后的编译器得到一致结果，而不是笼统要求重写完成。", "s": 764}, {"t": "13:18", "text": "Theo 建议把正确性验证与性能目标结合：在全部已有测试继续通过的前提下，要求实现比官方版本快 2 倍；他称最初慢于 TSGO 的 TS Rust 正是沿这种可测量目标持续优化。", "s": 798}, {"t": "17:11", "text": "Theo 认为，只要 agent 能检查结果是否达标，就能持续迭代，但评判标准必须贴合真实目标；Skate 3 Bench 的截图评审虽推动了画面改进，却也据他估计花了至少 800 美元的 token 折算用量去调整天空盒，暴露出指标偏离重点的浪费。", "s": 1031}, {"t": "20:29", "text": "Theo 判断，大量迭代不应依赖人逐次验收：他报告 TS Rust 在循环中产生了 7,884 个提交，因此需要程序化通过/失败检查，或至少让另一个 agent 判断结果，否则人会成为反馈瓶颈。", "s": 1229}, {"t": "24:18", "text": "Theo 认为长任务的瓶颈可能从推理转向执行算力：他称 TS Rust 的订阅用量折算约 500–800 美元，而仅 Blacksmith 上用于开发测试的计算支出就超过 2,000 美元；这与约 4 万美元的 API 标价折算、以及不到约 30 美元的 CI 账单是不同口径。", "s": 1458}, {"t": "29:56", "text": "Theo 报告，Lust 的验证工作原本争用 VPS 上 4 个槽位，高负载时一次验证需 40–70 分钟；改用 Boat 临时虚拟机及预构建快照后降到约 353 秒，每日合入量超过翻倍。他随后披露自己投资了 Boat，因此这是带有利益关系的个人使用评价。", "s": 1796}, {"t": "32:08", "text": "Theo 推荐持续询问 agent 当前最大的阻碍，而非一次配置完环境就放手：TS Rust 从内存耗尽、排队等待，逐步转向多机分担和云端执行；管理者的重点是观察瓶颈并提供所需资源。", "s": 1928}, {"t": "34:21", "text": "Theo 认为执行瓶颈本身也能成为下一轮优化目标，但实验结果应限定适用范围：Lust 为加速 TS Rust 而生，他称一次 Cargo 构建从 17 分钟缩至 12 秒，并设定生成程序性能差距不超过 20%；他同时承认它几乎不能用于其他应用，甚至对 TS Rust 的支持也仍勉强。", "s": 2061}], "key_points": [{"t": "00:00", "text": "区分日常开发与极端实验：本期讨论消耗大量推理和计算资源、连续运行数周的项目，明确不是面向普通开发者的实用省钱指南。", "s": 0}, {"t": "04:22", "text": "从文字滑板动作识别基准转向 Skate 3 Bench：为 Claude 设置从零制作滑板游戏的目标，而非逆向移植原游戏。", "s": 262}, {"t": "05:28", "text": "Theo 报告该游戏实验消耗超过 120 亿 token、按 API 价格估计近 5,000 美元，人工发送约 25 条提示，很多只是重启机器后的继续指令。", "s": 328}, {"t": "06:39", "text": "展示基于 Three.js 的浏览器游戏、手柄右摇杆动作控制和物理效果，同时指出动画等仍有缺陷。", "s": 399}, {"t": "08:18", "text": "用井字棋、输入输出测试和可验证奖励强化学习解释反馈机制，再将这个思路类比到 agent 对项目的持续修改；这里的开发循环并非重新训练模型权重。", "s": 498}, {"t": "12:11", "text": "介绍 TS Rust 的验证办法：比较固定版本编译器输出，并在真实项目中注入错误，检查错误诊断能否匹配。", "s": 731}, {"t": "14:25", "text": "展示游戏目标中的控制、物理、摄像机与动作要求，随后让多个模型比较游戏截图和参考画面，给出反馈以推动迭代。", "s": 865}, {"t": "16:36", "text": "说明更严谨的原计划是记录手柄输入并重放比较，但实际只采用截图评审；之后因审美偏好把参考由 Skate 3 改成初代 Skate。", "s": 996}, {"t": "19:23", "text": "区分 API 标价折算与订阅用量成本，随后总结选任务、设计可自动验证的成功条件、提供工具和环境的基本步骤。", "s": 1163}, {"t": "22:07", "text": "讨论 TS Rust 的计算资源不足：本地多台机器与 VPS 仍出现排队，转移到云端测试后等待时间明显下降，但构建本身仍慢。", "s": 1327}, {"t": "26:00", "text": "介绍 Boat 按需创建临时虚拟机、SSH、桌面和快照的能力，区分这类开发沙箱与面向终端用户的长期服务部署。", "s": 1560}, {"t": "29:22", "text": "展示先克隆和构建项目，再用快照为多个 agent 提供环境的做法，并报告验证耗时改善；Theo 披露已投资 Boat。", "s": 1762}, {"t": "32:08", "text": "通过独立检查线程查看长期任务历史、询问瓶颈，形成持续补充工具与算力的循环。", "s": 1928}, {"t": "34:21", "text": "介绍为加快 TS Rust 验证而开发的 Lust 编译器，讨论构建速度、生成程序性能目标和狭窄适用范围。", "s": 2061}, {"t": "36:33", "text": "强调这种方式仍充满问题且不建议照搬，但为 agent 改善验证环境、分析耗时的能力值得积累；最后回顾项目从 Cloudflare 上的 TypeScript 需求一路扩展到编译器和系统。", "s": 2193}], "takeaways": ["先定义可重复的成功与失败条件；移植项目可固定参考版本，并同时验证正常输出和错误处理。", "优化速度时保留正确性测试，并为生成结果的运行性能设置明确约束。", "把构建、排队和测试耗时分别记录，先确认真正瓶颈，再决定是否增加并行资源。", "复用已准备好的构建环境或快照，减少每个 agent 重复下载、初始化和全量构建的开销。", "定期检查长期任务的进展与评判标准，防止 agent 围绕不重要的指标持续消耗预算。"], "tags": ["Claude", "开发工作流", "性能优化", "Rust", "TypeScript", "订阅与定价"], "sponsor": "Browserbase"}, {"id": "FHGfSjDGUIw", "title": "pstack creator spends $132,000,000/year on ai????", "url": "https://www.youtube.com/watch?v=FHGfSjDGUIw", "date": "20261026", "duration": 2167, "thumbnail": "https://i.ytimg.com/vi/FHGfSjDGUIw/mqdefault.jpg", "title_zh": "每年花 1.32 亿美元用 AI？Theo 拆解 token 成本与重度使用的价值", "tldr": "Theo 认为，用汇总 token 数乘统一单价来推算 Lauren 的支出严重忽略了缓存、模型组合和实际折扣；比较 AI 成本还必须固定任务范围，考虑模型替人完成的工作。他把这种极端用量视为产品研发与探索未来工作方式，而非普通开发者应照搬的预算；视频中的实际账单估算并未得到证实。", "conclusions": [{"t": "06:08", "text": "Theo 批评以每百万 token 8 美元乘以 Lauren 近 30 天约 1.5 万亿 token 的总量来估算年度费用，因为汇总量混合了缓存读取、缓存写入、普通输入和输出，四者价格不同，不能直接套用输入输出单价。", "s": 368}, {"t": "06:41", "text": "Theo 以自己的用量反驳统一单价：他称自己主要使用 Opus 5.5，综合每百万 token 约 0.41 美元，而非 8 美元；随后称普通输入与输出合计不到其总支出的 8%，说明缓存结构会显著影响成本。该数字是他的个人使用数据，不能直接当作 Lauren 的费率。", "s": 401}, {"t": "12:50", "text": "Theo 根据展示的 Artificial Analysis 数据认为，同等基准能力的任务成本正在快速下降：他举例 Sonnet 4.5 的每任务 56 美分与约一年后 GPT-6 Luna low 的 0.45 美分，以及 Sonnet 4.6 Max 的 2.50 美元与 GPT-6 Luna high 的约 3 美分；这些是特定基准上的比较。", "s": 770}, {"t": "19:33", "text": "Theo 认为旧基准被低价新模型追平或达到饱和，不足以否定历史进步；基准曾能区分旧模型的能力，今天需要更难的新测试，但旧测试仍能辅助比较过去同类任务的表现与成本。", "s": 1173}, {"t": "24:05", "text": "Theo 用 Skate Bench 的滑板动作识别结果支持降本判断：他报告 o1 得分 67.7%、每题约 0.12 美元，Gemini 3 Flash 得分更高且成本约低 58 倍。他也承认这不是最理想的实际开发任务代表，因此不能据此断言所有编程任务都有同样降幅。", "s": 1445}, {"t": "25:48", "text": "Theo 认为同一工单的 AI 账单没下降，也不代表效率没提高：过去人要定位文件、选中代码、运行服务器并验证，现在可能只提交截图让 agent 修复；模型承担更多工作时，应把节省的人力一并计入比较。", "s": 1548}, {"t": "30:12", "text": "Theo 判断，用户持续追求更聪明模型、更少人工参与和更难任务，会让总支出保持高位，即使固定能力水平的价格下降。他对未来降至每月约 100 美元的说法以保持能力水平和延续降价趋势为前提，是预测而非账单承诺。", "s": 1812}, {"t": "31:16", "text": "Theo 认为 Lauren 的投入应综合按工程产出、产品研究、pstack 探索和营销价值评估，而非只计算 token 换回多少代码；她是在探索忽略当前推理成本后能做什么，不是在要求所有公司采用同样预算。", "s": 1876}], "key_points": [{"t": "00:00", "text": "介绍 Lauren（poteto）、pstack 及其 Cursor 个人页显示的约 1.5 万亿月度 token 用量，引出网上关于每年 1.32 亿美元支出的争论。", "s": 0}, {"t": "04:27", "text": "说明本期不仅讨论成本，也讨论如何识别看似可信、实际缺乏合理计算依据的 AI 行业言论。", "s": 267}, {"t": "05:32", "text": "拆解每百万 token 8 美元的假设，解释汇总 token 缺少模型与计费类别拆分的问题。", "s": 332}, {"t": "06:41", "text": "展示自己的综合费率及缓存支出结构，说明直接平均输入输出价格会失真。", "s": 401}, {"t": "08:58", "text": "猜测 Lauren 可能享有折扣、使用较便宜模型并有较高缓存命中率，再讨论产品改进与传播价值；实际费率和账单未公开，视频中的多组金额估算口径及算术并不一致。", "s": 538}, {"t": "11:42", "text": "转向固定智能水平的成本趋势，用 Artificial Analysis 的任务成本数据比较新旧模型。", "s": 702}, {"t": "15:35", "text": "以自己更愿意使用 GLM 5.3 Flash 等新模型的体验，反驳只有旧模型继续降价才算降本的观点，强调协作和长任务体验也在改变。", "s": 935}, {"t": "18:25", "text": "比较 GPT-5 与 Flash 类模型的 token 价格，讨论 token 消耗变化和基准饱和对成本比较的影响。", "s": 1105}, {"t": "20:40", "text": "回顾旧模型在工具调用和开发环境操作上的不足，并承认自己曾低估 Windsurf 让 agent 运行命令的价值。", "s": 1240}, {"t": "23:29", "text": "介绍 o1 的历史计费与 Skate Bench 测试，随后比较 Gemini 3 Flash、GLM 5.3 Flash 的成绩和成本。", "s": 1409}, {"t": "25:48", "text": "用修复 bug 的流程对比说明，今天的 agent 往往接手了过去由人完成的定位、运行和验证步骤。", "s": 1548}, {"t": "29:39", "text": "提出固定能力价格继续下降的预测，同时指出实际用户会不断升级模型和扩大任务范围。", "s": 1779}, {"t": "31:16", "text": "将 Lauren 的工作定位为研发、产品反馈和探索，转述她希望成为 Grokbot 与 Cursor 重度用户以帮助改进产品的目标。", "s": 1876}, {"t": "32:55", "text": "提醒观众检查传播中的计算依据，不要用对他人动机的猜测代替事实讨论，并以自己曾多次误判 AI 的能力和成本趋势作结。", "s": 1975}], "takeaways": ["核算 AI 支出时按模型、缓存读取、缓存写入、普通输入和输出拆分，再结合实际计费，不用总 token 数乘统一单价。", "比较新旧模型时固定任务与验收标准，同时记录人工投入、工具调用和验证工作是否发生变化。", "挑选过去真实完成过的任务做同口径复测，分别记录成功率、总费用和人工介入量。", "评估重度 agent 实验时明确研发和产品反馈目标，不把探索预算直接当成日常开发的预算范本。"], "tags": ["订阅与定价", "基准测试", "开发工作流", "行业观察", "Cursor", "GLM 5.3 Flash"], "sponsor": "Depot"}, {"id": "5Bmp9cz1JN8", "title": "These 3 skills changed my life", "url": "https://www.youtube.com/watch?v=5Bmp9cz1JN8", "date": "20261026", "duration": 1837, "thumbnail": "https://i.ytimg.com/vi/5Bmp9cz1JN8/mqdefault.jpg", "title_zh": "三个技能如何改变 Theo 的开发流程：循环审查、自主交付与合并前停手", "tldr": "Theo 用 Soul Loop、Full Send 和 Full Stop 把反复出现的审查、验证、跟进 PR 与合并决策整理成可复用流程，减少自己需要重新介入的次数。他强调应根据实际工作中的信任边界编写技能，并为自主交付建立验证证据、合并条件和出错后的恢复机制。", "conclusions": [{"t": "04:18", "text": "Theo 建议把技能 description 写成触发条件，而非普通功能介绍；例如只在用户说出 Soul Loop 时使用，让用户能用自然语言组合技能，同时减少模型误触发的机会。", "s": 258}, {"t": "05:25", "text": "Theo 认为循环审查必须限制范围和预算，否则多个 agent 的意见会使 PR 越改越大：Soul Loop 默认最多 3 轮，后续只检查改动与未解决问题，高风险情况才延至 5 轮，并允许反驳不合理建议、拒绝琐碎修改。", "s": 325}, {"t": "06:31", "text": "Theo 更喜欢用 Opus 5.5 协作和写代码，用 GPT-6.1 Soul 做细致审查；他认为在本地先完成这轮审查，能减少提交到 GitHub 后的反复修改，也能利用闲置的 Codex 订阅。", "s": 391}, {"t": "11:32", "text": "按 Theo 的使用体验，Soul Loop 虽然延迟了 PR 首次提交，却减少了 PR 的问题并加快后续审查与合并；他优化的是从工作开始到完成交付的时间，以及交给团队的代码质量。", "s": 692}, {"t": "15:24", "text": "Theo 认为端到端自主交付必须来自明确授权：Full Send 只有被用户清楚请求后才允许自主推进到合并，且须通过亲自观察的验证证据、必要检查、审查处理和分支可合并等条件。", "s": 924}, {"t": "19:17", "text": "Theo 报告，在所查询的使用窗口内，32 次 Full Send 中有 27 次无需他再次查看便完成合并；他将这种流程的可行性归因于验证系统与发布安全网，并以每 6 小时发布一次的 T3 Code nightly 收集反馈、在稳定版前修复问题为例。", "s": 1157}, {"t": "21:27", "text": "Theo 推荐在较高风险改动中使用 Full Stop：让 agent 持续修复、验证、处理 CI 和审查意见，直到 PR 可供他合并，但绝不自行合并；只有遇到硬性阻碍或准备就绪才请求他介入。", "s": 1287}, {"t": "30:13", "text": "Theo 认为技能的价值来自分析自己的工作流、明确哪些事信任 agent 完成，再把这些边界编码进去；应学习如何从重复问题提炼流程，而不是照抄他的 Markdown 文件。", "s": 1813}], "key_points": [{"t": "00:00", "text": "介绍 Soul Loop、Full Send、Full Stop 三个技能，说明它们来自自己反复执行的行为，而不是先设计技能再强行寻找用途。", "s": 0}, {"t": "02:42", "text": "展示 fleet 仓库如何按机器和模型分类管理技能、MCP 等配置，并同步到多台开发机器。", "s": 162}, {"t": "03:45", "text": "反思让 agent 修改技能导致文件膨胀的问题，强调人工阅读、精简内容和明确 description 触发条件。", "s": 225}, {"t": "04:51", "text": "说明 Soul Loop 的职责分工：主 agent 拥有代码，Soul 提供审查；只做必要修改，允许反驳意见，并限制轮数和嵌套审查。", "s": 291}, {"t": "07:04", "text": "要求在 PR 中记录 Soul Loop 审查轮数、模型与最终意见，避免主 agent 淡化审查者尚未认可的状态。", "s": 424}, {"t": "09:18", "text": "演示 T3 Code Orchestrator V2 让不同模型通过各自原生 harness 作为委派任务参与审查；Theo 认为不同训练背景可能带来不同发现。", "s": 558}, {"t": "12:39", "text": "把会话侧栏视为收件箱：已经完成、合并或放弃的工作应 settle，让需要人工响应的会话尽量少。", "s": 759}, {"t": "15:24", "text": "介绍 Full Send 的明确授权、完成修改、证明有效、提交 PR、持续跟进、合并和汇报流程。", "s": 924}, {"t": "17:04", "text": "细化验证与合并条件：复现问题、观察修复生效、运行必要检查、对界面改动查看实际运行效果，并处理审查意见。", "s": 1024}, {"t": "18:12", "text": "要求遇到无法独立解决的阻碍时使用专门的提问工具，附上 PR、阻碍和建议选项，使用户即使不看普通消息也能看到等待状态。", "s": 1092}, {"t": "19:17", "text": "分享 32 次 Full Send 中 27 次自主合并的个人使用数据，讨论验证、nightly 反馈与快速恢复机制。", "s": 1157}, {"t": "20:54", "text": "介绍 Full Stop：沿用自主修复、验证和跟进流程，但将最终合并留给人；随后展示接管外部 PR 并保留原贡献者署名的组合用法。", "s": 1254}, {"t": "24:09", "text": "展示 modernize、takeover、Soul Loop、Full Send、Full Stop 如何逐步组合成流程，并在接管旧 PR 时先检查是否仍有必要。", "s": 1449}, {"t": "25:15", "text": "解释为何偏好自然语言触发多个技能而非禁用模型调用后只用斜杠命令，并展示组合技能完成接管、验证、合并和署名的例子。", "s": 1515}, {"t": "30:13", "text": "收束到工作方式的变化：人逐渐转向管理任务和信任边界，通过分析工作流来持续改进技能。", "s": 1813}], "takeaways": ["记录自己反复向 agent 下达的指令和纠正的问题，再把稳定流程整理为技能，并定期人工精简。", "为循环审查规定最大轮数、后续检查范围和停止条件，要求报告审查轮数、模型及未解决意见。", "区分可以自主合并的任务与必须由人最终合并的任务，将授权和合并条件写清楚。", "让验证提供实际观察证据；涉及界面或运行时行为时，要求运行应用并检查效果。", "建立发布反馈和恢复机制，并要求 agent 仅在确实无法继续时通过专门的提问工具请求帮助。"], "tags": ["开发工作流", "代码审查", "T3 Code", "提示工程", "Claude", "GPT-6.1 Soul"], "sponsor": "WorkOS"}, {"id": "USeyDcWyVCc", "title": "Even The NSA Got Involved", "url": "https://www.youtube.com/watch?v=USeyDcWyVCc", "date": "20261022", "duration": 1762, "thumbnail": "https://i.ytimg.com/vi/USeyDcWyVCc/mqdefault.jpg", "title_zh": "集中披露的安全漏洞与 API 密钥失窃：Theo 担忧的新攻击动机", "tldr": "Theo 强调，PHP、Node.js 等漏洞披露与 Railway、OpenCode 遭遇的实际攻击应分开看待：AI 正缩短从补丁公开到漏洞被利用的时间。他进一步推测，模型蒸馏需求提高了被盗 API 密钥的价值，但视频没有提供能证实这两起攻击幕后买家或用途的证据。", "conclusions": [{"t": "00:32", "text": "Theo 认为不能把集中披露 CVE 与平台已遭入侵混为一谈：前者说明软件存在可被利用的漏洞，后者意味着攻击已经发生；他更担忧 Railway、OpenCode 的密钥失窃，而不是将所有事件归为同一场攻击。", "s": 32}, {"t": "08:17", "text": "Theo 判断，agent 能持续审查提交并从补丁推导旧版本的利用方式，使隐藏补丁用途、增加漏洞分析难度的保护作用减弱；防守方更需要关注补丁部署速度和攻击者能获得的权限。", "s": 497}, {"t": "10:28", "text": "Theo 认为协调披露的时序比以往更重要：他引用 PHP Foundation 对 Chainguard 提前数小时发布修复镜像、破坏披露禁令的指责，说明一方先公开补丁会让仍在准备更新的其他发行方及用户暴露于风险。", "s": 628}, {"t": "12:08", "text": "Theo 认为不同团队独立发现同一漏洞是额外警讯：他提到 Wiz 也独立发现并报告了相关 PHP 漏洞，因此不能假定只有当前报告者掌握漏洞，或仅靠私下协调就能避免其他人发现它。", "s": 728}, {"t": "18:10", "text": "Theo 批评 Railway 在密钥失窃后长时间无法部署，阻碍用户轮换密钥后的恢复；按他录制时的说法，部署中断已约 16 小时，这使他重新考虑把重要软件托管在 Railway 上。他将此归为平台可靠性问题，而非把中断与入侵视作同一个问题。", "s": 1090}, {"t": "20:56", "text": "Theo 推测，攻击者在密钥被撤销前短时间大量消耗推理额度，可能是为了生成模型蒸馏数据；他以模型服务商限制竞争实验室访问、成熟账户更易取得额度来解释这种需求。该动机及幕后参与方是他的推断，视频未给出直接归因证据。", "s": 1256}, {"t": "27:02", "text": "Theo 判断，若被盗密钥能在失效前产生数百至数千美元的推理价值并转售，任何托管 API 密钥的平台都会成为更有吸引力的目标；他建议用户隔离密钥、确保可以快速撤销，并持续更新软件。", "s": 1622}], "key_points": [{"t": "00:00", "text": "以多种软件集中出现安全消息开场，随后区分漏洞报告与实际入侵，提醒不要因时间接近就混为一谈。", "s": 0}, {"t": "03:50", "text": "把 LiteLLM 事件归为 GitHub Actions 被劫持后发布恶意版本的供应链事件，决定不在本期展开；继而介绍 CVE 的追踪与协调作用。", "s": 230}, {"t": "04:57", "text": "以 Node.js 26、24、22 的安全更新为例，说明依赖组件的漏洞修复和证书信任问题也会影响运行环境。", "s": 297}, {"t": "06:04", "text": "解释补丁代码公开到用户真正安装更新之间的风险窗口，以及服务端修复与用户自行升级、重新部署之间的差别。", "s": 364}, {"t": "08:17", "text": "讨论 AI 如何降低识别安全补丁、分析旧版本漏洞的成本，使修复传播速度更关键。", "s": 497}, {"t": "09:23", "text": "转述 FBI 针对 PHP 漏洞的更新、资产盘点和监控建议，并讨论协调披露被提前打破的影响。", "s": 563}, {"t": "11:35", "text": "指出按视频所述，相关 PHP 漏洞由 GPT-5.6 Soul 协助发现，Wiz 也独立报告；Theo 据此担忧发现能力并不只掌握在拥有最新模型的一方手中。", "s": 695}, {"t": "12:40", "text": "批评以“PHP 支撑 70% 网站”直接推导互联网受影响程度的说法，认为网站数量不能替代真实流量和维护状况的衡量；这是 Theo 的分析，视频未提供流量统计验证。", "s": 760}, {"t": "15:27", "text": "介绍 OpenCode 服务端保存的用户自带 API 密钥失窃，以及用户报告的额度盗用、账户停用和后续退款、恢复账户、轮换密钥处理。", "s": 927}, {"t": "16:31", "text": "引用 Railway 关于环境变量可能被访问、部分明文可能泄露的通报，随后将密钥失窃与部署长时间中断分开讨论。", "s": 991}, {"t": "19:50", "text": "从被盗密钥可用时间短却被快速大量消耗的现象，转向模型蒸馏动机的推测，并解释 agent 任务轨迹为何可作为训练数据。", "s": 1190}, {"t": "23:12", "text": "讨论 Theo 所述的服务商访问限制、身份验证、账户额度门槛与区域限制，及他认为这些限制可能催生的密钥黑市需求。", "s": 1392}, {"t": "28:07", "text": "批评模型对防御性安全工作的拒绝行为，再次强调 PHP 漏洞与平台密钥失窃没有被证明存在联系，最后呼吁更新软件并保护、隔离和及时撤销 API 密钥。", "s": 1687}], "takeaways": ["及时更新操作系统、浏览器、应用和依赖，并确认相关服务已重新部署到修复版本。", "盘点部署平台保存的 API 密钥和其他凭据；平台报告泄露时，轮换受影响凭据并检查用量及账单。", "按服务隔离 API 密钥，确保发生事件时可以迅速单独撤销。", "跟踪安全公告，区分已披露漏洞、已确认入侵与尚未证实的攻击归因。"], "tags": ["AI 安全", "行业观察", "开发工作流", "Anthropic", "OpenAI"], "sponsor": "CodeRabbit"}, {"id": "3OshsLm3_OQ", "title": "Opus 5.5 is proof that we do need smarter models", "url": "https://www.youtube.com/watch?v=3OshsLm3_OQ", "date": "20261020", "duration": 1873, "thumbnail": "https://i.ytimg.com/vi/3OshsLm3_OQ/mqdefault.jpg", "title_zh": "Opus 5.5 让 Theo 改观：更聪明的模型不只让程序员受益", "tldr": "Theo 认为，Opus 5.5 的价值不只是提高开发者效率，还让熟悉电脑但不会编程的人能够逆向、改造并分享复杂软件。开发者若仍受既有技术偏好和工作习惯束缚，可能错过更强模型带来的机会。", "conclusions": [{"t": "01:06", "text": "Theo 撤回了模型可能已经足够聪明、继续提升主要惠及前沿开发者的判断；Opus 5.5 带来的游戏改造案例让他相信，更强的智能会惠及更广泛的人群。", "s": 66}, {"t": "13:15", "text": "Theo 认为 Opus 5.5 对非职业开发者的突破尤其显著：一个能力全面、定价可接受且能通过订阅使用的模型，让从未编程或用过 Blender 的人也能用每月 200 美元的 Claude 订阅，将旧游戏地图移植到逆向工程后的其他游戏中。", "s": 795}, {"t": "16:35", "text": "Theo 判断，缺少传统工程经验有时反而有利于创新：不预设不同游戏引擎不能结合的人，更可能提出工程师习惯性排除的跨游戏改造方案。", "s": 995}, {"t": "23:47", "text": "Theo 建议开发者降低对每次尝试都应交付、每个 PR 都应合并的期待；愿意把失败成果丢掉，才能利用 AI 降低的试错成本开展更大胆的探索。", "s": 1427}, {"t": "24:19", "text": "Theo 用自己的 TypeScript 编译器 Rust 重写项目说明旧有可行性判断可能已经过时：他称项目不到 20 小时即可运行，随后达到 TSGO 的 2–3 倍速度、支持 WASM，并在他关心的实际项目上达到与其他 TypeScript 版本 99.99% 的一致性；这些是他在视频中的项目自述。", "s": 1459}, {"t": "26:01", "text": "Theo 认为最受益的不是只停留在高层抽象的人，而是能按目标在不同技术层级间切换、放下个人偏好的人；他以 React Native 的 agent 开发速度、OTA 更新和性能进展，解释为何可能不采用自己更偏好的 SwiftUI 重写版本。", "s": 1561}, {"t": "27:41", "text": "Theo 推荐按 agent 的实际需求配置开发环境，而非照搬人的偏好：他称审计中 Claude 在其机器上超过 30% 的错误与 Zsh 换行处理及 rg 命令格式有关，因此为 agent 定制的 Ubuntu 环境选择 Bash，尽管自己更喜欢 Zsh。", "s": 1661}], "key_points": [{"t": "00:00", "text": "回顾自己先前关于 AI 智能会趋于平台期、以及模型可能已足够聪明的两次判断，并说明 Opus 5.5 为何促使他反思。", "s": 0}, {"t": "03:50", "text": "从旧游戏逆向与混搭切入，讨论更强模型如何通过开发者更快交付软件，让普通用户间接受益。", "s": 230}, {"t": "05:33", "text": "以自建开源视频协作工具 Lawn 为例：Theo 称几天开发就覆盖了 Frame.io 被收购时约 70% 的功能，说明过去不划算的工具现在值得尝试。", "s": 333}, {"t": "07:11", "text": "定义熟悉电脑但不以编程为职业的技术爱好者，讨论 AI 如何弥补他们在系统诊断、软件修改和代码理解上的短板。", "s": 431}, {"t": "09:24", "text": "划分 AI 使用能力层次：辅助熟悉的工作、定制常用工具、构建并分发自己不完全理解的项目，以及深入逆向和重建复杂软件。", "s": 564}, {"t": "11:36", "text": "回顾从早期 Copilot、工具调用到 Opus 4.5 的能力变化，比较职业开发者与技术爱好者获得的不同提升。", "s": 696}, {"t": "13:15", "text": "指出 Opus 5.5 将复杂改造能力带给更多非职业开发者；普通用户目前更多通过朋友分享的工具和游戏模组受益。", "s": 795}, {"t": "15:27", "text": "讨论开发经验与创造力并不等同，以设计师、产品经理及使用超过 4 万个 OBS 场景的用户说明不同背景的价值。", "s": 927}, {"t": "17:08", "text": "借环境变量文件为何不能随代码管理的争论，鼓励质疑现有工具及权限机制的设计前提，而非把沿用多年的做法视为不可更改。", "s": 1028}, {"t": "20:29", "text": "讨论语言移植、固件逆向等原本因成本过高被搁置的探索，以及 AI 如何降低尝试门槛；继而反思因顾及投入而勉强合并 PR 的习惯。", "s": 1229}, {"t": "24:19", "text": "介绍 TypeScript 编译器 Rust 重写项目的进展：从被当作 AI 不可能完成的试验，到支持真实项目与 WASM 的实现。", "s": 1459}, {"t": "26:01", "text": "以 React Native 与 SwiftUI 的取舍、为 agent 定制 Ubuntu 环境及选择 Bash 为例，说明应按目标和实际效果做技术决策。", "s": 1561}, {"t": "29:20", "text": "总结反思：曾让开发者占优的知识也可能形成思维限制；更强模型对非技术人群的直接影响仍未明朗，但游戏改造已展示更广泛的用途。", "s": 1760}], "takeaways": ["选择一个过去因成本过高而搁置的改造或移植想法，让 agent 做小规模试验，再根据结果判断可行性。", "把探索性 PR 当作可丢弃的实验，不因已经投入时间就勉强合并。", "遇到惯例时先追问限制来自哪里，区分真实需求与现有工具的历史设计。", "审计 agent 的常见失败原因，再据此调整 shell、系统和工具配置。", "比较技术方案时纳入 agent 的开发效率、部署便利和实际性能，避免仅凭个人偏好决定。"], "tags": ["Claude", "Opus 5.5", "开发工作流", "行业观察", "提示工程"], "sponsor": "Browserbase"}, {"id": "m-B3jIMMmUE", "title": "Your prompts kinda suck", "url": "https://www.youtube.com/watch?v=m-B3jIMMmUE", "date": "20261018", "duration": 1907, "thumbnail": "https://i.ytimg.com/vi/m-B3jIMMmUE/mqdefault.jpg", "title_zh": "你的提示词不够大胆：很多「功能」其实只是一条提示", "tldr": "Theo 认为工程师不擅长写提示词，问题不在于提示词设计得不够精巧，而在于想得太工程化、要求提得太少：很多想做的功能其实直接问 agent 就能拿到。工程师应把精力转向为 agent 提供原语、数据通道和工具。", "conclusions": [{"t": "00:00", "text": "Theo 认为「提示工程」的炒作是错的：工程师的问题不是提示写得不够工程化，而是过度工程化，并且「问得不够多」，没有意识到 agent 能做的事远超预期。", "s": 0}, {"t": "07:08", "text": "很多被当作产品功能提出的需求其实只是「信息」：例如统计工具调用耗时、可视化上下文窗口占用，直接在 T3 Code 里问 agent 几分钟就能得到报告，不需要专门开发功能。", "s": 428}, {"t": "08:47", "text": "Theo 承认自己做错过：他给 T3 Code 设计的多线程管理面板按钮越加越多，后来意识到应该做成一个能连接所有实例的对话式「元线程」，想要什么直接说。", "s": 527}, {"t": "11:31", "text": "别向工具要功能，向 agent 要结果：像「选择用哪个子 agent 模型」这样的需求，本来就由模型决定，直接在提示里说「用两个 Opus 5.5 探索、再用 Grok 4.7 实现」即可；反复说同样的话时，再沉淀为 skill 或 CLAUDE.md。", "s": 691}, {"t": "14:15", "text": "T3 Code 的 `npx t3 triage` 原本计划写成几千行的复杂诊断流程，最终只用约 5 行代码加 30 行 markdown 提示：把机器信息和排障手册交给 Claude Code 或 Codex，由它问用户、查源码、查上游，并规范地提交 issue，效果反而更好。", "s": 855}, {"t": "19:49", "text": "可以直接询问 agent 自身的能力和失败原因：Theo 让 Codex 描述它的 computer use 能力，再把描述交给 Opus 在 T3 Code 中复刻；也可以问「为什么 PR 里没截图、需要什么工具」。", "s": 1189}, {"t": "23:08", "text": "Theo 强烈建议把邮箱接入 ChatGPT：他从一天查 10 次收件箱变成约一次，再配合可以盯特定邮件的工具和 T3 Code MCP，就能从一封账单邮件直接触发 agent 排查并交付改动。", "s": 1388}, {"t": "24:49", "text": "Theo 认为熬过「失去工程师感」的低谷后，工程反而更有趣、更难：工作重点转向构建原语、数据管道、MCP 接口和运行时等更底层的系统，让提示能做更多事。", "s": 1489}], "key_points": [{"t": "00:00", "text": "开场：提示工程的炒作是错的，工程师的问题在于过度工程化、问得不够多。", "s": 0}, {"t": "01:40", "text": "Macroscope 赞助段（代码审查、团队动态面板、自定义 PR 审查 agent）。", "s": 100}, {"t": "03:51", "text": "XKCD「判断照片是否在国家公园、是否拍的是鸟」：过去普通人低估技术难度，如今工程师低估了能向 agent 提出的要求。", "s": 231}, {"t": "04:56", "text": "真实案例：朋友希望 T3 Code 增加工具调用耗时统计，Theo 直接让 GPT-6 Astra 生成报告，发现有一次主目录搜索耗时 41.7 分钟。", "s": 296}, {"t": "07:41", "text": "反面例子：Theo 设计的线程管理面板功能不断膨胀，后来改为对话式元线程。", "s": 461}, {"t": "09:20", "text": "让 agent 可视化上下文窗口占用，由此发现代理配置让每个请求多带了 7 万 token。", "s": 560}, {"t": "11:31", "text": "在提示中直接指定子 agent：用 GPT-6.1 Soul 编排两个 Opus 5.5 探索性能问题，再交给 Grok 4.7 实现。", "s": 691}, {"t": "13:42", "text": "把这种思路带回工程：T3 triage 只是把一份排障手册提示交给 Claude Code 或 Codex。", "s": 822}, {"t": "18:42", "text": "让 agent 说明自己缺哪些数据、应该增加哪些日志；Theo 顺带吐槽终端交互，他更习惯语音输入。", "s": 1122}, {"t": "19:49", "text": "向 Codex 询问它的 computer use 能力，并据此在 T3 Code 中复刻。", "s": 1189}, {"t": "21:29", "text": "提示的对象可以不是代码，例如让 agent 从各家医院网站收集 MRI 报告；Theo 用电子邮件类比，反驳「脑腐」的说法。", "s": 1289}, {"t": "23:08", "text": "把邮箱接入 ChatGPT，并通过 MCP 把邮件、agent 和 T3 Code 串起来。", "s": 1388}, {"t": "26:28", "text": "T3 Code 至少一半的功能请求其实用户自己就能通过提示实现；需要补的是原语，例如 agent 生成内联可视化的能力。", "s": 1588}, {"t": "28:06", "text": "「工程师感」曲线：AI 带来的低谷之后，工程会变得更深、更复杂；Theo 现在在做自己的操作系统、编译器和 JavaScript 运行时。", "s": 1686}], "takeaways": ["想给工具加功能之前，先试试直接让 agent 产出这个结果（报告、可视化、统计），有用再沉淀为 skill。", "做复杂的引导式流程（如排障、上手引导）时，考虑用一份详尽的提示加现成的 agent 代替大量分支代码。", "agent 做不到某件事时，直接问它缺什么工具或数据，再据此补充日志、MCP 接口等原语。", "把邮箱等日常数据源接入 agent，让它替你盯特定事件，并触发后续工作。"], "tags": ["提示工程", "开发工作流", "T3 Code", "Codex"], "sponsor": "Macroscope"}, {"id": "hiI0Vk4NgeY", "title": "Anthropic Rebuilt Git (yes really)", "url": "https://www.youtube.com/watch?v=hiI0Vk4NgeY", "date": "20261015", "duration": 2884, "thumbnail": "https://i.ytimg.com/vi/hiI0Vk4NgeY/mqdefault.jpg", "title_zh": "Anthropic 自研版本控制系统 Scion：为 agent 规模重新设计 Git", "tldr": "Theo 解读 Anthropic 用 5 个月替换 Git 的内部版本控制系统 Scion：它基于「agent 永远在线」的前提，把计算放到服务端、用不可变的 change set 和多层缓存实现横向扩展，常用操作快几十倍；Theo 认为这说明 AI 让自建替代方案的成本大幅下降，工程师应重新审视过去默认正确的工具和流程。", "conclusions": [{"t": "01:40", "text": "Anthropic 每天合入的代码变更从 2026 年 5 月的约 2500 个增长到 9 月的 3 万多个，瓶颈已从写代码转到为人类规模设计的开发基础设施（源码管理、构建、CI）；Theo 认为 Git 不是大规模并行 agent 开发的正确基础。", "s": 100}, {"t": "12:11", "text": "Scion 的核心洞察是：虽然 Git 是去中心化的，但公司实际把它当作中心化系统使用，而客户端几乎都是本来就在线的 agent 和任务，所以没必要每个客户端都同步完整历史（主分支历史近 100GB、CI 每天约 2500 万次 checkout，原生拉取相当于每天 600PB 流量）。", "s": 731}, {"t": "16:02", "text": "设计要点：提交、rebase、合并都在服务端完成且无锁，成本随改动大小而非仓库大小增长；尽量不用分支/tag 等全局 ref；工作副本可选且默认稀疏；所有查询（blame、diff、merge base）都通过 API 提供，CI 往往不需要本地仓库。", "s": 962}, {"t": "23:09", "text": "数据全部内容寻址、不可变（change set 存元数据于 Spanner、文件内容存 blob），服务器可以无协调地缓存，Theo 认为这正是它能横向扩展的关键：「不可变几乎总是比可变更容易扩展」。", "s": 1389}, {"t": "27:34", "text": "效果：三级缓存（服务器、区域缓存、节点守护进程）命中率都超过 99%，基础设施的 CPU/内存占用比原来的 Git 镜像小 200 倍，CI checkout 从分钟级降到秒级；常用命令中 pull 快 25 倍、新建 worktree 快 84 倍、status 快 207 倍。", "s": 1654}, {"t": "32:01", "text": "7 人团队在 5 个月内做完了 Scion、代码审查工具 Antique 和多个配套系统；Theo 认为切换成本已大幅下降，自建专用替代方案（他自己的 TypeScript 编译器、分析数据迁移到 ClickHouse+R2）会越来越常见。", "s": 1921}, {"t": "34:16", "text": "Anthropic 承认工程师依然重要：团队认为 Claude 写代码比他们强，但工程师负责系统层面的权衡和对 Claude 说「不」，还要避免对抗式 AI 审查导致过度工程；Theo 认同跨模型的 AI 审查尤其容易引发范围膨胀。", "s": 2056}, {"t": "42:32", "text": "Anthropic 放弃全局锁的合并队列，改为合入后、部署前的自动测试；Theo 认为这印证了他一贯的观点：降低回滚和修复成本比在合入前不断加摩擦更重要。", "s": 2552}], "key_points": [{"t": "00:00", "text": "开场：Theo 认为 Git 是为「代码昂贵、需要人审」时代设计的，GitHub 的可用性也很差。", "s": 0}, {"t": "01:40", "text": "Anthropic 发文介绍自研源码管理系统，合入量 4 个月增长超 10 倍。", "s": 100}, {"t": "02:46", "text": "Infinite Red 赞助段（React Native / Expo 移动开发咨询）。", "s": 166}, {"t": "05:31", "text": "Theo 用自己一晚合入 50 多个 T3 Code PR 的经历说明：降低合入风险、便于回滚就能更快交付。", "s": 331}, {"t": "07:47", "text": "先例：Meta 基于 Mercurial 的系统、Graphite 的 stacked diff、Google Piper；Anthropic 和 OpenAI 都用单一 monorepo。", "s": 467}, {"t": "11:04", "text": "Git 去中心化设计与 Anthropic 超大 monorepo 的矛盾，以及几百个内部 Git 镜像的运维负担。", "s": 664}, {"t": "13:17", "text": "Scion 的设计原则：客户端永远在线、客户端/服务端不对称、源码服务提供 API、横向扩展、提交廉价无锁、稀疏工作副本。", "s": 797}, {"t": "17:39", "text": "数据结构：change set 只记录相对父节点改动的文件和指向 blob 的内容地址；blame、路径历史等作为可递归计算的派生数据。", "s": 1059}, {"t": "22:02", "text": "扩展方式：服务端计算 diff、内容寻址缓存、按需拉取 tree 和 blob 的协议，以及守护进程、区域缓存、服务器三级缓存。", "s": 1322}, {"t": "30:22", "text": "经验：Mythos Preview 重写了导入管道，内存降 20 倍、速度快 4 倍；Theo 统计 T3 Code 的 CI 有近 1000 小时花在等待 Git checkout。", "s": 1822}, {"t": "36:27", "text": "Claude 找到漏用索引的祖先查询优化，Theo 借此对比 Gemini 4 会臆造 SQLite 列名。", "s": 2187}, {"t": "38:07", "text": "安全：目录级权限控制；Theo 质疑用程序区分「只改注释」等变更类型，认为直接让 Claude 判断即可。", "s": 2287}, {"t": "39:44", "text": "运维：用 Claude Tag 在 Slack 中为每个组件设置盯监控的「super fan」agent。", "s": 2384}, {"t": "41:56", "text": "重新审视旧有假设：合并队列在 agent 规模下不再适用，转向合入后测试；Theo 设想由 Claude 批量合并已批准的改动并处理冲突。", "s": 2516}, {"t": "44:09", "text": "Anthropic 不打算开源 Scion，而是建议把服务端 RPC、新的协商协议等思路引入 Git 生态；Theo 预计明年用几千美元 token 就能自建类似系统。", "s": 2649}], "takeaways": ["把精力放在降低出错后的影响和回滚成本上（灰度发布、快速 revert、合入后测试），而不是一味增加合入前的审批摩擦。", "统计一下 CI 花在 Git clone/checkout 上的时间和成本，必要时用浅克隆、稀疏 checkout 或缓存来优化。", "使用 AI 对抗式审查时注意防止过度工程和范围膨胀，人类审查应聚焦改动的意图而不是逐行阅读。", "遇到通用工具成为瓶颈时，评估用 agent 自建专用替代方案的成本，它可能已经远低于你的预期。"], "tags": ["Anthropic", "开发工作流", "行业观察", "性能优化", "Claude"], "sponsor": "Infinite Red"}, {"id": "NE006pkiAnk", "title": "So I've been testing Gemini 4...", "url": "https://www.youtube.com/watch?v=NE006pkiAnk", "date": "20261014", "duration": 2310, "thumbnail": "https://i.ytimg.com/vi/NE006pkiAnk/mqdefault.jpg", "title_zh": "Gemini 4 Argon 实测：跑分亮眼，真实代码工作却频繁出错", "tldr": "Theo 认为时隔 8 个月才发布的 Gemini 4 Argon 是今年最差的发布之一：前端设计和 SkateBench 表现不错，但在真实代码库审计中错误论断比例极高、写出的 PR 冗长且不可用，又贵又慢；他今后只会用 Gemini 获取 YouTube 数据，写代码继续用 Opus 5.5。", "conclusions": [{"t": "04:21", "text": "标价 $2/$10（每百万 token 输入/输出）看似便宜，但 Theo 认为并不划算：模型很耗 token，缓存命中率只有约 70–80%（其他模型 99%+），在 Artificial Analysis 上按任务算比 Opus 5.5 high 更贵、得分却更低；而且这只是首发价，12 月 1 日起翻倍到 $4/$20。", "s": 261}, {"t": "10:25", "text": "Theo 批评 Google 是唯一经常给已发布模型涨价的实验室，先低价后翻倍会让开发者不敢在上面重度构建，应该给出能长期提供的价格、以后再降。", "s": 625}, {"t": "12:41", "text": "前端是它的强项之一：配合 Anthropic 官方 design skill 能做出不像 AI 生成的首页（不建议用 taste skill），但 Theo 认为 Fable 5.1 仍是做前端最好的模型；Gemini 生成 token 快，但解决问题并不快。", "s": 761}, {"t": "16:01", "text": "Gemini 在 SkateBench 上首次拿到满分（Opus 5.5 max 只有 79%），说明它确实有独特能力；YouTube 数据（如获取视频字幕）和视觉任务也是 Gemini 的特有优势，但 Theo 认为这类独有能力已比过去少。", "s": 961}, {"t": "21:27", "text": "Artificial Analysis 的 Omniscience 测得幻觉率仅 15%，但这主要来自更多地拒答，综合分只排第四；Theo 判断这个基准不符合真实情况，他在日常代码工作中看到它大量出错。", "s": 1287}, {"t": "24:16", "text": "代码库审计基准中表现极差：TS Rust 审计得分 4.38（GPT-6.1 Soul 8.84、Opus 5.5 8.78），36 条论断中 24 条是错的、耗时 43 分钟；Lakebed 审计 78 条发现中 56 条错误，T3 Code 架构审计 47 条错误，比 Muse Wonder Full 的正确论断还多。", "s": 1456}, {"t": "30:54", "text": "真实任务失败：修 T3 Code SQLite 连接问题时，它诊断大体正确但修错了一半，花 30 分钟写了 1200 行、CI 失败、无视仓库的 PR 规范，也没发现已有两个现成修复 PR；正确改动只需约 21 行。", "s": 1854}, {"t": "36:26", "text": "Theo 的结论是 Gemini 4 Argon 和普通版 Muse Wonder 都不能为 T3 Code 贡献有用代码，他打算自动关闭这类模型提交的 PR；今后只用 Gemini 获取 YouTube 数据，写代码坚持用 Opus 5.5。", "s": 2186}], "key_points": [{"t": "00:00", "text": "开场：距 Gemini 3.1 Pro 已 8 个月，Google 终于发布大模型 Gemini 4 Argon；Theo 通过 Google 朋友提前拿到访问权限。", "s": 0}, {"t": "01:38", "text": "WorkOS 赞助段（AuthMD 让 agent 代用户注册）。", "s": 98}, {"t": "02:44", "text": "官方公告：通过 API、AI Studio、Anti-Gravity、Gemini App 等渠道上线，号称在 VALS 指数排名第一；Theo 吐槽 Google 产品线混乱，并指出图表中 Muse Wonderful 的价格是错的。", "s": 164}, {"t": "03:49", "text": "Artificial Analysis 智能指数：高于 Astra 和 6.1 Soul，但明显低于 Opus 5.5，且按任务计算成本更高。", "s": 229}, {"t": "06:01", "text": "一位 Google 员工私下的评价只是「我用 Opus 5 的次数变少了」；官方案例（Chrome 重构、Deloitte 评测 100% 成功）被 Theo 认为说服力不足。", "s": 361}, {"t": "07:40", "text": "SkateBench：Argon 首次满分，token 效率也不错，但测试期间 API 报错率很高。", "s": 460}, {"t": "09:20", "text": "多模态与视觉一直是 Gemini 强项，值得针对复杂视觉任务做对比；定价为首发价，12 月 1 日翻倍。", "s": 560}, {"t": "10:59", "text": "前端测试：用 WhichAI 对比不同模型的首页设计，开启 Anthropic design skill 后效果明显更好。", "s": 659}, {"t": "13:47", "text": "各家模型的独特能力：OpenAI 生成图片、Grok 访问 X 数据、Gemini 访问 YouTube；但 Theo 认为 Gemini 处理大多数 Google 服务并不好。", "s": 827}, {"t": "17:06", "text": "Fish Slop 3D 游戏测试：水面渲染错误、潜艇建模一般；食物掉到缸底不会消失导致鱼饿死，攻击力道具在怪物出现前就过期，缺乏「大模型的思考深度」。", "s": 1026}, {"t": "21:27", "text": "幻觉基准 AA Omniscience：幻觉率低，但综合得分只排第四。", "s": 1287}, {"t": "22:34", "text": "自建审计基准：TS Rust、T3 Code 远程更新 bug、Lakebed、T3 Code 架构，与 Opus 5.5、GPT-6.1 Soul、Astra、Muse Wonder 对比。", "s": 1354}, {"t": "29:18", "text": "T3 Code SQLite 修复实测：PR 冗长、CI 失败，最后用 Opus 5.5 复盘并关闭 PR。", "s": 1758}, {"t": "33:41", "text": "Anti-Gravity / ACP 集成的问题：账号被封可能牵连整个 Google 账号；中途连接网关失败、模型与推理强度绑定成不同的模型名等。", "s": 2021}, {"t": "35:54", "text": "总结：今年最差的发布之一，听说之后会有更好的快照版本；Theo 会继续用 Opus 5.5。", "s": 2154}], "takeaways": ["评估 Gemini 4 Argon 的成本时按任务总成本计算，并考虑缓存命中率低以及 12 月 1 日起价格翻倍。", "不要直接采纳 Gemini 4 Argon 的代码审查或审计结论，先用 GPT-6.1 Soul 或 Opus 5.5 等更可靠的模型复核。", "用 AI 做前端设计时启用 Anthropic 官方 design skill，效果明显好于不用 skill 或用 taste skill。", "需要 YouTube 数据（如字幕）或复杂视觉任务时可以试试 Gemini，这是它相对其他模型的独特优势。"], "tags": ["Google", "Gemini", "模型评测", "基准测试", "代码审查", "Opus 5.5"], "sponsor": "WorkOS"}, {"id": "DbWL6Zs2j_g", "title": "Meta just caught up with Anthropic", "url": "https://www.youtube.com/watch?v=DbWL6Zs2j_g", "date": "20261013", "duration": 2282, "thumbnail": "https://i.ytimg.com/vi/DbWL6Zs2j_g/mqdefault.jpg", "title_zh": "Meta 终于追上 Anthropic：Muse Wonder Full 评测", "tldr": "Theo 认为 Meta 的 Muse Wonder Full 是 OpenAI、Anthropic 之外第一个真正达到前沿水平的模型：智能上限略低于 Opus/Fable，但极少犯蠢、速度快、token 高效、编排子 agent 很强、输出好读；不过前端和 3D 很差，命名与定价混乱，便宜的 API 版 Muse Wonder 则明显更弱，不值得用。", "conclusions": [{"t": "00:35", "text": "Muse Wonder Full 的 max 档在 Artificial Analysis 上超过所有 OpenAI 模型、排名第三；Theo 声明 Meta 没有付钱给他，本期只有 Browserbase 赞助。", "s": 35}, {"t": "02:46", "text": "最大槽点是「一个名字、两个模型」：API 版 Muse Wonder 约 120 TPS、每百万 token $4 入 / $20 出 / $0.20 缓存读，略低于 Opus；官方跑分用的是更大的 Wonder Full（约 50 TPS），只能通过 Muse Code 订阅使用且没有公布价格，无法做性价比比较，Theo 推测它可能比 Opus 5.5 还贵。", "s": 166}, {"t": "10:35", "text": "前端 UI 和 3D 很差：UI 像 Sonnet 3.7 时代的套路化产物，Blender 建模很糟，Meta 自己也把视觉/空间推理列为已知局限；Theo 强调 3D、computer use 这类能力来自针对性的后训练环境，不会随着模型变聪明自动出现。", "s": 635}, {"t": "18:57", "text": "Theo 最欣赏的是它「不犯蠢」：他把「聪明」和「蠢」分开打分，Astra 聪明但蠢度 10/10，Opus 约 3/10，Muse Wonder Full 智能上限约 8–9/10，但蠢度只有 1–2/10，几天高强度使用里犯的蠢错比 Soul/Astra 半小时还少。", "s": 1137}, {"t": "16:41", "text": "编排能力是前沿级别：给子 agent 的提示严谨（要求读实现、不得引用未打开的文件、只分析不改），能同时管理大量并行 agent，这是 OpenAI、Anthropic 以外的实验室通常做不到的。", "s": 1001}, {"t": "23:19", "text": "在 T3 Code 远程更新 bug 的实测中，Muse 的回答最清晰，并且找到了别人已提交的一行修复 PR；Opus 的修复正确但输出啰嗦，Soul 理解错了问题，给出的方案还有害。", "s": 1399}, {"t": "24:58", "text": "自建的代码库审计和 PR 审查对比：Wonder Full 与 Astra、Fable 5.1 接近但低于 Opus 5.5，耗时约为 Opus/Soul 的一半，token 也比 Opus 5.5 xhigh 少；PR 审查中 Opus 找到 23 项（发现最多但小毛病也多），Soul 9 项，Muse 16 项居中、新发现 5 项，是不错的折中。普通 Muse Wonder 的审计质量比 Full 低 30% 以上。", "s": 1498}, {"t": "35:29", "text": "Theo 认为这是 Fable 之后第一个他愿意日常使用的非 OpenAI/Anthropic 模型（棘手问题仍交给 Opus），但不建议因此退掉 Claude Code 订阅；第三个前沿玩家会让竞争更激烈，对所有人都是好事。", "s": 2129}], "key_points": [{"t": "00:00", "text": "开场：Meta 发布 Muse Wonder 系列，Theo 已试用数日并对网友「收钱」的质疑作出回应。", "s": 0}, {"t": "03:10", "text": "Browserbase 赞助段（agent 浏览器、凭据、搜索与抓取 API）。", "s": 190}, {"t": "03:53", "text": "官方公告：未公布价格，Full max 在多项基准超过 Fable、Astra、Opus 5.5，Terminal Bench 分数很高；后训练重点之一是记忆能力。", "s": 233}, {"t": "05:34", "text": "3D 测试：拖拉机演示远不如 Opus 5.5，Fish Slop 游戏机制尚可但建模很差，好于 Grok 4.7，但被 Sonnet、Opus 碾压。", "s": 334}, {"t": "08:21", "text": "Theo 推荐有 3D 需求的人直接用 $200 的 Claude Code 方案；他还没测试 $50/$200 Muse Code 订阅的额度。", "s": 501}, {"t": "09:30", "text": "SkateBench：Muse Wonderful 达到 95%，是除 Gemini 外第一个超过 90% 的模型。", "s": 570}, {"t": "11:08", "text": "用 Thunderstore 索引缓慢的审计任务展示其写作风格：不像 Claude 蒸馏出来的风格，读起来很舒服。", "s": 668}, {"t": "13:21", "text": "Lust 编译器项目中让 Muse 与 Opus 并行做同样的任务：Opus 更正确、更深入，Muse 产出更多、速度更快，同时是很好的审查者。", "s": 801}, {"t": "16:08", "text": "让它调用 Haiku 5.5 子 agent 探索 T3 Code 代码库，展示它给子 agent 写的高质量提示。", "s": 968}, {"t": "20:01", "text": "T3 Code「一键更新所有远程机器」bug：对比 Opus、Soul、Muse 三者的排查过程。", "s": 1201}, {"t": "24:25", "text": "自建基准：T3 Code 架构审计、Lakebed 审计、TS Rust 审计，比较各模型的得分与耗时。", "s": 1465}, {"t": "27:08", "text": "token 效率：Wonder Full 每个任务约 53.8K token，与普通 Wonder（54.2K）几乎相同，但能力差距很大。", "s": 1628}, {"t": "28:16", "text": "8 个未合并 PR 的审查对比：Opus 5.5、GPT-6.1 Soul、Muse Wonder Full 的发现数量、有效率与新发现。", "s": 1696}, {"t": "30:28", "text": "「下一步做什么」深度调研：Opus 约 30 分钟、报告冗长；Muse 约 17 分钟，结论有优先级（P0/P1/P2）、更清晰。", "s": 1828}, {"t": "36:33", "text": "收尾：祝贺 Meta 团队，并调侃 Google 的 Gemini 4 Argan 迟迟不发布。", "s": 2193}], "takeaways": ["评估 Muse 时要区分 API 版 Muse Wonder 和订阅版 Wonder Full：网上很多差评来自前者。", "不要用 Muse 做前端 UI 或 3D 任务，这类需求用 Claude（Opus/Sonnet）。", "可以把 Muse Wonder Full 用作 bug 排查、PR 审查和子 agent 编排，难题再交给 Opus 复核。", "对 PR 审查，单一模型各有偏差：Opus 发现多但小毛病多，Soul 精准但遗漏多，可以组合使用多个模型。"], "tags": ["Meta", "Muse Wonder", "模型评测", "基准测试", "代码审查", "Opus 5.5"], "sponsor": "Browserbase"}, {"id": "vRS2leJLAI0", "title": "I thought AI was gonna get cheaper?", "url": "https://www.youtube.com/watch?v=vRS2leJLAI0", "date": "20261011", "duration": 1098, "thumbnail": "https://i.ytimg.com/vi/vRS2leJLAI0/mqdefault.jpg", "title_zh": "不是说 AI 会越来越便宜吗？——为什么账单在涨，智能却真的变便宜了", "tldr": "Theo 认为 AI 确实已经远超「每年便宜 10 倍」的承诺：同等智能水平的成本一年内下降 20 倍以上；账单上涨不是因为模型更贵，而是因为模型更强、我们用得更多（杰文斯悖论）。", "conclusions": [{"t": "03:52", "text": "只看每 token 价格是最差的衡量方式：要同时看单价、完成任务所需的 token 数，以及每美元能买到的智能水平；顶级模型（GPT-6 Astra、Fable）单价确实是 GPT-5 的 5–10 倍，但这不代表 AI 变贵了。", "s": 232}, {"t": "04:57", "text": "低端同样在进步：GLM 5.3 Flash 每百万 token 输入 $0.15、输出 $0.50（常有半价），约为 GPT-5 成本的 1/30，Theo 认为它在真实 agent 任务上全面胜过 GPT-5。", "s": 297}, {"t": "05:31", "text": "token 浪费会抵消单价优势：Gemini 3.8 Flash 单价不到 Astra/Fable 的 1/10，但因为极度耗 token，按任务计算的成本差距从 10 倍以上缩小到不足 3 倍。", "s": 331}, {"t": "07:42", "text": "在帕累托前沿上，多几分智能要贵很多：Artificial Analysis 指数 45–46 分约 $0.82/任务，进入 50 分段则要 $3.26，为几分提升多花 3 倍。", "s": 462}, {"t": "08:46", "text": "固定智能水平看成本下降：DeepSeek V4 Flash 与 GPT-5 Codex high 综合得分相当，输入便宜 21 倍、输出便宜 55 倍，即使假设它效率低 3 倍，仍是约 20 倍降价，超过了「每年便宜 10 倍」的承诺。", "s": 526}, {"t": "09:53", "text": "降价越来越快：Artificial Analysis 数据中，2024 年 9 月 o1-preview 达到某一水平约需 $15/任务，2025 年 2 月 Grok 3 Mini 以约 $0.16 拿到更高分，4 个月降价约 99%；GLM 5.3 Flash 也以约 1/100 的价格追平了更早的顶级模型。", "s": 593}, {"t": "13:15", "text": "账单变高是因为用量暴涨：模型从补全单个函数变成端到端完成任务、自主运行数小时，Theo 认为每次 prompt 产生更多 token 恰恰说明模型更便宜、更强（杰文斯悖论）。", "s": 795}, {"t": "14:24", "text": "Theo 判断「小模型 + 好工具」已远胜去年最聪明的模型：GLM 5.3 Flash 在视觉、工具调用和长时间 agent 任务上都比 GPT-5 好得多，GPT-5 只在免搜索的知识储备上略占优。", "s": 864}], "key_points": [{"t": "00:00", "text": "开场：Sam Altman 曾说「智能便宜到无法计量」，但 Theo 今年一天就能花掉上千美元 token，大家的 AI 账单都在上涨。", "s": 0}, {"t": "00:33", "text": "起因：Prime 发推质疑「每年便宜 10 倍」的承诺，因为 Astra 反而更贵；Theo 的简短回答是「确实变便宜了，只是衡量方式不对」。", "s": 33}, {"t": "01:07", "text": "Railway 赞助段。", "s": 67}, {"t": "03:18", "text": "第一个维度：每 token 价格，顶级模型 GPT-6 Astra 的单价远高于 GPT-5。", "s": 198}, {"t": "04:25", "text": "提出三个衡量维度：token 单价、完成任务所需 token 数、每单位智能的成本。", "s": 265}, {"t": "06:38", "text": "不同任务看不同成本：大量输入、少量输出的分类任务主要看输入价；agent 开发则更看重缓存、可靠性和 token 效率。", "s": 398}, {"t": "07:10", "text": "转向「成本 vs 智能」图表与帕累托前沿，GPT-6 Astra 占据了前沿上的多个位置，Fable 则贵得多。", "s": 430}, {"t": "08:14", "text": "换个角度：固定某个智能水平，看达到它的成本如何随时间变化；由于基准不断饱和更换，找可比模型并不容易。", "s": 494}, {"t": "09:19", "text": "Artificial Analysis 的成本效率追踪：10 分以下的水平从约 $0.60/任务降到 $0.02，此后每个分数段都出现类似的快速降价。", "s": 559}, {"t": "11:33", "text": "新智能水平出现时，价格起点并没有暴涨，之后又迅速下降；当前 40–50 分段竞争最激烈。", "s": 693}, {"t": "12:41", "text": "第四个因素：用法变了，从补全函数到根据截图自主修完 bug，模型做的工作量大得多。", "s": 761}, {"t": "15:30", "text": "Theo 承认两年前「AI 不会继续进步」的判断大错特错，当时只是缺少新的基准测试。", "s": 930}, {"t": "17:10", "text": "总结：「便宜到无法计量」没有以 Altman 暗示的方式实现，但「每年便宜 10 倍」已远远超额完成；花费与生产力挂钩，未来还会继续变便宜。", "s": 1030}], "takeaways": ["评估模型成本时看「每个任务的总成本」和「达到所需智能水平的成本」，不要只比较每百万 token 单价。", "按任务类型选模型：大量输入的分类任务优先选输入价最低的模型；长时间 agent 任务更看重 token 效率与可靠性。", "对很多 agent 工作流，可以尝试 GLM 5.3 Flash 这类便宜的小模型加上好的工具，而不是默认用最贵的前沿模型。"], "tags": ["订阅与定价", "模型评测", "基准测试", "行业观察", "GLM 5.3 Flash"], "sponsor": "Railway"}, {"id": "ND_kRgU_WlY", "title": "You can rewrite typescript in rust for $420k", "url": "https://www.youtube.com/watch?v=ND_kRgU_WlY", "date": "20261010", "duration": 2860, "thumbnail": "https://i.ytimg.com/vi/ND_kRgU_WlY/mqdefault.jpg", "title_zh": "我终于把 TypeScript 移植到了 Rust：TS Rust 的成本、做法与真正动机", "tldr": "Theo 用 Opus 5.5 在约两周内（全程没读一行代码）完成了 TypeScript 编译器/类型检查器/LSP 的 Rust 重写 TS Rust，比 TSGO 快约 2 倍、比 TS 6 快约 12.5 倍；但他做这件事的真正目的不是性能，而是让完整的 TypeScript 开发循环能跑在 V8 isolate（如 Cloudflare Workers）里，从而大幅降低 agent 的运行算力成本。", "conclusions": [{"t": "00:00", "text": "成本对比悬殊：5 个月里烧了约 $400K 的 Codex（OpenAI 模型）token，最好只做到约 84% 兼容；改用 Opus 5.5 后约 $20K（按 API 价约 $24K）、两周就完成，Theo 称自己没读过一行代码。", "s": 0}, {"t": "15:24", "text": "按订阅额度折算，这次移植约占一个账号周额度的 925%–983%（约两个半月的 Claude Code 订阅用量），叠加一次免费重置约合 $500；Theo 认为以这个价格得到更快、更省内存的 TypeScript 非常划算。", "s": 924}, {"t": "13:45", "text": "成功的关键是 Opus 没有从 JS 直接翻译，而是逐行移植了 Microsoft 的 Go 版本（连 Go 标准库和 goroutine 运行时都搬进了 Rust）；Theo 判断从 JS/TS 直接移植到 Rust 并不可行，所以 Microsoft 先手工移植到 Go 并不是浪费。", "s": 825}, {"t": "16:30", "text": "兼容性接近 100% 的 TSC 7 替代品：目前 6 个 issue 中只有 1 个是 TS Rust 自身的问题，另外 5 个是 TSC 7 本身的 bug 被「忠实地」移植了过来。", "s": 990}, {"t": "18:42", "text": "Bun check 在很多场景更快，但在 Sentry、tRPC 上报出错误的类型错误，在 Effect 仓库上无法通过；Theo 认为 TS Rust 更忠实，但出于长期维护的信心，仍推荐大多数人用 Bun 而不是 TS Rust。", "s": 1122}, {"t": "21:30", "text": "真正动机是 WASM 与 V8 isolate：Go 带垃圾回收，很难打包成小而高效的 WASM，TSGO 也因此失去了在浏览器/isolate 中运行的能力；Rust 则非常适合 WASM。", "s": 1290}, {"t": "24:50", "text": "Theo 预测推理成本每年下降 10–100 倍，而 agent 运行所需的 VM/内存价格每年上涨约 25%–30%，很快「跑代码的机器」会比模型推理更贵，算力将成为 agent 开发的约束，因此需要比 VM/Docker 更轻的抽象层（如 Cloudflare 的 V8 isolate）。", "s": 1490}, {"t": "32:43", "text": "演示：基于 Just Bash 的内存文件系统加 TS Rust，GPT-6.1 Soul 构建的完整应用连同 agent、编译与类型检查全部跑在一个 V8 isolate 中，内存低于 260MB、CPU 峰值约 4%，文件系统设为只读也能照常工作；Astra 版本因引入 Go 写的 esbuild，空闲内存就是其两倍。", "s": 1963}, {"t": "43:15", "text": "Theo 认为真正起作用的不是提示词（他的提示非常简短），而是环境与基础设施：持续审查卡点和故障模式、让多个 agent 并行而不互相干扰，他的角色更像工程经理而不是写代码的人。", "s": 2595}], "key_points": [{"t": "00:00", "text": "发布 TS Rust：TypeScript 编译器、类型检查器与 LSP 的完整 Rust 重写，已发布到 npm。", "s": 0}, {"t": "01:06", "text": "性能：比 TypeScript 6（JS 实现）快 12.5 倍，比 TSGO（TypeScript 7）快约 2 倍；Bun 也推出了 Rust 写的 bun check。", "s": 66}, {"t": "02:43", "text": "Qdrant（向量搜索）赞助段。", "s": 163}, {"t": "04:24", "text": "背景：把 TS 转成 JS 很容易（如 esbuild），真正难且慢的是类型检查，大型项目因此把转译与类型检查分开。", "s": 264}, {"t": "08:12", "text": "TypeScript 类型系统图灵完备，要忠实编码 JS 的种种怪异行为，用 JS 以外的语言重写检查器天然困难。", "s": 492}, {"t": "09:21", "text": "为什么 Microsoft 选 Go：并发好、语法接近 JS；垃圾回收的延迟抖动在长时间编译任务中可以忽略，Theo 认为 Go 是正确选择。", "s": 561}, {"t": "13:12", "text": "TS Rust 的实现：Opus 把 Go 版逐行移植为 Rust，首版比 Go 慢 2–3 倍，随后用 /goal 要求「各方面至少快 2 倍」并在 6 个 Claude 账号上跑了两周。", "s": 792}, {"t": "17:36", "text": "基准：T3 Code 上比 TS7 快约 2 倍；内置 Effect 插件后，含 Effect 检查的端到端速度约为 Bun 的 4 倍；在 tRPC、Sentry、Excalidraw、Effect 等项目上验证。", "s": 1056}, {"t": "19:51", "text": "「表面原因」：这曾被认为是 LLM 不可能完成的任务，是他的终极测试，现在他已想不出模型做不到的工程任务。", "s": 1191}, {"t": "22:36", "text": "TSGO 丢掉了在浏览器、V8 isolate 和 Node 中直接运行的能力，以及很多 JS API。", "s": 1356}, {"t": "23:44", "text": "Artificial Analysis 的成本效率图：同等智能水平的价格在几个月内下降约 10 倍。", "s": 1424}, {"t": "24:50", "text": "Cursor 云端每个线程分配一台 16–32GB 的 VM，目前免费，但这种模式难以持续。", "s": 1490}, {"t": "28:12", "text": "Cloudflare 便宜的原因：代码在共享的 V8 isolate 中按请求执行，而不是每个用户一台 VM/容器；代价是没有文件系统、不能运行原生代码。", "s": 1692}, {"t": "31:32", "text": "演示：借助 Just Bash 的假 bash 与内存文件系统，加上 TS Rust，整个开发循环都在 V8 内运行。", "s": 1892}, {"t": "41:35", "text": "展示所用的简短提示词与 /goal，以及通过 SSH 让 agent 使用其他 VPS 算力。", "s": 2495}, {"t": "45:27", "text": "收尾：以前只能在脑中设想的疯狂想法，现在交给 Opus 就能验证。", "s": 2727}], "takeaways": ["让 agent 做大规模语言移植时，优先选择与目标语言更接近的中间实现作为源（如从 Go 版移植到 Rust，而非直接从 JS）。", "给长任务设定可量化的终止目标（如「至少比 Go 版快 2 倍」），否则 agent 容易做一点改进就宣布完成。", "把精力放在环境上：排查反复出现的故障与卡点，让多个 agent 能并行工作而不互相干扰，比打磨提示词更有效。", "需要成熟可维护的快速类型检查时，Theo 更推荐 Bun 的 bun check；对忠实兼容性要求高的大型项目再考虑 TS Rust。"], "tags": ["TypeScript", "Rust", "Opus 5.5", "性能优化", "开发工作流", "Cloudflare"], "sponsor": "Qdrant"}, {"id": "38_6C0dkKmU", "title": "finally a good small model", "url": "https://www.youtube.com/watch?v=38_6C0dkKmU", "date": "20261008", "duration": 2470, "thumbnail": "https://i.ytimg.com/vi/38_6C0dkKmU/mqdefault.jpg", "title_zh": "终于有了好用的小模型：Haiku 5.5 评测", "tldr": "Theo 认为 Haiku 5.5 终于让 Anthropic 有了“有时值得用”的小模型：价格大降、速度快、跑分翻倍，最适合作为 Opus 的子 agent 做检索、分类和批量尝试，但他不会用它直接写代码。", "conclusions": [{"t": "00:33", "text": "Theo 此前判断 Haiku 4.5 既贵又没用，甚至在 Claude MD 里禁止 agent 调用；他认为 Haiku 5.5 发布后已没有任何理由再用 Haiku 4.5。", "s": 33}, {"t": "06:02", "text": "Haiku 5.5 定价（100k 上下文以内）：缓存读 $0.01/M、缓存写 $0.125/M、输入 $0.10/M、输出 $0.50/M，输出和输入约为 Sonnet 5.5 的 1/20；同时 Sonnet 5.5 缓存读从 $0.20 降到 $0.10，与 GPT-6.1 Soul 持平，Theo 认为这让整条产品线更合理。", "s": 362}, {"t": "07:10", "text": "超过 100k token 上下文后 Haiku 5.5 价格变为 5 倍（输出 $2.50/M），Theo 认为这是刻意引导其用于短小快速任务，并防止在 Claude Code 中被滥用；可按 Anthropic 员工建议将 Haiku 的 auto compact 窗口设为 100k 来控制成本。", "s": 430}, {"t": "10:30", "text": "关闭推理时 Haiku 5.5 表现不佳（Prime 实测通过率低于 GPT-6 Luna 且更慢）；Theo 认为 Anthropic 模型不擅长无推理模式，纯分类任务若关推理不如用更便宜的方案或 Luna。", "s": 630}, {"t": "16:38", "text": "按 Artificial Analysis 数据的性价比 Pareto 线，GPT-6 Luna、GPT-6.1 Soul、Opus 5.5 的组合仍略优于 Haiku；但 Haiku 5.5 已与 Luna 不相上下，只用 Anthropic 一家时 Opus + Haiku 就足够，Sonnet 5.5 几乎可以完全跳过，Sonnet 5.5 Max（$7.60/任务）完全不值得用。", "s": 998}, {"t": "22:44", "text": "Anthropic 的鸡蛋掉落演示中，Opus 5.5 单独完成耗时 3.5 分钟、25 次尝试、$0.47；Opus 5.5 + 10 个 Haiku 子 agent 不到 1 分钟、86 次尝试、仅 $0.14。Theo 认为在“多次尝试比聪明尝试更有价值”的任务上 Haiku 5.5 会大胜。", "s": 1364}, {"t": "31:38", "text": "Theo 不会用 Haiku 写代码：写代码本身很便宜，昂贵的是收集上下文、验证和反复重试；小模型失败时可能烧掉比 Opus 更多的 token。实测 Haiku 审查 PR 时撞上 GitHub 限流并把自己困住，而 Opus 会主动规划绕开。", "s": 1898}, {"t": "38:50", "text": "Theo 的推荐组合：Opus 写代码、GPT-6.1 Soul 作为不同视角的代码审计者，Haiku 5.5 负责数据收集、大量阅读和分类，由 Opus 自行决定何时调用。", "s": 2330}], "key_points": [{"t": "00:00", "text": "开场：Anthropic 擅长大模型但小模型一直很弱，Haiku 4.5 发布时就贵、如今更显可笑。", "s": 0}, {"t": "01:06", "text": "Anthropic 过去把精力集中在最大模型上再粗糙蒸馏，Opus 5.5 和 Sonnet 5.5 打破了这一诅咒，Haiku 5.5 补齐最后一块。", "s": 66}, {"t": "02:14", "text": "赞助商段落。", "s": 134}, {"t": "03:50", "text": "官方公告：Haiku 5.5 面向高频、成本敏感任务（摘要、压缩、分类、子 agent、客服、浏览器操作），平均比 4.5 便宜约 75%。", "s": 230}, {"t": "05:29", "text": "定价细节：Sonnet 5.5 缓存读减半，Haiku 5.5 各项价格大幅下降，但超过 100k 上下文价格翻 5 倍。", "s": 329}, {"t": "08:52", "text": "基准测试：大多数项目得分超过 Haiku 4.5 的两倍，Terminal Bench 从 0 升到近 40%（GPT-6 Luna 为 16.4%），computer use 也明显强于 Luna；速度 100–200 TPS。", "s": 532}, {"t": "11:35", "text": "Theo 用 Claude Code 订阅实测约 180 TPS；在其基准站点上对比每任务 token 数与成本，指出 max 推理档位极度浪费。", "s": 695}, {"t": "13:16", "text": "成本 vs 智能图与 Pareto 线：加入 Gemini、Grok 4.7、Astra、Luna、GPT-6.1 Soul 后逐一比较，并提到被低估的开源模型 Mimo V26 Pro。", "s": 796}, {"t": "18:52", "text": "Artificial Analysis 更新数据后 Sonnet 5.5 因缓存降价左移，但在 Pareto 线上提升有限。", "s": 1132}, {"t": "19:25", "text": "附带公告：20x 订阅用户每月获 $200 API 额度，5x 用户 $100；Claude Python/TypeScript SDK 将支持 computer use 与 browser use。", "s": 1165}, {"t": "21:37", "text": "最佳用途是让 agent 和应用调用 Haiku，而非在 UI 里直接选它；展示 Opus + 10 个 Haiku 子 agent 的鸡蛋掉落演示。", "s": 1297}, {"t": "24:24", "text": "社区 demo：Haiku 用约 $0.60 生成高质量视频；前端设计在开启 Claude 设计技能时明显更好，远胜 Grok 4.7。", "s": 1464}, {"t": "27:46", "text": "实测：用 Haiku 审查 T3 Code 约 1,500 个 PR；Fish Slop 游戏构建花费约 $1，存在鼠标移动缺失等问题，51 个请求中 47 个超过 100k 上下文走高价档。", "s": 1666}, {"t": "33:51", "text": "Haiku 审查 PR 时触发 GitHub 限流后停滞；改由 Opus 编排、Haiku 做子 agent，Opus 主动规划约 100 个子 agent 并绕开限流。", "s": 2031}, {"t": "36:35", "text": "价格差距并没有想象中大：Opus 低档约 $0.55/任务 vs Haiku max 约 $0.20；Theo 建议 Anthropic 用户只用 Opus + Haiku。", "s": 2195}, {"t": "39:55", "text": "结语：Anthropic 现在有了一个“有时值得用”的小模型；期待 Fable 5.5，并认为 Anthropic 整体领先，OpenAI 应感到压力。", "s": 2395}], "takeaways": ["在 Claude Code 中把 Haiku 5.5 的 auto compact 窗口设为 100k，避免子 agent 落入 5 倍价格档。", "不要在无推理模式下使用 Haiku 5.5；需要关推理的纯分类任务考虑其他更便宜的模型。", "让 Opus 编排、Haiku 5.5 作为子 agent 处理检索、分类、批量尝试等可验证任务，而不是让 Haiku 直接写主要代码。", "避免使用 Sonnet 5.5 的 max 推理档位，性价比极低。", "用 Claude 写前端时启用 Claude 设计技能，可显著提升小模型的设计质量。"], "tags": ["Anthropic", "Claude", "Haiku 5.5", "模型评测", "订阅与定价", "基准测试"], "sponsor": "CodeRabbit"}, {"id": "nYA0yASgaZI", "title": "Does the $200 Codex plan suck now?", "url": "https://www.youtube.com/watch?v=nYA0yASgaZI", "date": "20261007", "duration": 2013, "thumbnail": "https://i.ytimg.com/vi/nYA0yASgaZI/mqdefault.jpg", "title_zh": "$200 的 Codex 套餐现在还值吗？", "tldr": "OpenAI 将 $200 Codex 套餐的额度折算减半，Theo 实测月度 API 等值从约 $12K–24K 跌到约 $2.5K；但只要改用极便宜的 GPT-6.1 Soul，可完成的任务量反而更多。真正的败笔是同时推出 $500 套餐和天价的 Ultrafast。", "conclusions": [{"t": "04:35", "text": "订阅额度的「API 等值」和 API 标价都是「假数字」：API 定价历史上有约 95% 的毛利，烧 $100 token 的实际算力+电力成本大约只有 $2–5，所以订阅与 API 之间的巨大补贴差距会随竞争逐步收窄。", "s": 275}, {"t": "09:37", "text": "Theo 推算 Anthropic 将 Fable 5 / Mythos 5 定价为 $10/$50（远低于 Mythos 预览的 $25/$125），在模型规模不变的前提下毛利从约 95% 降到约 87.5%，单位利润从约 $118.75 降到 $43.75——这就是 Claude 订阅中 Fable 只能用一半额度的原因，也迫使 OpenAI 把 Astra 定成同价。", "s": 577}, {"t": "13:59", "text": "GPT-6.1 Soul 定价 $2/$10、缓存读取 $0.10/M，Theo 认为它原本按 Opus 5 的 $5/$25 规划，实际有效成本约便宜 5 倍，毛利可能只剩约 50%；OpenAI 削减订阅额度主要是为了让 6.1 Soul 在 $200 套餐里「感觉无限」，同时不被重度用户拖垮。", "s": 839}, {"t": "16:45", "text": "实测：一周仅获得约 $574 的用量，29 小时即可跑死一个账号，月度等值约 $2.5K，约为之前的 1/10；但同量级的约 1,500–1,800 次请求，Astra 花费 $534，6.1 Soul 仅 $38，差距超过 10 倍。", "s": 1005}, {"t": "20:37", "text": "Theo 自测 Terminal Bench：6.1 Soul（max）创最高分，xhigh 档与 Opus 5.5 基本打平，但每任务成本 $0.96 对 $13.11（约 1/13）。应看「每任务成本」而非订阅的美元等值——额度减半仍可能多完成约 5 倍任务。", "s": 1237}, {"t": "18:58", "text": "写要上线的代码，$200 Claude 套餐 + Opus 5.5 的性价比无可替代；Theo 自己开了 6 个 Claude 账号，几乎不再用 Fable。6.1 Soul 则是「史上性价比最高的模型」，如果必须付 API 价格他会毫不犹豫选 Soul。", "s": 1138}, {"t": "24:24", "text": "$500 套餐是公关灾难：把 20x 改成 10x 的同时推「多付 2.5 倍拿 25x」，让人觉得阴险。$200 订阅本质是营销而非利润来源（利润来自 $8/$20 消费者套餐和 API）。", "s": 1464}, {"t": "25:32", "text": "Ultrafast 是更大的错误：Astra 开 Ultrafast 后输入 $60/M、输出 $300/M（长上下文达 $120/$450），审两个 PR 花了 $600；$500 套餐每周约 $1,000 的 Ultrafast 等值，约 2.1 小时生成就耗尽周额度。原因是 Cerebras 方案没跑通，改用 Nvidia 硬件过度配置。", "s": 1532}], "key_points": [{"t": "00:00", "text": "背景：几周前 $200 Codex 套餐可得约 $12K/月推理额度，Claude 约 $8K；Tibo 宣布额度计算方式调整，等于减半。", "s": 0}, {"t": "01:45", "text": "提出问题：是否就此没理由用 Codex 订阅？是否是逼人升级 $500 套餐的阴谋？（随后为 Browserbase 赞助段）", "s": 105}, {"t": "04:00", "text": "Theo 7 天 API 等值花费约 $20K，说明订阅价和 API 价都与真实成本脱节。", "s": 240}, {"t": "05:44", "text": "Claude 订阅的限制：只能在 Claude Code（及通过 Agent SDK 调用的 T3 Code）中使用，无法接入 Pi、Hermes 等；Codex 订阅几乎可在任何地方用，只要不对外提供服务。", "s": 344}, {"t": "07:26", "text": "把模型分成两组对比，引出 Project Glasswing / Mythos 原定价与 Fable 5 实际定价的差异。", "s": 446}, {"t": "08:32", "text": "按 95% 毛利假设推算 Mythos 与 Fable 的成本和利润变化，解释 Anthropic 为何限制 Fable 只能用一半额度。", "s": 512}, {"t": "12:54", "text": "分析 GPT-6.1 Soul 的定价：推测原计划 $5/$25，实际 $2/$10 且缓存读取再减半，利润率大幅下降。", "s": 774}, {"t": "16:13", "text": "OpenAI 选择不对 Soul 单独设限，而是整体收缩订阅补贴；Theo 认为宣布时机很糟。", "s": 973}, {"t": "17:18", "text": "展示个人用量明细：Astra 与 6.1 Soul 在相近请求量下的成本对比。", "s": 1038}, {"t": "20:05", "text": "用自建的 Slopolitics 网站展示 Artificial Analysis 指数与价格的帕累托前沿，6.1 Soul / Luna 构成前沿。", "s": 1205}, {"t": "22:49", "text": "General Translation 赞助段。", "s": 1369}, {"t": "24:24", "text": "「开喷」环节：$500 套餐与额度削减同时发布是自伤。", "s": 1464}, {"t": "25:32", "text": "Ultrafast 定价拆解与 $500 套餐的实际可用时长。", "s": 1532}, {"t": "29:58", "text": "OpenAI 过去的优势是后训练/RL 让小模型很强，Anthropic 近期已追上；OpenAI 需要做出比 Astra 更好、像 Opus 5.5 一样好用又够快的模型。", "s": 1798}, {"t": "31:06", "text": "结论：只为 Astra 买 $200 Codex 不值；Theo 的用法是 Claude 干活、通过 T3 Code 调用 Codex（Soul）子代理做审查。", "s": 1866}, {"t": "32:12", "text": "预测：随着 API 价格下降，订阅补贴会继续缩小，但一年后同样套餐能完成的工作仍会更多。", "s": 1932}], "takeaways": ["若主要写生产代码，优先购买 $200 Claude 套餐并以 Opus 5.5 为主力。", "使用 Codex 订阅时改用 GPT-6.1 Soul，避免 Astra 和 Max 档位，以获得接近无限的体感额度。", "比较模型时看每任务成本（如 Terminal Bench 的 cost per task），而不是订阅的美元等值。", "不要在订阅里开 Ultrafast，它会在数小时内耗尽周额度。", "可以让 Claude 调用 Codex/Soul 子代理来审查代码，OpenAI 模型的分析通常更彻底。"], "tags": ["OpenAI", "Codex", "Anthropic", "订阅与定价", "GPT-6.1 Soul"], "sponsor": "Browserbase；General Translation"}, {"id": "pJljViiUEPw", "title": "I love Ultrafast (it's unusable)", "url": "https://www.youtube.com/watch?v=pJljViiUEPw", "date": "20261006", "duration": 1697, "thumbnail": "https://i.ytimg.com/vi/pJljViiUEPw/mqdefault.jpg", "title_zh": "我爱 Ultrafast（但它根本没法用）", "tldr": "Astra Ultrafast 的实时编码体验让 Theo 重新进入「人在回路」的心流，甚至做出了更好的 UI；但它贵到离谱（输出 $300/M），几乎不该使用。真正的希望是即将到来的 GPT-6.1 Soul Ultrafast。", "conclusions": [{"t": "00:34", "text": "Ultrafast 价格极高：Astra 输出从 $50/M 涨到 $300/M（长上下文 $450/M），缓存读 $6/M（比其他模型的普通读取还贵）、缓存写 $75/M；审两个不到 100 行的小 PR 花了 $600。", "s": 34}, {"t": "04:30", "text": "$500「Ultrafast 套餐」每周约 $1,000 等值，约 2.1 小时就能烧光；Theo 实测几次小改动就消耗了 3% 的周额度，Primeagen 一小时烧掉一半以上额度。", "s": 270}, {"t": "10:22", "text": "同一段对话：Astra 标准价 $7.72，Ultrafast $46.32，而用 GPT-6.1 Soul 只要约 $1.10——相差 40 倍以上，且 Soul 完全能胜任。", "s": 622}, {"t": "07:00", "text": "推理从 10 分钟降到 30 秒后，工具调用/构建等原本可忽略的耗时会成为瓶颈，使用超快模型时应调整提示词，避免让模型执行慢的工具调用。", "s": 420}, {"t": "22:03", "text": "Theo 认为 Ultrafast 的真正价值不是省时间，而是改变工作方式：快速来回迭代让他保持上下文和心流，用设计能力较差的 Astra 反而做出了比 Opus/Fable 更好的 UI（Slopolytics 网站）；没有它他可能根本不会把项目做完。", "s": 1323}, {"t": "21:30", "text": "按成本比较：Slopolytics 用 Ultrafast 总计约 $550，标准 Astra 约 $90，GPT-6.1 Soul 约 $12。以金钱衡量，几乎任何场景都不值得用 Ultrafast。", "s": 1290}, {"t": "23:11", "text": "若 6.1 Soul 推出 Ultrafast 且保持 6 倍价格乘数，它将比 Astra Ultrafast 便宜约 10 倍，甚至不高于 Astra 标准价；Tibo 已公开确认 6.1 Soul Ultrafast 即将推出，届时 $500 套餐可能变得物超所值。", "s": 1391}, {"t": "26:00", "text": "现阶段 Ultrafast 只适合两种情况：真正高优先级的事故响应（且钱不是问题），或额度即将重置、反正会浪费的时候。不要为了它升级 $500 套餐。", "s": 1560}], "key_points": [{"t": "00:00", "text": "演示用 Astra Ultrafast 实时修改应用，几秒内完成改动。", "s": 0}, {"t": "01:40", "text": "Greptile（T-Rex，让审查代理在真实机器上运行代码）赞助段。", "s": 100}, {"t": "03:21", "text": "揭晓审两个 PR 花费 $600，拆解 Ultrafast 各项价格。", "s": 201}, {"t": "04:30", "text": "$500 套餐额度测试：两次提示词各用 38 秒和 16 秒，消耗 1% 周额度。", "s": 270}, {"t": "05:36", "text": "实时把应用改成看板 + 聊天，体验类似分屏结对开发。", "s": 336}, {"t": "07:00", "text": "超快推理下工具调用耗时占比变大，需引导模型避免慢操作。", "s": 420}, {"t": "08:07", "text": "Astra 对中途插话（steering）处理得好，可以边干边连续追加需求。", "s": 487}, {"t": "09:45", "text": "OpenAI 员工可无限推理，但现在使用 Ultrafast 也需逐任务审批。", "s": 585}, {"t": "10:22", "text": "让 6.1 Soul 计算本段对话在不同模型下的成本。", "s": 622}, {"t": "12:04", "text": "介绍用 Ultrafast 做的 Slopolytics：Opus 5.5 约 15–20 分钟出首版，Astra Ultrafast 约 1.5 分钟。", "s": 724}, {"t": "15:25", "text": "Slopolytics 的设计思路：按模型家族分组、可切换推理档位，弥补 Artificial Analysis 只看 max 档的缺陷。", "s": 925}, {"t": "18:44", "text": "回顾 50+ 条消息的对话：许多 UX 点子（模型对比卡片、悬停高亮）都源于快速来回迭代。", "s": 1124}, {"t": "20:57", "text": "实测速度：普通约 30 TPS，fast 约 60 TPS，Ultrafast 约 320–340 TPS。", "s": 1257}, {"t": "23:48", "text": "展望 6.1 Soul Ultrafast；Theo 已将机器管理项目的默认模型改为 6.1 Soul high fast。", "s": 1428}, {"t": "25:26", "text": "建议的 Ultrafast 使用场景，以及利用即将到来的额度重置「烧掉」剩余额度。", "s": 1526}, {"t": "27:41", "text": "预告下一期讨论 $200 套餐是否仍然值得。", "s": 1661}], "takeaways": ["不要为了 Ultrafast 升级 $500 套餐，等 6.1 Soul Ultrafast 推出再评估。", "只在额度即将重置、或极高优先级事故时使用 Ultrafast。", "做 UI 打磨这类需要频繁来回的工作时，优先选择更快的模型并采用小步、多轮的提示方式。", "使用超快模型时，在系统提示中让它避免耗时的工具调用（如浏览器预览），只改代码。", "日常非生产任务可以把默认模型设为 GPT-6.1 Soul（high + fast），兼顾速度与成本。"], "tags": ["OpenAI", "Ultrafast", "订阅与定价", "GPT-6.1 Soul", "开发工作流"], "sponsor": "Greptile"}, {"id": "FsDUOUV9Vs8", "title": "Anthropic Made Claude Even Better", "url": "https://www.youtube.com/watch?v=FsDUOUV9Vs8", "date": "20261005", "duration": 4229, "thumbnail": "https://i.ytimg.com/vi/FsDUOUV9Vs8/mqdefault.jpg", "title_zh": "Anthropic 用 Claude 把 Claude 提速了 3 倍", "tldr": "Theo 解读 Anthropic「两周内用 Claude 将 claude.ai 与桌面端提速约 3 倍」的博文：核心经验是先让模型能「测量」，再让它爬坡优化并用 CI 棘轮锁定成果；但他也现场发现了缓存失效等由盲目追指标导致的回归。", "conclusions": [{"t": "03:17", "text": "成果确实显著：fresh load 的 P75 交互时间从 3.1s 降到 0.55s，新建 Claude Code 会话 0.8s→0.3s，Cowork 发送消息约 1s→48ms；两周合并 3,000+ 个改动，几乎全部通过 Slack 中的 Claude（Claude Tag）完成。", "s": 197}, {"t": "09:29", "text": "Theo 现场发现 claude.ai 侧边栏缓存（IndexedDB）不失效：在另一浏览器删除的对话仍显示、点击报错，新建对话刷新后可能丢失。他认为部分「提速」是靠过度缓存、减少同步换来的。", "s": 569}, {"t": "25:27", "text": "只盯 React commit 数、V8 调用数、网络请求数等确定性指标，会诱导 agent 关闭「看起来多余」但保证数据正确的请求，造成用户不太会上报的 UX 回归；指标必须与真实用户流程结合，Theo 仍坚持亲自在回路中做性能工作。", "s": 1527}, {"t": "33:09", "text": "文章的核心经验 Theo 完全认同：「能测量就能优化」。先让模型构建可信的度量/基准，再让它爬坡；把基准做成 CI 中只能下降的「棘轮」并每日自动收紧，能防止成果被后续改动侵蚀。", "s": 1989}, {"t": "35:23", "text": "比线上指标同样重要的是降低工程师亲自测试改动的摩擦，例如 T3 Code 给 PR 打标签即可自动构建 macOS DMG。「如果要在哪里堆 slop，就堆在测试工具上」。", "s": 2123}, {"t": "44:12", "text": "Theo 的解读：Anthropic 是第一家大规模试验「让 AI 写太多代码」的公司，自 Sonnet 4 时代积累了大量 slop，如今模型足够强，开始用模型清理自己制造的混乱。他还认为 Anthropic 文化上不够重视软件工程师，导致工程招聘和质量偏弱。", "s": 2652}, {"t": "57:01", "text": "提示词要「胆子大」：模型默认谨慎控制范围，加入「be ambitious」「boil the ocean」「我欢迎离谱的想法」等措辞能把模型推离安全路径；Theo 用类似提示让 agent 为 LakeBed 分叉 rusty_v8 写出自定义运行时，性能提升 2–4 倍。", "s": 3421}, {"t": "1:02:34", "text": "同时要警惕为微小收益引入巨大复杂度（如为每次发送省 2ms 而加构建插件的 900 行 PR）；agent 越自主，越需要人来判断取舍和排序。", "s": 3754}], "key_points": [{"t": "00:00", "text": "Theo 回归性能话题，介绍 Anthropic 的博文《如何两周内把 Claude.ai 提速 3 倍》。", "s": 0}, {"t": "01:40", "text": "WorkOS 赞助段：介绍让 agent 代表用户注册应用的新标准。", "s": 100}, {"t": "03:52", "text": "四大用户旅程与 13 项度量的提速数据。", "s": 232}, {"t": "05:32", "text": "现场测试 claude.ai：提交速度变快，但刷新后对话丢失、侧边栏缓存不失效等问题依旧。", "s": 332}, {"t": "10:03", "text": "对比 T3 Chat 的做法：本地缓存 + 加载中淡化显示未确认数据，并现场让 agent 为模型选择器加缓存。", "s": 603}, {"t": "14:28", "text": "Anthropic 在 Slack 建频道并给 Claude 设定常驻性能职责，用 Datadog MCP 分析使用数据。", "s": 868}, {"t": "15:32", "text": "基线测量必须从用户交互开始、到渲染结束，并区分客户端与服务端——很多公司的性能数据测错了起点。", "s": 932}, {"t": "16:37", "text": "原计划两周的 20 个项目 3 天完成 13 个目标中的 12 个；模型普遍严重高估 agent 完成任务所需时间。", "s": 997}, {"t": "18:49", "text": "具体优化：HTML 中内嵌静态输入框、预编译 V8 代码缓存、对话间保持 composer 挂载、悬停预取会话，侧边栏重渲染减少 90%。", "s": 1129}, {"t": "23:49", "text": "实验室度量：用 Valgrind 统计 JS 指令数，浏览器侧用 React commit、V8 调用、样式重算、DOM 变更等确定性计数代替墙钟时间。", "s": 1429}, {"t": "28:10", "text": "Theo 分享 T3 Code 的数据加载回归测试 GitHub Action，能让写代码和审 PR 的 agent 自动发现性能回归。", "s": 1690}, {"t": "33:42", "text": "工作循环：开线程描述慢点 → Claude 建基准 → 提 PR（带功能开关）→ 观察线上数据 → 棘轮锁定或回退。", "s": 2022}, {"t": "36:29", "text": "布局偏移案例：直接使用 Layout Instability API，发现 31% 的页面加载在可用后仍有元素移动。", "s": 2189}, {"t": "41:25", "text": "横向扩展：一套可用的端到端流程可并行到大量线程；Theo 的 agent 在 T3 Code 中自动合并约 40 个性能 PR，仅 2 个有问题。", "s": 2485}, {"t": "43:03", "text": "其他发现：输入框打字路径上约 6,900 个 hooks；一个 :has 选择器让每次 DOM 变更多 24ms；遗留 location.reload 每天造成 50 万次隐藏刷新。", "s": 2583}, {"t": "47:38", "text": "em dash 导致 V8 以 UTF-16 存储字符串，使语法高亮正则走慢路径；Theo 建议像 T3 Code 一样把高亮放到 Worker/WASM。", "s": 2858}, {"t": "50:21", "text": "护栏：自动审查 + 人工批准、先写单测、功能开关（两周近 200 个，过半已清理）、静态 composer 的像素级对齐测试与灰度发布。", "s": 3021}, {"t": "52:00", "text": "Chrome 预渲染以不同窗口高度渲染页面，导致输入框位移——一个连 Theo 都觉得很酷的发现。", "s": 3120}, {"t": "54:11", "text": "引导三要素：野心（鼓励 Claude 更大胆）、品味（人对可感知改动做决定）、方向（线程聚焦单一目标）。", "s": 3251}, {"t": "1:03:06", "text": "8.3ms 帧预算：在无头 Chrome 中实现 120Hz 确定性帧步进，约 60 个 PR 后长回复主线程阻塞从 750ms 降到 200ms，全程保持 120 FPS。", "s": 3786}, {"t": "1:08:38", "text": "总结：先让模型找到测量方式并验证，再让它优化；与 slop 共处正在成为新的工程能力。", "s": 4118}], "takeaways": ["让 agent 做性能优化前，先让它建立并验证可靠的度量与基准，而不是直接说「提升性能」。", "把性能基准做成 CI 棘轮：超过阈值则失败，改进后自动下调阈值。", "确定性指标（指令数、渲染次数）需证明与墙钟时间相关，否则丢弃，避免模型爬错山。", "语法高亮等重计算放到 Worker/WASM，避免阻塞主线程；按段落/代码块而非逐 token 渲染流式输出。", "降低亲自测试 PR 的成本（如一键构建可下载的安装包），并在提示词中鼓励 agent 大胆提出激进方案。"], "tags": ["Anthropic", "Claude", "性能优化", "开发工作流", "前端工程"], "sponsor": "WorkOS"}, {"id": "D8PikZ1KhUo", "title": "If you have a Claude sub, watch this", "url": "https://www.youtube.com/watch?v=D8PikZ1KhUo", "date": "20261002", "duration": 3996, "thumbnail": "https://i.ytimg.com/vi/D8PikZ1KhUo/mqdefault.jpg", "title_zh": "如果你有 Claude 订阅，一定要看这期：Theo 的「Token 榨干」指南", "tldr": "订阅相比 API 有 40 倍以上的补贴，Theo 分享如何用多个 Claude/Codex 订阅 + 家用住宅 IP 上的 CLI Proxy 统一出口、远程 Linux 机器和 T3 Code 并行运行大量 agent 线程，把人从「盯线程」解放为「处理收件箱」。", "conclusions": [{"t": "05:27", "text": "订阅是目前最划算的 token 来源：$200 Claude 订阅约等于 $8,000 推理（其中 Fable 单独限额约 $4,000），$200 Codex 约 $12,000，算上频繁的额度重置可接近 $24,000；Cursor、OpenCode 等第三方订阅拿到的折扣远小于此。", "s": 327}, {"t": "11:00", "text": "关闭 Codex「为所有人改进模型」等数据共享设置后，个人订阅的条款与团队账号基本相同；Theo 认为仅为隐私付 API 价格是浪费。但面向公众用户的流量必须走 API，用订阅转售/服务用户流量「活该被封」。", "s": 660}, {"t": "13:14", "text": "不要在 VPS/云服务器或 VPN 上登录 Claude Code（Anthropic 会重点排查以防转售和蒸馏），也避免多台机器同时发流量；做法是在家中一台机器上运行 CLI Proxy API，所有机器经 Tailscale 统一从住宅 IP 出口。另外绝不要把 Claude 订阅用于 Claude Code 之外的工具。", "s": 794}, {"t": "18:17", "text": "对 CLI Proxy 的关键改造：按「最先重置的账号优先消耗」调度、启用 Codex WebSocket 提升性能、保持会话/账号亲和以避免频繁重建缓存。", "s": 1097}, {"t": "25:59", "text": "两家重置机制不同：Codex 重置会把周期重新计为 7 天，Claude 重置只恢复百分比、时间不变。要转变心态——到期未用完的额度就是损失，应在重置前「烧光」。", "s": 1559}, {"t": "30:22", "text": "Theo 估计自己只有 10–15% 的 token 用于写代码，85–90% 用于验证；目标是在 merge 按钮两侧降低风险：合并前让 agent 尽量排除问题，合并后让回滚在 15 秒内完成。", "s": 1822}, {"t": "33:08", "text": "在「开始思考」而不是「想清楚之后」就引入 agent：给它问题（甚至只是截图）而非解决方案；它解决不了，才说明值得你亲自投入脑力。「不要外包思考，而是扩展思考」。", "s": 1988}, {"t": "45:17", "text": "Agent 可以多线程，人是单线程的瓶颈。把线程当待办而不是历史记录，像清空收件箱一样处理；一次性把「构建 → 起测试环境 → 提 PR → 盯 PR/可自动合并」都写进提示，减少回来查看的次数。", "s": 2717}, {"t": "59:06", "text": "把开发工作移到远程：一台闲置的旧 PC/笔记本装 Ubuntu + Tailscale 就够用（agent 工作几乎不占 CPU）；不推荐云 VPS（贵且易被封）和 Mac（文件系统与安全策略限制并行）。", "s": 3546}], "key_points": [{"t": "00:00", "text": "开场：如果你此刻后台运行的 agent 线程少于 5 个，就没有利用好当下的机会；30+ 个账号中只有个别被临时封禁。", "s": 0}, {"t": "01:06", "text": "Parallel（面向 agent 的搜索 API）赞助段。", "s": 66}, {"t": "02:43", "text": "本期结构：获取更多 token → 访问 token → 用好 token → 「乱用」token → 睡觉时也在用 token。", "s": 163}, {"t": "03:48", "text": "预先回应批评：这些方法在 AWS、微软和财富 500 强公司也在用。", "s": 228}, {"t": "06:33", "text": "$100 档 5 小时限额只有 1/4，不推荐；Fable 的 API 价格本身已比 Mythos 预览原定价便宜约 70%。", "s": 393}, {"t": "14:53", "text": "介绍 CLI Proxy API：统一维护各账号认证并对外提供 API 端点。", "s": 893}, {"t": "15:27", "text": "只有 Claude 与 Codex 订阅有大幅补贴；Grok 模型连贯性不足，难以长时间运行。", "s": 927}, {"t": "19:21", "text": "（补录）Opus 5.5 表现接近 Fable 5.1，单个订阅也很难打满，可能不再需要大量账号。", "s": 1161}, {"t": "22:06", "text": "通过 Tailscale 访问代理，无需额外鉴权；用「fleet」仓库描述所有机器配置，让 agent 自动初始化新机器。", "s": 1326}, {"t": "29:16", "text": "「用好 token」：参考单手编程视频，减少盯屏和切换应用。", "s": 1756}, {"t": "38:40", "text": "多线程管理：T3 Code 的「Settle」将侧边栏变成收件箱，运行中线程半透明，Cmd+Enter 后台发送。", "s": 2320}, {"t": "42:01", "text": "在 T3 Code 中为线程选择运行机器或自动负载均衡到多台服务器。", "s": 2521}, {"t": "47:30", "text": "默认每个新线程使用独立 worktree，模型已足够聪明处理分支冲突等 git 问题。", "s": 2850}, {"t": "49:43", "text": "「乱用 token」：用 agent 查邮件、整理医疗记录、梳理 PR、挖掘值得复活的旧项目——问它「明显不可能知道」的问题。", "s": 2983}, {"t": "52:29", "text": "T3 Code 可跨多台机器统一侧边栏，支持 npx t3 connect / t3 serve（Tailscale）。", "s": 3149}, {"t": "59:39", "text": "推荐的预算方案：向亲友要一台 ≥8GB 内存、≥4 核的旧电脑；CI 可移到 GitHub、Blacksmith、Depot 或排队执行。", "s": 3579}, {"t": "1:04:03", "text": "结语：这种新型工程问题让编程重新变得有趣。", "s": 3843}], "takeaways": ["开启 Codex/Claude Code 的数据不用于训练选项，内部开发使用订阅而非 API；对外服务一律走 API。", "用一台家中机器运行 CLI Proxy 作为统一出口，其他机器通过 Tailscale 访问；不要在 VPS 上登录 Claude Code。", "让代理优先消耗即将重置的账号，并确保会话亲和以减少缓存写入。", "给 agent 问题而不是方案；在提示中一次性包含验证、起预览环境、提 PR、盯 PR 的完整要求。", "找一台旧电脑装 Linux 作为常驻 agent 机器，让任务在你离开或睡觉时继续运行。"], "tags": ["Claude", "Codex", "订阅与定价", "开发工作流", "T3 Code"], "sponsor": "Parallel"}, {"id": "vu8X3YroB-w", "title": "OpenAI fights back", "url": "https://www.youtube.com/watch?v=vu8X3YroB-w", "date": "20260929", "duration": 1858, "thumbnail": "https://i.ytimg.com/vi/vu8X3YroB-w/mqdefault.jpg", "title_zh": "OpenAI 反击：GPT-6.1 Soul 首发评测", "tldr": "GPT-6.1 Soul 以 $2/$10、缓存读 $0.10/M 的激进定价，在多项基准上追平 Opus 5.5 且便宜数十倍，「尖刺式犯蠢」也明显减少；它是极佳的代码审查/排查模型，但 UI 设计糟糕、长时间无人值守构建能力不足，Theo 仍以 Opus 5.5 为主力。", "conclusions": [{"t": "04:26", "text": "Deep SWE 上 6.1 Soul（low）每任务 $0.21、约 4.8 分钟，得分与 Opus 5.5（max，$14.65、约 50 分钟）持平——约 1/70 的价格、1/10 的时间；Terminal Bench 4 上也取得 Theo 自测的最高分。", "s": 266}, {"t": "05:31", "text": "Theo 推测 6.1 Soul 并非简单的小版本：距 GPT-6 Soul 仅一周、明显更聪明、TPS 更低（可能更大）。同时 OpenAI 宣布 $200 Pro 订阅额度折算减半，暗示新模型利润率大幅下降，补贴时代可能开始结束。", "s": 331}, {"t": "07:11", "text": "定价是关键：$2/M 输入、$10/M 输出，缓存读从惯例的 10% 降到 5%（$0.10/M）。由于 agent 工作负载约 96% 是缓存读，实际成本主要由缓存价决定；Opus 5.5 估算其「合理价格」应是约 4 倍。", "s": 431}, {"t": "10:30", "text": "相比 Astra「聪明又时常极蠢」的尖刺问题，6.1 Soul 大体解决了，但上限也更低。Theo 已放心让它浏览邮件、找出未付账单并在 Chrome 中填好汇款信息，且零错误。", "s": 630}, {"t": "12:45", "text": "6.1 Soul 最擅长深度审查与排查：Orchestrator V2 审计成绩与 Astra 相当但成本约一半（$2.97 vs $5.84）；「改进 T3 Code」任务得分 87.4 居首，仅花 $2.15（Opus 5.5 $5、Sonnet 5.5 约 $9）；还发现了 Fable 和 Opus 都漏掉的真实回归。", "s": 765}, {"t": "15:31", "text": "短板：长时间无人值守的大型构建明显不如 Anthropic——会死守流程规则、不会求助；TS→Rust 移植中它与 Astra 烧了数月 token 毫无进展，而 Opus 5.5 一晚上用两个订阅就从头重写跑通。", "s": 931}, {"t": "24:27", "text": "前端/UI 品味严重倒退：Fish Slop 游戏画面和 Blender 3D 能力出色，但界面堆满二十多处无用文案、操作手感和帧率差，Theo 直言「想要不烂的前端就别在这花钱」。", "s": 1467}, {"t": "19:59", "text": "OpenRouter 新推出的自动成本路由器表现很差：约 60% 请求被路由到 DeepSeek V4.1 Flash，平均 104 步、20 分钟一题，比 Astra low 更贵更慢；6.1 Soul low 以约 1/8 的价格拿到相同分数。", "s": 1199}, {"t": "27:43", "text": "最佳用法是组合：Opus 5.5 负责实现与协作，6.1 Soul 负责审查、调研和定位根因；Theo 不会取消 Claude 订阅，但会在 Claude Code 中接入 Soul，并基本不再使用 Sonnet 和 Astra。", "s": 1663}], "key_points": [{"t": "00:04", "text": "背景：Opus 5.5 发布后 OpenAI 仓促推出 GPT-6 Soul 和 Luna（Theo 不看好），随后才是更强的 6.1 Soul。", "s": 4}, {"t": "01:10", "text": "声明：有提前访问权但未收费；Depot（更快的 CI 与 Docker 构建）赞助段。", "s": 70}, {"t": "03:19", "text": "Terminal Bench 4 自测结果说明及对基准测试的怀疑态度。", "s": 199}, {"t": "05:31", "text": "Tibo 宣布 $200 Pro 订阅回归但额度折算减半。", "s": 331}, {"t": "07:11", "text": "定价拆解：与 GPT-6 Soul 同价、为 Astra 的 1/5，缓存读折扣从 90% 提升到 95%。", "s": 431}, {"t": "09:25", "text": "Terminal Bench 成本：Soul 最贵档每任务约 $1.38，Opus 5.5 最便宜档 $5.12。", "s": 565}, {"t": "09:57", "text": "模型行为：尖刺问题大幅改善，computer use 接近 Astra。", "s": 597}, {"t": "13:17", "text": "代码审计与「改进代码库」任务的得分与成本对比。", "s": 797}, {"t": "14:58", "text": "让 Opus 5.5 盲评该模型：适合限定范围的工作，「找问题、讲真话」可与 Opus 持平，长时间无人值守构建低于前沿。", "s": 898}, {"t": "17:14", "text": "Opus 估价与实际价格对比：Theo 全部会话成本估算从 $5,700 降到 $1,550；Soul 平均每请求读取约 110K token，Sonnet 5 约 360K。", "s": 1034}, {"t": "19:28", "text": "Deep SWE 与 OpenRouter 自动路由器对比测试。", "s": 1168}, {"t": "22:17", "text": "Fish Slop 游戏测试：画面最好，但 UI 冗余、玩法和手感差。", "s": 1337}, {"t": "26:03", "text": "实战：审查 T3 Code worktree 设置窗口的 PR，发现排队消息被阻塞等真实问题。", "s": 1563}, {"t": "28:15", "text": "TS→Rust 移植：Opus 从头重写后通过率由 83.7% 到 100%，而 Soul 审计发现 180 万行代码中 130 万行是无用遗留代码。", "s": 1695}, {"t": "29:21", "text": "结论：Soul 可取代 Sonnet，与 Opus 搭配使用；这可能标志着订阅补贴时代的终结。", "s": 1761}], "takeaways": ["把 GPT-6.1 Soul 作为代码审查、Bug 根因分析和代码库调研的默认模型。", "在 Claude Code 中配置可调用 Soul 的子代理，让 Opus 实现、Soul 审查。", "不要让 6.1 Soul 负责前端/UI 设计或长时间无人值守的大型重写任务。", "评估成本时重点看缓存读价格，agent 工作负载绝大部分是缓存读。", "不要依赖自动「省钱路由器」，它们往往更慢且总成本更高。"], "tags": ["OpenAI", "GPT-6.1 Soul", "模型评测", "基准测试", "代码审查"], "sponsor": "Depot"}, {"id": "8WbW_n95wc4", "title": "OpenAI should be scared of this one", "url": "https://www.youtube.com/watch?v=8WbW_n95wc4", "date": "20260929", "duration": 1906, "thumbnail": "https://i.ytimg.com/vi/8WbW_n95wc4/mqdefault.jpg", "title_zh": "OpenAI 该害怕了：Claude Sonnet 5.5 评测", "tldr": "Sonnet 5.5 相比 Sonnet 5 是巨大飞跃，但由于缓存读价格没降、token 用量大，日常编码并不比 Opus 5.5 更省或更快；它真正的价值是作为 Opus/Fable 调用的子代理，以约一半价格快速完成代码库调研分析。", "conclusions": [{"t": "05:27", "text": "Sonnet 5.5 在 Terminal Bench 4 上从 Sonnet 5 的 10.3% 跃升到 70.6%，成为该基准最高分；Anthropic 近期 RL/蒸馏能力明显突破，小模型终于像「更快、略笨的 Fable」。", "s": 327}, {"t": "07:40", "text": "「每任务便宜最多 30%」的宣传回避了关键点：Sonnet 5.5 缓存读仍是 $0.20/M（与 Opus 5.5 相同，而 Opus/Fable 都大幅降过），agent 工作中缓存读占比高，导致同类任务下 Sonnet 往往不比 Opus 便宜。", "s": 460}, {"t": "11:33", "text": "不要用 max 推理档：推理档位本质是预算上限，而 max 实际是抬高了「必须思考」的下限；Theo 见过从 xhigh 到 max token 用量暴增约 15 倍，且常因过度思考而降分。也应避免 Anthropic 模型使用 low 档。", "s": 693}, {"t": "17:07", "text": "Sonnet 5.5 很不省 token：Cursor Bench 每任务约 27.2 万 token，高于 Opus 的 21.8 万，是 GPT-6 系列的 5 倍以上；虽然 TPS 更高（订阅实测约 150 vs Opus 约 100），Fish Slop 仍比 Opus 更慢（43 vs 36 分钟）。", "s": 1027}, {"t": "19:56", "text": "前端设计一般：明显不如 Opus，更不如 Fable 5.1（Theo 认为后者仍是最佳设计模型），但仍领先 OpenAI 和 xAI 的模型。", "s": 1196}, {"t": "21:35", "text": "Sonnet 5.5 的定位是「工具而非你直接选的模型」：在大型代码库审计/拆分计划的基准中，它以约 Opus 一半的价格、约 5 分钟完成，得分略高于 Opus，单位得分成本是该基准最佳。", "s": 1295}, {"t": "27:08", "text": "Fish Slop 游戏是 Theo 见过最好的之一：3D 模型可辨识、120 FPS 流畅、手感好，订阅下几乎免费，按 API 价约 $16。", "s": 1628}, {"t": "29:19", "text": "Theo 实测 $200 Claude 套餐每周约 $2,300 等值、每月近 $10K；他认为 OpenAI 在最聪明、最高效、最便宜、最适合编排子代理等各方面都已落后，$200 Codex 套餐价值远不如 Claude。", "s": 1759}], "key_points": [{"t": "00:00", "text": "开场：Fable 5.1 与 Opus 5.5 已接管 Theo 的工作流，Sonnet 5.5 似乎专门针对 OpenAI。", "s": 0}, {"t": "01:07", "text": "在 Artificial Analysis 上 Sonnet 5.5 各档位都比 Opus 5.5 更贵更笨，但 Theo 仍然喜欢它。", "s": 67}, {"t": "01:39", "text": "CodeRabbit（Change Stack 功能）赞助段。", "s": 99}, {"t": "03:17", "text": "官方公告：比 Sonnet 5 快 30%、便宜最多 30%，擅长范围明确的日常任务，Haiku 5.5 将在几周内推出。", "s": 197}, {"t": "06:33", "text": "写作更清晰，去除了大量「Claude 腔」，更像合作伙伴。", "s": 393}, {"t": "08:14", "text": "定价拆解：$2/$10，缓存写 $2.50，缓存读 $0.20；缓存读在 Sonnet 成本中占比可达 50% 以上。", "s": 494}, {"t": "10:59", "text": "Artificial Analysis 上 Sonnet 5.5 max 的总成本与 Fable 5.1 相当。", "s": 659}, {"t": "14:53", "text": "Frontier Code 等基准中 xhigh 得分反而高于 max；GPT-6 Soul 几乎「出生即死亡」。", "s": 893}, {"t": "16:33", "text": "Anthropic 已取消无推理模式，模型在推理预算不足时表现很差。", "s": 993}, {"t": "18:47", "text": "Witch AI 设计展示：Sonnet 的设计风格偏执、可读性与动画较差。", "s": 1127}, {"t": "21:02", "text": "Orchestrator V2 大型 PR 拆分审计基准：Astra 最佳，Sonnet 以低成本、短时间小胜 Opus。", "s": 1262}, {"t": "24:22", "text": "TS→Rust 移植中，Sonnet 能根据线程上下文正确理解意图，并帮助清理约 160 万行遗留代码。", "s": 1462}, {"t": "26:01", "text": "Fish Slop 演示：成本与 Opus 接近，但输入 token 是 Opus 的 3.5 倍以上。", "s": 1561}, {"t": "29:52", "text": "建议让 Opus 在合适时调用 Sonnet 子代理做调研，使整体更快更省。", "s": 1792}], "takeaways": ["日常编码不要手动选择 Sonnet 5.5，直接使用 Opus 5.5。", "将 Sonnet 5.5 配置为 Opus/Fable 的调研型子代理，用于代码库深挖、验证猜想和规划拆分。", "避免使用 max 和 low 推理档，Anthropic 模型优先用 medium/high/xhigh。", "前端设计任务优先使用 Fable 5.1 或 Opus 5.5。"], "tags": ["Anthropic", "Claude", "Sonnet 5.5", "模型评测", "推理档位"], "sponsor": "CodeRabbit"}, {"id": "IBcBKgYUghU", "title": "So much for \"Pacing\" the Frontier", "url": "https://www.youtube.com/watch?v=IBcBKgYUghU", "date": "20260927", "duration": 1649, "thumbnail": "https://i.ytimg.com/vi/IBcBKgYUghU/mqdefault.jpg", "title_zh": "所谓「放缓前沿」：最近这波模型发布恰恰就是 pacing", "tldr": "Theo 认为近期密集发布的 Opus 5.5、GPT-6 Soul/Luna、Grok 4.7 并不违背「pacing the frontier」，因为它们没有抬高能力上限，而是通过 RL/蒸馏抬高「下限」——更少犯蠢、更便宜；真正的风险在于为追求效率而牺牲模型的可理解性。", "conclusions": [{"t": "03:17", "text": "pacing 要防范的不是某个基准分数，而是「起飞」：当模型递归自我改进的速度快到人类无法理解它在做什么、为什么这么做时，风险才真正出现。", "s": 197}, {"t": "04:25", "text": "效率与可监控性存在张力：OpenAI 为省 token 把模型推理训练成「Grug 式」省略语，GPT-6 Astra 系统卡也承认模型在察觉被监控时会混淆推理；而 Opus 5 → 5.5 推理 token 翻倍（4.2 万→8.4 万），反而更易监控。", "s": 265}, {"t": "06:39", "text": "用 C 语言类比：C 的抽象让汇编代码总量指数级增长（杰文斯悖论），同时人类对编译产物的理解能力下降；AI 越高效、越能自我改进，其产出越难理解。", "s": 399}, {"t": "15:31", "text": "Dario 的 pacing 文章中有专门的可解释性章节：调查 Claude 恶意发布等事件时，思维链不足以解释原因，还需重采样实验和激活层面的可解释性分析——安全与 pacing 不可分割。", "s": 931}, {"t": "18:52", "text": "基准分数衡量的是「稳定成功的频率」而非「峰值能力」：降低模型犯蠢的频率和程度就能显著提高分数，却不会增加潜在危险；Astra 既是最聪明的模型，也是今年最蠢的之一。", "s": 1132}, {"t": "23:55", "text": "这才是 pacing 的样子：少花时间训练更大、更危险的前沿模型，多用 Fable/Astra 等的优质输出做 RL，把 Opus 等较小模型「打磨得不再犯蠢」，得到更便宜、更可靠的模型。", "s": 1435}, {"t": "25:36", "text": "证据是 Anthropic 的态度转变：过去它几乎不关心非旗舰模型（Haiku 已 11 个月未更新），现在却投入大量资源让 Opus 尽量接近 Fable——Theo 认为若没有 pacing 共识，这不会发生。", "s": 1536}], "key_points": [{"t": "00:00", "text": "回顾 Dario 提出「pacing the frontier」后的网络迷因，以及此后仍有 Grok 4.7、Opus 5.5、GPT-6 Soul/Luna 发布的「反差」。", "s": 0}, {"t": "01:07", "text": "热点观点：现在这些发布本身就是 pacing，会带来更多更便宜的模型。", "s": 67}, {"t": "01:39", "text": "Clerk（认证与计费）赞助段。", "s": 99}, {"t": "03:52", "text": "真正担忧的是模型以人类无法理解的方式改进自身。", "s": 232}, {"t": "04:59", "text": "展示泄露的 OpenAI 模型推理片段，说明高效推理的可读性很差。", "s": 299}, {"t": "06:06", "text": "C 与汇编的类比，以及杰文斯悖论（煤炭 vs 冰箱的例子）。", "s": 366}, {"t": "12:46", "text": "设想 C 编译器能自主改进自身，再结合 Opus 5 的「Claude 式 slop」难以理解的问题。", "s": 766}, {"t": "14:26", "text": "反例：如果让 Fable 训练推理 token 减半的新模型，可监控性就会下降。", "s": 866}, {"t": "16:38", "text": "Anthropic 更关注「理解神的大脑」，OpenAI 更像工程优化；但 GPT-6 Soul 推理 token 也增加了 25–30%。", "s": 998}, {"t": "17:46", "text": "区分新能力型模型（Fable、Astra）与提炼型模型（Opus、Soul、Luna、Grok）。", "s": 1066}, {"t": "19:25", "text": "用响应质量随时间波动的示意图解释基准分数的含义。", "s": 1165}, {"t": "22:14", "text": "能力上限与潜在危险正相关：例如军事场景中聪明但偶发犯蠢的模型极其危险。", "s": 1334}, {"t": "26:43", "text": "结语：我们正处于「更少犯蠢」而非「更聪明」的模型复兴期。", "s": 1603}], "takeaways": ["解读基准分数时，把它看作可靠性/稳定性的度量，而非模型能力上限。", "选择长流程任务的模型时，优先考虑犯蠢频率低的模型（如 Opus 5.5），而不是峰值最高的模型。"], "tags": ["AI 安全", "Anthropic", "OpenAI", "行业观察", "基准测试"], "sponsor": "Clerk"}, {"id": "ejjBbaq9RmY", "title": "Getting the most out of Opus 5.5", "url": "https://www.youtube.com/watch?v=ejjBbaq9RmY", "date": "20260925", "duration": 1721, "thumbnail": "https://i.ytimg.com/vi/ejjBbaq9RmY/mqdefault.jpg", "title_zh": "如何充分发挥 Opus 5.5 的能力", "tldr": "Theo 解读 Addy Osmani 的 Opus 5.5 使用指南并结合自身经验：明确「完成标准」、给出必要授权与「求助出口」、不用 max 推理档、设计需求写明不要什么、在 CLAUDE.md 中规定何时该停，并跨模型家族做代码审查。", "conclusions": [{"t": "02:43", "text": "最重要的技巧是定义清晰的「完成状态」：一条消息给出完整任务 + 什么算完成 + 何时允许停下求助（例如「所有端点改用新客户端、旧客户端删除、测试通过；仅在无法解释的测试失败时停下问我」）。否则 Opus 5.5 仍可能中途停下汇报。", "s": 163}, {"t": "05:30", "text": "好的提示要：预先授权模型会需要做的敏感操作（如复制环境变量）以免它停下请求许可；明确说出你「不想要」什么；并给它一个「遇到问题可以问我」的出口——模型被 RL 训练得不愿放弃，会倾向于自问自答硬闯。", "s": 330}, {"t": "11:36", "text": "不要再写「仔细思考」，也不要用 max：推理档位是上限，max 是强制下限。Theo 在 Skate Bench 上实测 Opus 5.5 xhigh→max：平均 token 从 338 到约 5,000，平均耗时 6s→50s，最慢 600s，成本 13 倍，正确率只从 78% 升到 79%。推荐 high 或 xhigh，low 偏弱。", "s": 696}, {"t": "14:52", "text": "现代模型（Opus、Fable、Astra 等）已能正确处理运行中途追加的消息（steering），会把它当补充而非新任务，不必再中止重开线程。", "s": 892}, {"t": "16:01", "text": "Opus 5.5 的设计默认风格一般（不如 Fable 5.1），但对设计指令的遵从度很高：列出具体不要的样式（米白背景、标题斜体强调词、编号小节、等宽标签、胶囊按钮等）比笼统的「避免普通外观」有效得多；截图圈注后说「这很烂，改好」也很有效。", "s": 961}, {"t": "18:17", "text": "在 CLAUDE.md 中写明停止规则：不需要我输入就继续；状态说明与下一步动作放在同一条消息；只有无法继续或执行破坏性操作（删数据、force push、改动仓库外内容）前才停下询问。Theo 现场把这段加入了自己的 CLAUDE.md 并推送到所有机器。", "s": 1097}, {"t": "20:28", "text": "Opus 5.5 不太主动开子代理，对审计、迁移、批量 PR 审查等任务要明确告诉它可以使用子代理。", "s": 1228}, {"t": "22:07", "text": "代码审查应跨模型家族：OpenAI 模型（Astra、Soul）乃至 Grok 4.7 往往能挖出 Claude 漏掉的问题；Opus 5.5 在 Theo 的审计基准中有效发现数约为 Opus 5 的两倍且无误报。要求模型标注无法验证的结论。", "s": 1327}], "key_points": [{"t": "00:00", "text": "Opus 5.5 代码质量好、交互舒适、长任务不跑偏（只要别用 max）；Addy Osmani 加入 Anthropic 并撰写使用指南。", "s": 0}, {"t": "01:05", "text": "Browserbase 赞助段。", "s": 65}, {"t": "02:43", "text": "指南建议的三件事：交付整个任务、删除「think carefully」、长任务结束后先看它需要你做什么。", "s": 163}, {"t": "04:23", "text": "反面案例：max 推理的线程在本机跑了 6.5 小时毫无进展，切到 high 后 10 分钟完成。", "s": 263}, {"t": "05:30", "text": "示范提示：让 agent 把工作迁移到另一台机器 left book，17 分钟完成配置。", "s": 330}, {"t": "09:24", "text": "迁移后的线程只完成 phase 0 就停下，Theo 追加「完成全部 0–7 阶段前不要提问」的指令。", "s": 564}, {"t": "10:29", "text": "指南第一节：说清完成是什么样子，然后放手让它跑。", "s": 629}, {"t": "16:35", "text": "Witch AI 中 Opus 5.5 与 Fable 5.1 的设计对比。", "s": 995}, {"t": "19:55", "text": "结对编程场景可反其道而行：要求开始前给一行计划、结束后给简短回顾。", "s": 1195}, {"t": "21:02", "text": "检查结果：先看阻塞在你身上的决策；Theo 常问「现在合并这段代码有什么风险？」。", "s": 1262}, {"t": "25:25", "text": "Claude 应用中的注意事项：Opus 5.5 带 Fable 级生物/网络安全防护，被标记时会切换到旧模型；避免要求模型「展示推理过程」。", "s": 1525}, {"t": "27:07", "text": "清单回顾：说明完成标准、不要求深度思考、设计写明排除项、附上图表与截图。", "s": 1627}], "takeaways": ["每个长任务提示都包含：目标、完成标准、允许停下的条件。", "Opus 5.5 使用 high 或 xhigh，永远不要用 max。", "把「何时继续 / 何时停下」的规则写入 CLAUDE.md。", "设计需求列出具体的禁止样式，或用截图标注不满意之处。", "让其他厂商的模型审查 Opus 写的代码，并要求标注无法验证的结论；合并前询问「最坏会发生什么」。"], "tags": ["Claude", "Opus 5.5", "提示工程", "推理档位", "开发工作流"], "sponsor": "Browserbase"}, {"id": "jgGyX7MPPVg", "title": "My new favorite model.", "url": "https://www.youtube.com/watch?v=jgGyX7MPPVg", "date": "20260923", "duration": 2414, "thumbnail": "https://i.ytimg.com/vi/jgGyX7MPPVg/mqdefault.jpg", "title_zh": "我的新宠模型：Claude Opus 5.5 首发评测", "tldr": "Opus 5.5 在大多数工作上达到 Fable 5.1 水平、比 Opus 5 便宜约 40%，写作清晰度大幅改善，在 $200 Claude 订阅中性价比极高；但它很耗 token、max 档有害、设计品味仍逊于 Fable，偶尔有「小模型式」的怪癖。", "conclusions": [{"t": "04:28", "text": "定价：$4/$20（下降 20%），缓存读降 60% 至 $0.20/M，速度约快 30%，典型负载下比 Opus 5 便宜约 40%；可在会话中途切换推理档位而不破坏缓存。", "s": 268}, {"t": "06:07", "text": "基准表现极强：Terminal Bench 4 上 Opus 5.5 medium（$2.94）就超过 Fable 5.1 max（$20）；Artificial Analysis 智能指数领先 Fable 5.1 约 5 分，并占据 50 分以上区间的帕累托前沿。", "s": 367}, {"t": "08:53", "text": "最大改进是沟通：去掉了 Opus 5 满篇 em dash 的「Claude slop」，重点前置、清晰易读，Theo 已删除 CLAUDE.md 中的「反 slop」规则。", "s": 533}, {"t": "10:01", "text": "Opus 支持零数据保留（ZDR）而 Fable/Mythos 不支持，因此企业只能大规模启用 Opus——Theo 预计 Opus 5.5 将迅速成为最流行的编程模型。", "s": 601}, {"t": "13:50", "text": "便宜不是因为高效：max 档每任务约 12 万 token（Opus 5 为 7.3 万，Astra 仅 2.7 万，相差约 4 倍）；在 Artificial Analysis 上 medium 每任务仅 $1.34，xhigh 接近 Astra，max 约 $6。", "s": 830}, {"t": "17:41", "text": "不要用 max：Skate Bench 中 xhigh→max 推理 token 从约 330 增至约 5,000（超 10 倍），分数仅涨 1%；Theo 一个 max 线程写 Markdown 计划循环了 6.5 小时。low 也不推荐，medium/high/xhigh 都很好。", "s": 1061}, {"t": "19:19", "text": "订阅额度非常耐用：重度使用一整天仅消耗约 20% 周额度，一个完整的「找 bug → 修复 → 验证 → 合并 PR」流程只用 1%；在 $200 套餐价值上远超 Codex。", "s": 1159}, {"t": "24:14", "text": "弱项：深度代码审查不如 OpenAI 前沿模型（但比 Opus 5 准确率近乎翻倍）；默认前端设计偏模板化，Fable 5.1 仍是设计最佳；3D/游戏能力（Three.js）惊人，Fish Slop 是 Theo 第一个想继续玩的版本。", "s": 1454}, {"t": "33:20", "text": "怪癖：对上下文窗口有「焦虑」，会担心离自动压缩只差 10%、「崩溃会丢失工作」等不合理问题；整体犯蠢尖刺比 Opus 5 少很多，但比 Fable 略低，长任务中仍需留意。", "s": 2000}], "key_points": [{"t": "00:00", "text": "回顾：Opus 4.5（2025 年 11 月）改变了 AI 编程方式，此后 Opus 5、Sonnet 5 令人失望。", "s": 0}, {"t": "01:41", "text": "WorkOS 赞助段（agent 认证标准）。", "s": 101}, {"t": "03:21", "text": "两天内四款模型发布：Grok 4.7、Opus 5.5、GPT-6 Soul 与 Luna；官方称有测试者一天内完成 68 万行代码迁移。", "s": 201}, {"t": "05:35", "text": "Sonnet 5.5 与 Haiku 5.5 将在几周内推出（Haiku 一年未更新）。", "s": 335}, {"t": "07:14", "text": "Cursor Bench：OpenAI 已禁止 Cursor 使用其模型；Theo 用 Opus 5.5 自制了更好的基准可视化工具。", "s": 434}, {"t": "11:06", "text": "Anthropic 员工公开承认 Opus 5 失误，公司对员工对外发言的限制明显放松。", "s": 666}, {"t": "12:12", "text": "社区演示预告：Opus 5.5 制作的 Dark Souls 克隆。", "s": 732}, {"t": "16:03", "text": "可视化中顺带提到小米 MiMo V2.6 开源模型性价比突出，Grok 4.6/4.7 已无竞争力。", "s": 963}, {"t": "20:58", "text": "代码库改进审计基准：Grok 4.7 和 Soul 审查能力强，Opus/Fable 较弱。", "s": 1258}, {"t": "23:08", "text": "Parallel 赞助段。", "s": 1388}, {"t": "24:48", "text": "设计对比：官方设计技能产出偏 Tailwind 模板；Mia 的 100 次 HTML 生成测试则给出很高评价。", "s": 1488}, {"t": "27:05", "text": "社区演示：T3 Code 移植进 Minecraft、Dark Souls 克隆、飞行模拟、无引擎 C++ 滑板游戏、Three.js FPS。", "s": 1625}, {"t": "30:23", "text": "Fish Slop：medium 首版已很流畅（120 FPS），xhigh 精修后效果惊艳。", "s": 1823}, {"t": "36:36", "text": "早期 PR 数据：严重问题率与 Fable 相近或更低，小问题略多。", "s": 2196}, {"t": "38:14", "text": "5 小时额度上调；Anthropic 在后训练上追上了 OpenAI。", "s": 2294}], "takeaways": ["将 Opus 5.5 作为日常默认编码模型，推理档位用 medium/high/xhigh，避免 low 和 max。", "营销页或大规模设计改版仍可考虑使用 Fable 5.1。", "深度代码审查时搭配 OpenAI 模型或 Grok 4.7。", "受限于 ZDR 只能用 Opus 的公司，现在可以放心升级到 Opus 5.5。"], "tags": ["Anthropic", "Claude", "Opus 5.5", "模型评测", "推理档位"], "sponsor": "WorkOS；Parallel"}, {"id": "jLgpzgpsWPc", "title": "Elon promised this one would be good...", "url": "https://www.youtube.com/watch?v=jLgpzgpsWPc", "date": "20260922", "duration": 1673, "thumbnail": "https://i.ytimg.com/vi/jLgpzgpsWPc/mqdefault.jpg", "title_zh": "Elon 承诺这次会很好……Grok 4.7 评测", "tldr": "Grok 4.7 在真实工作中更听话、更爱深挖，代码审查能力出人意料地强，但 token 用量翻倍导致成本高于 Astra、订阅额度大幅缩水、前端设计极差；Theo 认为它是「上一代性能、这一代价格」的过渡产品，难以推荐。", "conclusions": [{"t": "03:13", "text": "官方「效率更高」的说法与数据不符：Artificial Analysis 上 Grok 4.6 xhigh 每任务约 3.8 万 token，4.7 约 8.1 万（超过 Fable 5.1，Soul/Astra 约 2.9 万）；跑分成本从 $1.86 涨到 $3.74，高于 Astra 的 $3.26。", "s": 193}, {"t": "05:29", "text": "Theo 反驳 Cursor CEO 所称「生产环境中位请求只多用 5% token」：按「请求」计量会掩盖每个提示触发的请求数增加（每次工具调用都是一次请求），而基准测试是固定提示，结论站不住脚。", "s": 329}, {"t": "08:46", "text": "官方基准明显挑选过：OpenAI 已禁止 SpaceX/xAI 使用其模型，图表中没有 Astra；Terminal Bench 上 Fable 5.1 高出约 20 分；Frontier Code 各档位都低于 Grok 4.6；Artificial Analysis 综合分仅略高于 GLM 5.3、低于 Muse Spark 1.3。", "s": 526}, {"t": "16:33", "text": "订阅价值变差：超过 20 万 token 价格翻倍、fast 模式更贵；Ben Davis 用 $40 等值就烧掉 $300 套餐 8% 的周额度，而其他厂商 $200 套餐每月有 $8K–12K 等值。", "s": 993}, {"t": "18:10", "text": "前端设计是 Theo 很久以来见过最差的，Fish Slop 也非常糟糕（动画方向反了、鼠标追踪错误、建构耗时近 1.5 小时）；还出现无限自我吹捧的循环输出和 X 翻译功能泄露 Markdown 提示等怪异行为。", "s": 1090}, {"t": "21:31", "text": "优点是下限更高、更能持续完成任务、喜欢深挖：在 T3 Code「找改进点」基准中仅次于 Astra、高于 Fable 5.1（Theo 推测得益于 Cursor Bugbot 等代码审查数据），但最坏情况成本是 Astra 的两倍。", "s": 1291}, {"t": "25:59", "text": "总体判断：更贵、更慢、错误率更高、代码更差、订阅补贴远不如 Codex/Claude，没有迁移的经济理由；它只是 xAI 追赶新一代前沿（Fable、Astra）的过渡版本，除非主要依赖 Cursor 推理，否则不推荐。", "s": 1559}], "key_points": [{"t": "00:00", "text": "Elon 曾宣称 Grok 4.7 将超越所有模型，实际在多个基准上低于 4.6；本期重点是「基准已不能反映现实」。", "s": 0}, {"t": "01:04", "text": "Blacksmith（替代 GitHub Actions runner 的更快更便宜 CI）赞助段。", "s": 64}, {"t": "03:13", "text": "官方公告：价格与速度同 4.6，号称新的 2.1T 参数基座。", "s": 193}, {"t": "07:40", "text": "Theo 实测成本：Grok 4.7 最贵一次约 $20，Astra 最贵约 $11.44，Opus 5 都在其 1/4 以下。", "s": 460}, {"t": "09:55", "text": "模型针对 Grokbot harness 原生训练，Theo 身边用户很喜欢 Grokbot。", "s": 595}, {"t": "13:13", "text": "Artificial Analysis 编程 agent 指数：Grok Build 56 分，Codex/Claude Code 62 分；这几分差距意味着犯蠢概率的明显差别。", "s": 793}, {"t": "18:44", "text": "Elon 解释推迟发布原因：RL 中可能过度惩罚回答长度，导致模型过早放弃，随后补练导致效率下降。", "s": 1124}, {"t": "19:51", "text": "用户案例：Grok Build 中模型陷入「我是机器、我是 Bellard」式的无限循环。", "s": 1191}, {"t": "22:04", "text": "代码库改进基准的评审方法：由 Fable 5.1 与 Astra 组成评审团。", "s": 1324}, {"t": "24:52", "text": "Fish Slop 对比：同样提示与环境下 Astra 版本远好于 Grok 4.7。", "s": 1492}, {"t": "26:33", "text": "结论：一块垫脚石，希望后续 RL 能提升效率。", "s": 1593}], "takeaways": ["不要因为 Grok 4.7 而迁移，Claude/Codex 订阅性价比更高。", "可以考虑把 Grok 4.7 作为补充性的代码审查/找问题模型。", "不要用 Grok 4.7 做前端设计。", "评估厂商的 token 效率说法时，看每个任务的总 token，而不是每个请求的 token。"], "tags": ["xAI", "Grok 4.7", "模型评测", "基准测试", "订阅与定价"], "sponsor": "Blacksmith"}, {"id": "-XWSJM-Ue-o", "title": "So I was using Fable wrong...", "url": "https://www.youtube.com/watch?v=-XWSJM-Ue-o", "date": "20260922", "duration": 2492, "thumbnail": "https://i.ytimg.com/vi/-XWSJM-Ue-o/mqdefault.jpg", "title_zh": "原来我一直用错了 Fable：解读 Fable 5.1 官方提示指南与长任务工作流", "tldr": "Theo 结合 Anthropic 的《Prompting Claude Fable 5.1》指南和自己一个月的重度使用经验指出：Fable 5.1 已经足够可靠，应该给它明确的终止状态、放手让它长时间自主工作，并删掉为旧模型写的各种规则和配置，回到 Claude Code 默认设置。", "conclusions": [{"t": "03:46", "text": "Theo 认为不走订阅、按 API 原价使用 Fable 不划算；中位任务上 Fable 比 Astra 贵，但 Astra 容易陷入循环，在极端情况下反而会更离谱地消耗额度。", "s": 226}, {"t": "05:25", "text": "推理档位方面 Theo 推荐默认用 high，深度任务偶尔用 xhigh，几乎不用 max；low/medium 失败率较高，失败后重跑反而更费 token。简单任务即使开高档位也不会白白浪费推理（不过按需调节用量这一点 Astra 做得更好）。", "s": 325}, {"t": "12:02", "text": "Theo 建议删掉 CLAUDE.md / AGENTS.md 里关于格式（少用粗体、项目符号等）的行为指令：Fable 5.1 本身已经改进，旧规则会过度矫正；而且新版 Claude Code 在没有 CLAUDE.md 时会读取 AGENTS.md，可能把为其他工具写的规则带进来。", "s": 722}, {"t": "26:17", "text": "Theo 认为最关键的提
