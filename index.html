示技巧是在每条提示里写清「终止状态」（例如“一直盯着 PR 直到 CI 全绿再合并”或“提完 PR 就告诉我”），并给模型留出分支选项，从而尽量少回到这个线程，让它自己连续工作一个多小时。", "s": 1577}, {"t": "28:34", "text": "Theo 把「人陪着模型一步步做它本可以自己验证的事」类比成 TypeScript 函数里已经有类型标注还要再检查一遍类型：模型能自己定位根因、修复、验证、提 PR、处理评审意见时，人再逐步盯着就是浪费脑力。", "s": 1714}, {"t": "25:44", "text": "Theo 判断 Astra 是比 Fable 稍好一点的代码审查者，但 Fable 写代码明显更强；因此他常让 Fable 调用 Codex/Astra 来审查改动、做 computer use 验证（Claude 在 macOS 上的 computer use 不如 Codex）。", "s": 1544}, {"t": "35:45", "text": "Theo 认为对「dumb zone」的担忧已经过时：Anthropic 依据观察到的退化程度把上下文定为 1M token，模型现在很擅长压缩和长时间运行；缓存读取价格又降了 75%，压缩得更频繁反而更贵。T3 Code 因此去掉了上下文用量显示。", "s": 2145}, {"t": "40:12", "text": "Theo 主张重置心智模型：从全新环境安装 Claude Code，尽量少做配置（他只改了全屏和代理，并关掉了 memory），有具体问题再逐步添加；supervised、accept edits 这类权限模式已经过时，谨慎就用 auto，不怕风险就用 full。", "s": 2412}], "key_points": [{"t": "00:00", "text": "开场：Theo 因偏爱 Fable 而被 Sam Altman 称为 Anthropic 粉丝；Fable 的输出波动比 Astra 小，所以能一次跑更久，减少低谷也更有价值。", "s": 0}, {"t": "01:05", "text": "介绍 Anthropic 的《Prompting Claude Fable 5.1》指南，本期结合指南和自己的经验整理提示技巧。", "s": 65}, {"t": "03:46", "text": "推理档位：订阅用户 Fable 只占一半额度，Theo 默认 high，并现场演示简单任务开 max 也不会过度思考。", "s": 226}, {"t": "08:11", "text": "进度更新：5.1 在长时间工具调用过程中写的面向用户的进度更新少了很多；需要的话直接在提示里要求它边做边简短汇报、最后给出可独立阅读的总结。", "s": 491}, {"t": "09:49", "text": "API 变化：编辑历史消息后会丢失该线程的推理痕迹，用来防止蒸馏攻击。", "s": 589}, {"t": "10:22", "text": "写作密度：5.1 的套话更少，但句子更长、段落更密；可以把「mannered prose（矫饰文风）」定义为反模式，或直接要求去掉。", "s": 622}, {"t": "12:02", "text": "格式：删掉旧的反格式规则；注意 AGENTS.md 现在会被 Claude Code 读取；模型有时会大段引用原文却不标注为引用。", "s": 722}, {"t": "13:40", "text": "完成整个任务：在提示中推它别在活干完之前结束回合；Theo 展示自己的 babysit PR skill（只处理最新 push 之后的评论、核实 bot 意见、不要扩大范围、不发无意义评论）。", "s": 820}, {"t": "15:52", "text": "实例一：让 Fable 根据线程 ID 排查 T3 Code 中图片渲染失败的问题并提 PR，再让它比较社区贡献者的竞争 PR，自行决定方案并 babysit 到可以合并。", "s": 952}, {"t": "18:37", "text": "实例二（YOLO）：Lakebed 中由 Astra 写的约 2.6 万行 Rust V8 运行时改动；Fable 先指出风险，再补上 shadow mode、合成流量、健康检查计数器等 staging 观测能力，随后自主合并部署并测试了 1.5 小时（期间还误把 Theo 的 IP 打爆了）。", "s": 1117}, {"t": "23:32", "text": "Fable 复盘：差分测试在 160 步中强制了 1,400 次重算且结果全部正确，真正的风险在运维而非查询正确性；随后让它自行提 PR、babysit 到全绿后合并。", "s": 1412}, {"t": "25:12", "text": "用 Codex 补强：让 Fable 调用 Codex 做 computer use 和交叉审查，若发现问题就自行修复并重新验证。", "s": 1512}, {"t": "26:17", "text": "核心方法：明确终止状态、给出可选路径；用 TypeScript 重复类型检查的比喻说明不要替模型做它自己能做的验证。", "s": 1577}, {"t": "31:18", "text": "其他小技巧：可以告诉模型压缩时要保留什么；用官方给出的一段指令抑制擅自修复/扩展；低档位可能不触发搜索；避免安全防护误报（换种问法、提供冷门语言的文档、避免 base64）；主 agent 可以在子 agent 运行时继续干活；视觉任务配上裁剪/缩放工具效果更好。", "s": 1878}, {"t": "34:36", "text": "最后的大观点：不要再迷信「Claude Code-isms」，比如担心 dumb zone、手动管理上下文、过度定制配置和权限模式；保持默认设置、从头开始，有问题再逐步添加。", "s": 2076}], "takeaways": ["Fable 默认用 high 推理档位，深度任务用 xhigh，尽量避免 low/medium 导致失败后重跑。", "每条提示都写明终止状态（例如“babysit 到全绿后合并”“提完 PR 告诉我”），并给模型留出分支选项。", "清理 CLAUDE.md / AGENTS.md 中的格式类行为规则；如果需要进度更新或想去掉矫饰文风，直接在提示里写明。", "如果模型擅自扩大改动范围，加上官方给出的「发现无关问题不要修，在总结里作为后续项报告」指令。", "回到 Claude Code 默认配置，不要手动管理上下文；权限模式用 auto 或 full，而不是 supervised / accept edits。"], "tags": ["Claude", "Anthropic", "提示工程", "开发工作流", "推理档位", "Fable"], "sponsor": "Sentry、General Translation"}, {"id": "F3YXg7AaKWE", "title": "Jev is incredible", "url": "https://www.youtube.com/watch?v=F3YXg7AaKWE", "date": "20260921", "duration": 1829, "thumbnail": "https://i.ytimg.com/vi/F3YXg7AaKWE/mqdefault.jpg", "title_zh": "Typesafe AI 的 Jev：极快极便宜的「系统一」分类模型，以及它不该被用来做什么", "tldr": "Jev 是专做分类与结构化决策的「系统一」模型，输出格式 100% 符合给定 JSON、响应在 500ms 内、价格低到输出免费；Theo 认为它非常适合当作代码里的「智能 if 语句」，但不能拿来替代推理型 LLM，尤其不该用作 LLM 评审或上下文压缩。", "conclusions": [{"t": "00:00", "text": "Theo 判断 Jev 不是又一个更会写代码的 LLM，而是用于数据分类/整理的模型：给定格式就能完美返回类型安全的 JSON，不会替代 Fable、Astra 这类通用模型。", "s": 0}, {"t": "10:30", "text": "成本和速度是核心卖点：输入约 $0.04/百万 token（对比 Fable 约 $10/百万），输出 token「便宜到不计费」；传统 LLM 做同类分类要 3–300 秒，Jev 只需 70–500 毫秒，Theo 认可这 40–200 倍提速是真实的。", "s": 630}, {"t": "14:22", "text": "官方对比中 Jev 处理 27 个问题耗时 0.114 秒、成本约等于零，而 Terra 需 9 秒；分类质量上仅 Soul 和 Opus 5 胜过它，并超过 DeepSeek V4 Flash，在价格-性能前沿上领先近两个数量级。", "s": 862}, {"t": "17:06", "text": "结构化输出错误率 Jev 为 0%，Astra 的错误甚至多于 Terra 与 Luna 之和，Haiku 高达 45.5%；Theo 直言 Haiku 应该停止被使用于任何场景。", "s": 1026}, {"t": "12:41", "text": "Theo 强烈反对用 Jev 去评判多个 LLM 的输出：它只有 32k 上下文、不推理、无法浏览代码库，「智能程度大约相当于一个 switch 语句」，并批评 Braintrust 建议用 Jev 替代 LLM 评审器。", "s": 761}, {"t": "23:14", "text": "Theo 认为用 Jev 做上下文压缩是坏主意：压缩是综合摘要而非过滤；Jev 上下文太小、拿不到推理轨迹；模型在训练中已学会自身的压缩方式；删除早期历史还会使缓存失效、增加昂贵的 cache write，实测效果也很差。", "s": 1394}, {"t": "28:13", "text": "判断标准：如果人类在看完全部信息后 10 秒内就能回答，Jev 大概率适用；超过 10 秒、需要思考的任务就不适合（例如它把一半 T3 Code 对话都判为「值得做内容」）。", "s": 1693}, {"t": "29:51", "text": "Theo 的定位建议：把 Jev 当作要安装的库或要调用的函数，集成进自己构建的工具里，而不是在 Codex、Claude 或终端中拿它生成代码或文本。", "s": 1791}], "key_points": [{"t": "00:00", "text": "介绍 Typesafe AI 发布的 Jev：面向分类和结构化 JSON 输出的新模型，在 Twitter 上因计算机操作、玩 Minecraft、秒级压缩等演示爆火。", "s": 0}, {"t": "03:19", "text": "背景：创始人曾在 OpenAI 参与 ChatGPT 与 RLHF 研究；「系统一 / 系统二」概念来自《思考，快与慢》，名字取自杰文斯悖论——更便宜让更多用途变得可行。", "s": 199}, {"t": "04:25", "text": "适用场景：视频按主题归类、邮件重要性分类、内容安全与审核；Theo 的跳棋 demo 显示它几乎瞬间响应，但下棋水平很差。", "s": 265}, {"t": "06:06", "text": "官方公告：模型为代码直接调用而设计，「非结构化状态输入，带置信度的类型化决策输出」，采用新架构、并行采样器和面向校准决策的 RL；目前邀请制，可通过 OpenRouter、Vercel AI Gateway 访问。", "s": 366}, {"t": "07:44", "text": "对比 BAML：用 DSL 定义输出类型并在运行时修复格式错误的 JSON（GPT-OSS-120B 约一半时候 JSON 格式出错）；Jev 则从模型层面保证格式。", "s": 464}, {"t": "09:24", "text": "澄清确定性：输出的「形状」是确定的，内容不是但较可靠；每个输出都附带置信度，可围绕准确率做校准。", "s": 564}, {"t": "11:36", "text": "官方用例：智能 if 语句、对海量数据 map-reduce、实时应用（如实时配色 demo）、打分/守护/越狱检测等验证类任务。", "s": 696}, {"t": "15:28", "text": "官方基准示例为告警事件处理流程，首页宣称 193.6 倍提速、444.6 倍降本，并承认这是真实收益的上限；参考答案取 GPT-6 Astra 与 Fable 5.1 的平均。", "s": 928}, {"t": "17:39", "text": "Doom demo：每秒决策 10 次、每小时成本不到 $7；但每帧独立决策没有记忆，导致左右乱转；维基竞速等基于 HTML 的导航也很快。", "s": 1059}, {"t": "19:53", "text": "社区用法：Vercel 的 JSON Render 结合 Jev 一次性生成 UI；Ryan 用它分类 1500 封邮件，平均 200ms/封、P95 240ms、每秒 38 封。", "s": 1193}, {"t": "21:31", "text": "Theo 期待图像支持后用于检测视频帧中的 PII，并让计算机操作更实用；已有 7.1 秒内完成订机票的演示。", "s": 1291}, {"t": "22:04", "text": "批评过度炒作：Braintrust 建议用 Jev 做 LLM 评审，以及用 Jev 做上下文压缩的演示，Theo 逐条解释为何不可取。", "s": 1324}, {"t": "26:32", "text": "Theo 自己的用法：用 Jev 对 1118 个 T3 Code 线程、32311 条消息分类，发现近半是修 bug，PR 审阅与管理占约 20%；可调置信阈值（80% 时「扩展范围」占 22%，90% 时降到 6.8%）。", "s": 1592}, {"t": "28:46", "text": "总结：需要思考的任务不适合 Jev，分类、整理、排序、快速决策则非常出色；把它当成 if 语句使用。", "s": 1726}], "takeaways": ["把 Jev 当作代码中的函数/「智能 if 语句」，用于分类、排序、路由、内容审核和大批量数据的 map-reduce。", "用「人类看完信息后能否在 10 秒内作答」判断任务是否适合 Jev，需要推理的任务继续用推理型 LLM。", "不要用 Jev 评判其他 LLM 的输出，也不要用它替代 harness 自带的上下文压缩。", "利用其返回的置信度分数，按业务需要调整阈值，而不是把输出当成绝对标签。", "邮件等高频场景可先用 Jev 做低成本初筛，再把复杂部分交给 LLM。"], "tags": ["Jev", "模型评测", "结构化输出", "订阅与定价", "行业观察"], "sponsor": "Depot"}, {"id": "iBrAWpjXNxs", "title": "Please stop using stupid models", "url": "https://www.youtube.com/watch?v=iBrAWpjXNxs", "date": "20260918", "duration": 1629, "thumbnail": "https://i.ytimg.com/vi/iBrAWpjXNxs/mqdefault.jpg", "title_zh": "别再用笨模型了：前沿模型的价值在于抬高下限，而不是拔高上限", "tldr": "Theo 反驳 Sentry 创始人 David Cramer「换回 Opus / Soul 也感觉不到差别」的说法：感觉不到差别说明你的 prompt 太窄、太短；前沿模型（如 Fable）的核心价值是更少犯蠢、下限更高，能让 agent 无人干预地跑更长、更宽的端到端任务。", "conclusions": [{"t": "00:32", "text": "针对 David Cramer（Zeeg）「从 Fable / Astra 换回 Opus、Soul 等高推理模型，任务表现不会有差别」的观点，Theo 认为这是他最糟糕的观点之一，并判断有这种体验的人「不会写 prompt」。", "s": 32}, {"t": "03:18", "text": "Theo 把 Astra 与 Fable 区分开：Astra 上限能做到前所未有的事，但下限会糟糕到像 2025 年的 Gemini（如误解 revert、无法让图标在 div 中居中），因此从 Astra 退回 Soul 可以理解，但 Fable 与 Opus 的比较是另一回事。", "s": 198}, {"t": "05:28", "text": "Theo 认为大家过度关注模型的上限（天花板）而忽视下限；Anthropic 和 OpenAI 前沿模型相对开源权重模型和其他实验室的最大优势是下限更高，而抬高下限远比抬高上限有用。", "s": 328}, {"t": "08:14", "text": "关键在 prompt 的「宽度」而非难度：任务从开始到结束涉及的环节越多、运行越久，越需要高下限。如果任务只是「按 Jira 工单改指定文件」，Opus 和 Fable 都能轻松达标，Cramer 在这种场景下是对的。", "s": 494}, {"t": "17:12", "text": "Theo：「我喜欢 Fable 不是因为它更聪明，而是因为它更少犯蠢。」任务越宽、时间越长，Opus 这类模型撞上「犯蠢」边缘的概率就越高，前沿模型的特别之处正是更少撞到下限。", "s": 1032}, {"t": "21:37", "text": "Theo 让 agent 分析自己的历史记录：中位 prompt 运行时长从 53 秒增至 2 分 20 秒，P95 从不到 7 分钟增至 16 分 20 秒；P95 在 5–6 月 Fable 和 Soul 发布时从 12 分钟跳到 22 分钟，几乎一个月翻倍。", "s": 1297}, {"t": "22:47", "text": "失败率的小幅改进会带来可运行时长的指数级提升：每 10 分钟失败 5% 时，4 小时成功率约 30%；降到 3% 时，4 小时失败率约 50%——2 个百分点的差距在 4 小时尺度上变成约 20 个百分点。", "s": 1367}, {"t": "25:02", "text": "Theo 判断 Cramer 和 David Khourshid 仍按「2 月份的方式」写 prompt：资深工程师习惯亲自做编码前的准备和编码后的验证，不愿把这两端交给 agent，所以只在模型早已能胜任的「中间写代码」环节测试，自然看不出差别。", "s": 1502}], "key_points": [{"t": "00:00", "text": "开场：因 David Cramer 的推文而做此视频，认为多数工程师没有正确使用 agent。", "s": 0}, {"t": "01:07", "text": "赞助段落（Grapple 的 Trex 代码审查）。", "s": 67}, {"t": "03:18", "text": "先单独讨论 Astra：上限极高但下限很低，用质量分布图说明上限与下限。", "s": 198}, {"t": "06:34", "text": "把图中的 Astra 换成 Gemini 3.8 Flash，转而聚焦 Fable 与 Opus 的比较。", "s": 394}, {"t": "07:40", "text": "失败容忍度低会让人降低期望、缩窄 prompt；新前沿模型发布时 Theo 会重新用以前失败过的 prompt 测试。", "s": 460}, {"t": "09:23", "text": "Theo 的实际用法：手机上把用户 bug 截图发给 T3 Code 里的 agent，让它修复、测试、录视频、提 PR 并跟进审查意见。", "s": 563}, {"t": "10:32", "text": "token 虽贵但工程师时间更贵：让优秀工程师用相当于薪水的 token 换取 3 倍产出是显而易见的选择。", "s": 632}, {"t": "11:07", "text": "投票：是否盯着 agent 工作；Theo 建议少盯，失败时询问模型是哪些信号导致其走偏。", "s": 667}, {"t": "12:12", "text": "引用 Jaymon 的做法：通过过夜长时间运行暴露代码库中的「减速带」，多改代码库，少改 prompt。", "s": 732}, {"t": "13:18", "text": "投票：prompt 中是否还写文件名；Theo 调侃经常写的是「Atlassian 开发者」。", "s": 798}, {"t": "14:58", "text": "让 prompt 更「横向」：让 agent 自己找文件、在模拟器验证、推送构建、在 PR 中附视频；以 Maria 的 PR 为例。", "s": 898}, {"t": "15:31", "text": "两个核心指标：模型能在无人输入下运行多久，以及人类重新介入时任务已完成的概率。", "s": 931}, {"t": "18:52", "text": "成本讨论：全职开发者大多负担得起 Claude 与 Codex 各 $200 的订阅，换回 Claude 约 8000 美元、OpenAI 约 12000 美元的 token 额度。", "s": 1132}, {"t": "19:59", "text": "现场让 agent 统计历史 prompt 运行时长，验证「指数级」说法。", "s": 1199}, {"t": "22:47", "text": "用失败率复利计算说明下限小幅提升带来的指数级影响。", "s": 1367}, {"t": "24:27", "text": "过去即使有详细 spec 和 Ralph loop，长时间运行的失败率仍很高；Cursor 2/3 的不稳定是例证，如今模型变好后 Cursor 才稳定。", "s": 1467}, {"t": "25:35", "text": "分析资深工程师 / 技术领导者为何低估新模型，结尾回应 Cramer。", "s": 1535}], "takeaways": ["新前沿模型发布时，用之前失败过的 prompt 重新测试，重新校准你的期望，而不是沿用旧 prompt。", "让 prompt 更「宽」：不要指定文件名，让 agent 自己定位问题、修改、测试、录视频并提交 PR。", "agent 在你的代码库里反复出错时，优先改进代码库，而不是只调整 prompt；可用长时间无人值守运行来暴露这些问题。", "减少盯着 agent 工作；只在首次输出明显错误时观察，并询问它是哪些信号导致走偏。", "评估模型时关注下限（最差表现）而不是上限，用「无人干预能跑多久」和「人介入时完成的概率」来衡量。"], "tags": ["模型评测", "开发工作流", "提示工程", "Claude", "T3 Code"], "sponsor": "Grapple (Trex)"}, {"id": "NvVbCqDgfCs", "title": "How I Code Without Typing", "url": "https://www.youtube.com/watch?v=NvVbCqDgfCs", "date": "20260916", "duration": 2301, "thumbnail": "https://i.ytimg.com/vi/NvVbCqDgfCs/mqdefault.jpg", "title_zh": "手受伤后我如何不打字也能写代码：语音输入、电脑操控与「让 agent 更早介入、跑得更久」", "tldr": "手部受伤迫使 Theo 全面转向语音输入 + agent 的工作方式，产出反而创下新高；他认为关键不在打字，而是让 agent 在流程中更早介入、自主跑得更久（包括自己验证甚至自己合并），并推荐一款可耳语输入的小型桌面麦克风。", "conclusions": [{"t": "03:51", "text": "Theo 认为靠语音直接「念代码」不可行（演示念 let x = 4 / while 循环失败），真正可行的是用语音描述意图，让 AI 去写代码、操作电脑。", "s": 231}, {"t": "09:26", "text": "Theo 称这只约 70 美元的小型桌面麦克风是本视频「最大的建议」：耳语音量（约 -40 dB）也能被 Whisper Flow 准确识别，且能过滤身后的人声/视频噪音，让他在团队办公室里也愿意用语音输入；团队成员试用后全部自购。他也建议先用 MacBook 内置麦克风试试，正常音量下够用。", "s": 566}, {"t": "12:52", "text": "Theo 对「终端不适合 agentic 开发」的立场「强了 100 倍」：用语音操作终端是地狱，受伤后几周内除了一次 TS 转 Rust 的 yolo 实验外没打开过终端。", "s": 772}, {"t": "25:36", "text": "Theo 已取消「人工点合并」这条线：Astra 合并了 100+ 个 PR、Fable 至少 50 个，约 150 个全自主编写并合并的 PR 中只有 2 个出现回归（都是 Astra 引入的动画被删问题），他认为这比大多数优秀开发者的命中率还高。", "s": 1536}, {"t": "26:40", "text": "核心方法论：在「想法 → 完成」的任务光谱上，agent 应该更早介入（给问题而不是给方案，让它提方案甚至直接开 PR），并且跑得更久再打扰你（用 computer use 自测、用 AI 代码审查机器人和子 agent 复查，确认无用户可见回归后再找你）。", "s": 1600}, {"t": "27:16", "text": "Theo 表示自己几乎不再在意模型速度：除了紧急修 bug、细节/设计迭代，或他那个单线程开发 SwiftUI 版 T3 Code 移动端的「地狱线程」，其余线程一发出去他就去做别的事了。", "s": 1636}, {"t": "22:51", "text": "Theo 认为最大的心智转变是「任务时长不再决定何时去做」：以前 1 小时的任务若 40 分钟后要去拍视频就会被无限期搁置，现在只需开头和结尾各看一次。", "s": 1371}, {"t": "35:06", "text": "Theo 主张「懒是好事」：不要手动在线程间复制粘贴上下文，直接让 agent 自己去找；虽然更慢、更费 token，但在 Frontier 模型 + 200 美元/月订阅下差别不大；在 Terra、Kimi K3 等便宜模型上可能效果不佳。", "s": 2106}], "key_points": [{"t": "00:00", "text": "Theo 手部受伤打石膏约一个月、可能还要 1–6 个月，但 8 月 8 日之后 GitHub 产出不降反升；以前打字速度可达 160 WPM。", "s": 0}, {"t": "04:57", "text": "受伤迫使他更多地 vibe coding；切换应用困难，于是窗口不再全屏、露出边缘方便用鼠标切换。", "s": 297}, {"t": "06:05", "text": "技巧一：手机是好帮手——他习惯单手滑动输入，并持续改进 T3 Code 的手机端控制能力。", "s": 365}, {"t": "07:44", "text": "技巧二：语音输入。Whisper Flow 擅长转写，但无法帮他导航电脑；他不愿在同事身边大声对电脑说话。", "s": 464}, {"t": "08:52", "text": "现场演示小型桌面麦克风：耳语也能识别，播放 ThePrimeagen 视频作干扰也只识别他的声音；提到 Ben Davis 自建了本地版 Whisper Flow。", "s": 532}, {"t": "13:25", "text": "fleet 项目：记录他所有电脑的用途、SSH 连接方式和已装软件，让 agent 代为跨机器操作，例如等 Melee ISO 下载完后自动拷到另一台 MacBook（Leftbook）。", "s": 805}, {"t": "16:11", "text": "在手机上通过 fleet 线程让 agent 基于 orchestrator v2 分支构建独立的「T3 Code v2」应用，使用单独的 home 目录，不干扰 nightly 版；orchestrator v2 主要由 Julius 开发，可让 agent 自己开线程、调用其他模型和子 agent。", "s": 971}, {"t": "19:58", "text": "个人案例：用 GPT-6 Astra 的 computer use 从医院网站下载 49 份病历 PDF 并整理，约 20 分钟完成，之后再让另一线程上传到新医生提供的链接；他目前的分工是 T3 Code 做代码、ChatGPT 做生活事务。", "s": 1198}, {"t": "23:23", "text": "画出任务光谱示意图，讲解 agent 介入位置从零散片段，到「长时间 agent 运行」，再到向两端扩展、取消人工合并环节。", "s": 1403}, {"t": "28:21", "text": "逐一浏览自己的线程（Lake bed 容量、Melee 反编译、性能展示等），说明绝大多数线程速度无关紧要。", "s": 1701}, {"t": "28:55", "text": "T3 Code 新功能：Cmd+Enter 在后台新建线程并停留在输入界面，方便一次性倾倒多个任务。", "s": 1735}, {"t": "29:29", "text": "不要纠结语音转写里的错别字，模型能理解；真被误解再纠正即可。", "s": 1769}, {"t": "31:48", "text": "不再直接用 GitHub（太慢）：让 agent 汇总近三天值得关注的 PR，并在 T3 Code 内置的 PR 查看器中直接查看和合并。", "s": 1908}, {"t": "33:28", "text": "最后的技巧：复制粘贴对他来说很痛苦，于是让一个线程直接去读另一个线程的内容，而不是手动搬运上下文。", "s": 2008}, {"t": "36:12", "text": "给观众的挑战：下次有 bug 或新功能时，先把脑中想法原样丢给 agent，不给提示，自己照常做，最后对比结果。", "s": 2172}], "takeaways": ["在办公室用语音输入时，可以试试小型桌面麦克风，耳语就能输入、不打扰同事；先用笔记本内置麦克风体验也行。", "建一个记录所有机器（SSH 方式、用途、已装软件）的仓库，让 agent 代为执行跨机器的运维操作。", "让 agent 更早介入（给问题而不是给方案），并要求它自行用 computer use、代码审查机器人和子 agent 验证后再找你。", "不要手动在线程之间搬运上下文，直接让 agent 自己去找相关 PR/线程。", "做个实验：下次有任务时先把原始想法丢给 agent，同时自己手动做，最后对比两者的结果。"], "tags": ["开发工作流", "T3 Code", "语音输入", "Computer Use", "提示工程"], "sponsor": "WorkOS"}, {"id": "oPZLPUtmROo", "title": "Did AI Kill React Native?", "url": "https://www.youtube.com/watch?v=oPZLPUtmROo", "date": "20260914", "duration": 3773, "thumbnail": "https://i.ytimg.com/vi/oPZLPUtmROo/mqdefault.jpg", "title_zh": "AI 杀死了 React Native 吗？——解读 Shopify 回归原生", "tldr": "Shopify 以「编码 agent 让双平台原生开发不再昂贵」为由从 React Native 回到 Swift/Kotlin；Theo 认为他们忽视了 OTA 更新和 Expo 等核心优势、迁移方案过度工程化，但也承认 agent 确实缩小了 React Native 原本依赖的「Meta 原生工程师水平差距」，加上 Meta 正在缩减 React/React Native 团队，React Native 的长期前景值得担忧。", "conclusions": [{"t": "04:55", "text": "Theo 认为 Shopify 的文章过度强调「多平台只写一次」这一点，而这从来不是 React Native 最大的优势；他眼中的核心价值是「learn once, understand everywhere」以及 OTA 更新。", "s": 295}, {"t": "15:51", "text": "Theo 判断 OTA（over-the-air）更新是很难放弃 React Native 的最大理由：原生应用修 bug 要过 App Store 审核且用户更新缓慢（他在 Twitch 看到任意时刻半数以上用户落后至少两个版本，自己手机上有 54 个应用待更新），而 React Native 只需重新下发 JS bundle。", "s": 951}, {"t": "22:30", "text": "Theo 认为 Shopify 没有深度采用 Expo 是一个重大失误：Expo 提供构建、OTA、开发客户端、模拟器和 web 支持，不用 Expo 就等于在自己重造 Expo（Infinite Red 的 Jamon 也持同样看法）。", "s": 1350}, {"t": "26:22", "text": "Shopify 的 Shop 应用改为原生后安装包反而大了约 1MB；Theo 认为 React Native 运行时并不大（默认 Expo 应用约 20–30MB），包体积和性能差异多来自「重写带来的第二系统收益」而非框架本身。", "s": 1582}, {"t": "13:37", "text": "Theo 批评 Shopify 的迁移方案（Helix 分检查点 + 两轮对抗式代码审查 + 人工确认，以及为 agent 做无头业务逻辑 CLI）严重过度工程化，认为这些本质是 CRUD 应用，用 Expo 的 web/模拟器支持即可让 agent 高效迭代。", "s": 817}, {"t": "32:57", "text": "Theo 指出 Shopify 在决定是否迁移到 React Native 新架构时直接选择了原生重写，因此其启动时间等性能对比是基于旧架构，参考价值有限；他推测新架构与原生的差距会更小。", "s": 1977}, {"t": "48:23", "text": "Theo 用自己的经验反驳 Shopify「直接让 LLM 移植行不通」的说法：他用 GPT-6.1 Soul（及少量 Astra）在单个线程里把 T3 Code 的 React Native 应用移植成 SwiftUI 版并持续同步新功能，自己没读过一行代码却每天在用；他猜 Shopify 是过度使用 Claude 模型或旧模型。", "s": 2903}, {"t": "55:40", "text": "Theo 认为 React Native 过去的真正价值在于 Meta 拥有比绝大多数团队更强的原生工程师（React Native 团队巅峰时 300+ 人，对比 React 核心不到 30 人）；如今 Codex 等 agent 也擅长原生代码，这一差距大幅缩小，这是他最难接受的变化。", "s": 3340}, {"t": "57:19", "text": "Theo 担忧 Meta 正在解散 React/React Native 团队，核心人才（如 React Compiler 的 Lauren）流失到 Cursor 等公司，React Native 的维护质量和演进速度将进入平台期，这是值得认真关注的风险。", "s": 3439}], "key_points": [{"t": "00:00", "text": "开场回顾：Theo 曾为 React Native 辩护（Airbnb 文章），而 Shopify 曾是 React Native 的标杆案例，如今宣布回归原生。", "s": 0}, {"t": "03:48", "text": "解读 Shopify 文章：2020 年押注 React Native 很成功，但 LLM 让 Swift/Kotlin 双平台开发成本大降，因此从第一性原理重新评估。", "s": 228}, {"t": "07:06", "text": "Shopify 用 LLM 原型重写核心模块，agent 可以参照 iOS 实现 Android 版本，并通过共享规格、测试和审查维持双平台一致。", "s": 426}, {"t": "08:12", "text": "开源库安排：React Native Skia 由 William 分叉以新名称继续维护，FlashList 寻找长期接管方，Restyle 归档。", "s": 492}, {"t": "10:21", "text": "迁移策略选择 greenfield 重写：Shop 应用 12 周完成从原型到上架，拥有 300 个页面的 Shopify 应用迁移在进行中；Theo 赞赏大公司公开承认 LLM 能做大规模重写。", "s": 621}, {"t": "11:59", "text": "Shopify 的 Helix 迁移系统与为 agent 构建的无头 CLI 测试架构，Theo 逐条吐槽其过度工程化，并指出移动端模拟器对 agent 极不友好。", "s": 719}, {"t": "15:51", "text": "React Native 被低估的优势：OTA 更新。Theo 用 iPhone mini 显示 bug、节日主题等例子说明原生发布流程的痛点，并用「两个厨师」比喻解释 React Native 是给原生层下发指令的层。", "s": 951}, {"t": "22:30", "text": "Expo 的作用：云构建、OTA、开发客户端（扫码即可开发），对比 Theo 自己做原生 T3 Code 时被 Apple 签名和权限折磨的经历。", "s": 1350}, {"t": "25:16", "text": "React Native 的真实缺点：Xcode/CocoaPods 依赖管理之痛、foot gun 多（普通 React Native 开发者平均水平低于原生开发者）、架构频繁变动导致升级困难、依赖 Meta 跟进新平台特性；包体积和性能不在其列。", "s": 1516}, {"t": "31:17", "text": "Shopify 的特殊性：未采用新架构就做对比、未使用 Expo；以及关于 Toby 独断决策的传闻和他本人的回应，Theo 读完后转而认同其「founder mode as a service」做法。", "s": 1877}, {"t": "38:25", "text": "Theo 的亲身移植经历：用 Soul 在 Mac mini 上 2–3 小时内自动生成 UIKit 版和 SwiftUI 版 T3 Code 应用，后台数据保持更好，但 SwiftUI 列表滚动明显更差。", "s": 2305}, {"t": "42:18", "text": "返回手势的坑：SwiftUI 原生导航栈只允许屏幕左侧约四分之一区域触发返回且不可调整，而 iOS 设置等系统应用自身支持从中间滑动返回，Theo 只好重建导航层。", "s": 2538}, {"t": "46:43", "text": "赞助段落（Convex）。", "s": 2803}, {"t": "51:12", "text": "引用 Legend List/Legend State 作者 Jay 的观点：在他的基准对比中 React Native 比原生更快，Legend List 纯 JS 实现甚至能移植到 web。", "s": 3072}, {"t": "52:53", "text": "React Native 团队的历史与现状：曾远大于 React 核心团队、聚集最好的原生工程师；如今 Meta 缩编，人才流失，团队士气低落。", "s": 3173}, {"t": "59:31", "text": "总结：Shopify 的转向是值得观察的大胆实验；React Native 从来不是「一次编写到处运行」，而是「一次学习到处理解」；无论用什么技术，团队都应有人日常使用 Android 手机。", "s": 3571}], "takeaways": ["如果使用 React Native，尽量采用 Expo，以获得 OTA 更新、云构建和便捷的开发客户端，避免自己重造工具链。", "评估 React Native 与原生的性能差异时，应基于新架构进行对比，并区分「框架差异」与「重写带来的收益」。", "让 agent 移植移动应用时，给它模拟器、现有源码和清晰的参考实现，并以循环方式让它自行测试和修正，而非一次性生成。", "使用 SwiftUI 原生导航栈时注意返回手势只在屏幕左侧生效，需要时自行实现导航层以匹配用户习惯。", "团队中安排人日常使用 Android（以及让 Android 用户体验 iPhone），在两个平台上真实测试应用。"], "tags": ["React Native", "Shopify", "移动开发", "行业观察", "开发工作流"], "sponsor": "Greptile、Convex"}]};

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = (d) => d ? `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}` : "";
const fmtDur = (s) => { s = Math.round(s || 0); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h + ":" + String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0"); };

let query = "", activeTags = new Set();

function hl(text) {
  const t = esc(text);
  if (!query) return t;
  const re = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
  return t.replace(re, (m) => `<mark>${m}</mark>`);
}

function haystack(v) {
  return [v.title, v.title_zh, v.tldr, ...(v.tags||[]), ...(v.takeaways||[]),
    ...(v.conclusions||[]).map(x => x.text), ...(v.key_points||[]).map(x => x.text)].join("\n").toLowerCase();
}

function tsItems(items, v) {
  return (items || []).map(it => {
    const ts = it.t ? `<a class="ts" href="${esc(v.url)}&t=${it.s}s" target="_blank" rel="noopener">${esc(it.t)}</a>` : "";
    return `<li>${ts}${hl(it.text)}</li>`;
  }).join("");
}

function card(v) {
  const take = (v.takeaways||[]).length ? `<h3>可执行建议</h3><ul>${v.takeaways.map(x => `<li>${hl(x)}</li>`).join("")}</ul>` : "";
  return `<article class="card" id="v-${esc(v.id)}">
    <div class="row" data-id="${esc(v.id)}">
      <div class="thumb" style="background-image:url('${esc(v.thumbnail)}')"><span class="dur">${fmtDur(v.duration)}</span></div>
      <div class="info">
        <div class="title">${hl(v.title_zh)}</div>
        <div class="orig">${hl(v.title)}</div>
        <p class="tldr">${hl(v.tldr)}</p>
        <div class="tline"><span>${fmtDate(v.date)}</span>${(v.tags||[]).map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div>
      </div>
    </div>
    <button class="toggle expand" data-act="open">展开重要结论与要点 ▾</button>
    <div class="detail">
      <h3>重要结论</h3><ul class="concl">${tsItems(v.conclusions, v)}</ul>
      <h3>内容要点</h3><ul>${tsItems(v.key_points, v)}</ul>
      ${take}
      <div class="actions">
        <a href="${esc(v.url)}" target="_blank" rel="noopener">▶ 在 YouTube 观看</a>
        <a href="#${esc(v.id)}">链接到此</a>
        ${v.sponsor ? `<span>赞助：${esc(v.sponsor)}</span>` : ""}
      </div>
      <button class="toggle collapse" data-act="close">收起 ▴</button>
    </div>
  </article>`;
}

function renderTags() {
  const count = {};
  DATA.videos.forEach(v => (v.tags||[]).forEach(t => count[t] = (count[t]||0) + 1));
  const tags = Object.entries(count).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0]));
  $("#tags").innerHTML = tags.map(([t,n]) =>
    `<button class="chip${activeTags.has(t) ? " on" : ""}" data-tag="${esc(t)}">${esc(t)}<span class="n">${n}</span></button>`).join("");
  // 面板收起时，单独显示已选标签，点击即取消
  const open = !$("#tags").hidden;
  $("#picked").hidden = open || !activeTags.size;
  $("#picked").innerHTML = [...activeTags].map(t =>
    `<button class="chip on" data-tag="${esc(t)}">${esc(t)}<span class="x">×</span></button>`).join("");
  $("#tagBtn").textContent = "标签" + (activeTags.size ? ` (${activeTags.size})` : "") + (open ? " ▴" : " ▾");
  $("#tagBtn").classList.toggle("has", activeTags.size > 0);
  $("#tagBtn").setAttribute("aria-expanded", open);
}

function toggleTag(e) {
  const b = e.target.closest("[data-tag]"); if (!b) return;
  const t = b.dataset.tag; activeTags.has(t) ? activeTags.delete(t) : activeTags.add(t);
  renderTags(); render();
}

function render() {
  const q = query.toLowerCase();
  const list = DATA.videos.filter(v =>
    (!q || haystack(v).includes(q)) && [...activeTags].every(t => (v.tags||[]).includes(t)));
  $("#list").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">没有匹配的视频</div>`;
  if (query) document.querySelectorAll(".card").forEach(c => c.classList.add("open"));
  openFromHash(false);
}

function openFromHash(scroll = true) {
  const id = decodeURIComponent(location.hash.slice(1));
  const el = id && document.getElementById("v-" + id);
  if (el) { el.classList.add("open"); if (scroll) scrollToCard(el); }
}

// 顶栏是 sticky 的，滚动定位时要扣掉它的高度
const headerH = () => document.querySelector("header").offsetHeight;
function scrollToCard(el) {
  window.scrollTo({top: el.getBoundingClientRect().top + scrollY - headerH() - 8});
}

function init() {
  if (!DATA) { $("#list").innerHTML = `<div class="empty">尚无数据，请运行 python build.py</div>`; return; }
  const gen = new Date(DATA.generated_at).toLocaleString();
  $("#stats").textContent = `${DATA.videos.length} 个视频 · 更新于 ${gen}` + (DATA.pending ? ` · ${DATA.pending} 个待总结` : "");
  $("#tags").hidden = matchMedia("(max-width: 640px)").matches; // 手机默认收起，电脑默认展开
  renderTags(); render(); openFromHash();

  $("#q").addEventListener("input", (e) => { query = e.target.value.trim(); render(); });
  $("#tagBtn").addEventListener("click", () => { $("#tags").hidden = !$("#tags").hidden; renderTags(); });
  $("#tags").addEventListener("click", toggleTag);
  $("#picked").addEventListener("click", toggleTag);
  $("#list").addEventListener("click", (e) => {
    if (e.target.closest("a")) return;
    const btn = e.target.closest(".toggle");
    if (btn) {
      const c = btn.closest(".card");
      c.classList.toggle("open", btn.dataset.act === "open");
      // 从底部收起时，把卡片顶部滚回视野，避免停在下一张卡片中间
      if (btn.dataset.act === "close" && c.getBoundingClientRect().top < headerH()) scrollToCard(c);
      return;
    }
    const row = e.target.closest(".row"); if (row) row.parentElement.classList.toggle("open");
  });
  window.addEventListener("hashchange", () => openFromHash());
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
  });
}
init();
</script>
