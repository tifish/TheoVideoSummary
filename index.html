<script>
const DATA = {"generated_at": "2026-10-08T14:34:57+00:00", "last_fetch": "2026-10-08T13:27:00+00:00", "pending": 0, "videos": [{"id": "nYA0yASgaZI", "title": "Does the $200 Codex plan suck now?", "url": "https://www.youtube.com/watch?v=nYA0yASgaZI", "date": "20261007", "duration": 2013, "thumbnail": "https://i.ytimg.com/vi/nYA0yASgaZI/mqdefault.jpg", "title_zh": "$200 的 Codex 套餐现在还值吗？", "tldr": "OpenAI 将 $200 Codex 套餐的额度折算减半，Theo 实测月度 API 等值从约 $12K–24K 跌到约 $2.5K；但只要改用极便宜的 GPT-6.1 Soul，可完成的任务量反而更多。真正的败笔是同时推出 $500 套餐和天价的 Ultrafast。", "conclusions": [{"t": "04:35", "text": "订阅额度的「API 等值」和 API 标价都是「假数字」：API 定价历史上有约 95% 的毛利，烧 $100 token 的实际算力+电力成本大约只有 $2–5，所以订阅与 API 之间的巨大补贴差距会随竞争逐步收窄。", "s": 275}, {"t": "09:37", "text": "Theo 推算 Anthropic 将 Fable 5 / Mythos 5 定价为 $10/$50（远低于 Mythos 预览的 $25/$125），在模型规模不变的前提下毛利从约 95% 降到约 87.5%，单位利润从约 $118.75 降到 $43.75——这就是 Claude 订阅中 Fable 只能用一半额度的原因，也迫使 OpenAI 把 Astra 定成同价。", "s": 577}, {"t": "13:59", "text": "GPT-6.1 Soul 定价 $2/$10、缓存读取 $0.10/M，Theo 认为它原本按 Opus 5 的 $5/$25 规划，实际有效成本约便宜 5 倍，毛利可能只剩约 50%；OpenAI 削减订阅额度主要是为了让 6.1 Soul 在 $200 套餐里「感觉无限」，同时不被重度用户拖垮。", "s": 839}, {"t": "16:45", "text": "实测：一周仅获得约 $574 的用量，29 小时即可跑死一个账号，月度等值约 $2.5K，约为之前的 1/10；但同量级的约 1,500–1,800 次请求，Astra 花费 $534，6.1 Soul 仅 $38，差距超过 10 倍。", "s": 1005}, {"t": "20:37", "text": "Theo 自测 Terminal Bench：6.1 Soul（max）创最高分，xhigh 档与 Opus 5.5 基本打平，但每任务成本 $0.96 对 $13.11（约 1/13）。应看「每任务成本」而非订阅的美元等值——额度减半仍可能多完成约 5 倍任务。", "s": 1237}, {"t": "18:58", "text": "写要上线的代码，$200 Claude 套餐 + Opus 5.5 的性价比无可替代；Theo 自己开了 6 个 Claude 账号，几乎不再用 Fable。6.1 Soul 则是「史上性价比最高的模型」，如果必须付 API 价格他会毫不犹豫选 Soul。", "s": 1138}, {"t": "24:24", "text": "$500 套餐是公关灾难：把 20x 改成 10x 的同时推「多付 2.5 倍拿 25x」，让人觉得阴险。$200 订阅本质是营销而非利润来源（利润来自 $8/$20 消费者套餐和 API）。", "s": 1464}, {"t": "25:32", "text": "Ultrafast 是更大的错误：Astra 开 Ultrafast 后输入 $60/M、输出 $300/M（长上下文达 $120/$450），审两个 PR 花了 $600；$500 套餐每周约 $1,000 的 Ultrafast 等值，约 2.1 小时生成就耗尽周额度。原因是 Cerebras 方案没跑通，改用 Nvidia 硬件过度配置。", "s": 1532}], "key_points": [{"t": "00:00", "text": "背景：几周前 $200 Codex 套餐可得约 $12K/月推理额度，Claude 约 $8K；Tibo 宣布额度计算方式调整，等于减半。", "s": 0}, {"t": "01:45", "text": "提出问题：是否就此没理由用 Codex 订阅？是否是逼人升级 $500 套餐的阴谋？（随后为 Browserbase 赞助段）", "s": 105}, {"t": "04:00", "text": "Theo 7 天 API 等值花费约 $20K，说明订阅价和 API 价都与真实成本脱节。", "s": 240}, {"t": "05:44", "text": "Claude 订阅的限制：只能在 Claude Code（及通过 Agent SDK 调用的 T3 Code）中使用，无法接入 Pi、Hermes 等；Codex 订阅几乎可在任何地方用，只要不对外提供服务。", "s": 344}, {"t": "07:26", "text": "把模型分成两组对比，引出 Project Glasswing / Mythos 原定价与 Fable 5 实际定价的差异。", "s": 446}, {"t": "08:32", "text": "按 95% 毛利假设推算 Mythos 与 Fable 的成本和利润变化，解释 Anthropic 为何限制 Fable 只能用一半额度。", "s": 512}, {"t": "12:54", "text": "分析 GPT-6.1 Soul 的定价：推测原计划 $5/$25，实际 $2/$10 且缓存读取再减半，利润率大幅下降。", "s": 774}, {"t": "16:13", "text": "OpenAI 选择不对 Soul 单独设限，而是整体收缩订阅补贴；Theo 认为宣布时机很糟。", "s": 973}, {"t": "17:18", "text": "展示个人用量明细：Astra 与 6.1 Soul 在相近请求量下的成本对比。", "s": 1038}, {"t": "20:05", "text": "用自建的 Slopolitics 网站展示 Artificial Analysis 指数与价格的帕累托前沿，6.1 Soul / Luna 构成前沿。", "s": 1205}, {"t": "22:49", "text": "General Translation 赞助段。", "s": 1369}, {"t": "24:24", "text": "「开喷」环节：$500 套餐与额度削减同时发布是自伤。", "s": 1464}, {"t": "25:32", "text": "Ultrafast 定价拆解与 $500 套餐的实际可用时长。", "s": 1532}, {"t": "29:58", "text": "OpenAI 过去的优势是后训练/RL 让小模型很强，Anthropic 近期已追上；OpenAI 需要做出比 Astra 更好、像 Opus 5.5 一样好用又够快的模型。", "s": 1798}, {"t": "31:06", "text": "结论：只为 Astra 买 $200 Codex 不值；Theo 的用法是 Claude 干活、通过 T3 Code 调用 Codex（Soul）子代理做审查。", "s": 1866}, {"t": "32:12", "text": "预测：随着 API 价格下降，订阅补贴会继续缩小，但一年后同样套餐能完成的工作仍会更多。", "s": 1932}], "takeaways": ["若主要写生产代码，优先购买 $200 Claude 套餐并以 Opus 5.5 为主力。", "使用 Codex 订阅时改用 GPT-6.1 Soul，避免 Astra 和 Max 档位，以获得接近无限的体感额度。", "比较模型时看每任务成本（如 Terminal Bench 的 cost per task），而不是订阅的美元等值。", "不要在订阅里开 Ultrafast，它会在数小时内耗尽周额度。", "可以让 Claude 调用 Codex/Soul 子代理来审查代码，OpenAI 模型的分析通常更彻底。"], "tags": ["OpenAI", "Codex", "Anthropic", "订阅与定价", "GPT-6.1 Soul"], "sponsor": "Browserbase；General Translation"}, {"id": "pJljViiUEPw", "title": "I love Ultrafast (it's unusable)", "url": "https://www.youtube.com/watch?v=pJljViiUEPw", "date": "20261006", "duration": 1697, "thumbnail": "https://i.ytimg.com/vi/pJljViiUEPw/mqdefault.jpg", "title_zh": "我爱 Ultrafast（但它根本没法用）", "tldr": "Astra Ultrafast 的实时编码体验让 Theo 重新进入「人在回路」的心流，甚至做出了更好的 UI；但它贵到离谱（输出 $300/M），几乎不该使用。真正的希望是即将到来的 GPT-6.1 Soul Ultrafast。", "conclusions": [{"t": "00:34", "text": "Ultrafast 价格极高：Astra 输出从 $50/M 涨到 $300/M（长上下文 $450/M），缓存读 $6/M（比其他模型的普通读取还贵）、缓存写 $75/M；审两个不到 100 行的小 PR 花了 $600。", "s": 34}, {"t": "04:30", "text": "$500「Ultrafast 套餐」每周约 $1,000 等值，约 2.1 小时就能烧光；Theo 实测几次小改动就消耗了 3% 的周额度，Primeagen 一小时烧掉一半以上额度。", "s": 270}, {"t": "10:22", "text": "同一段对话：Astra 标准价 $7.72，Ultrafast $46.32，而用 GPT-6.1 Soul 只要约 $1.10——相差 40 倍以上，且 Soul 完全能胜任。", "s": 622}, {"t": "07:00", "text": "推理从 10 分钟降到 30 秒后，工具调用/构建等原本可忽略的耗时会成为瓶颈，使用超快模型时应调整提示词，避免让模型执行慢的工具调用。", "s": 420}, {"t": "22:03", "text": "Theo 认为 Ultrafast 的真正价值不是省时间，而是改变工作方式：快速来回迭代让他保持上下文和心流，用设计能力较差的 Astra 反而做出了比 Opus/Fable 更好的 UI（Slopolytics 网站）；没有它他可能根本不会把项目做完。", "s": 1323}, {"t": "21:30", "text": "按成本比较：Slopolytics 用 Ultrafast 总计约 $550，标准 Astra 约 $90，GPT-6.1 Soul 约 $12。以金钱衡量，几乎任何场景都不值得用 Ultrafast。", "s": 1290}, {"t": "23:11", "text": "若 6.1 Soul 推出 Ultrafast 且保持 6 倍价格乘数，它将比 Astra Ultrafast 便宜约 10 倍，甚至不高于 Astra 标准价；Tibo 已公开确认 6.1 Soul Ultrafast 即将推出，届时 $500 套餐可能变得物超所值。", "s": 1391}, {"t": "26:00", "text": "现阶段 Ultrafast 只适合两种情况：真正高优先级的事故响应（且钱不是问题），或额度即将重置、反正会浪费的时候。不要为了它升级 $500 套餐。", "s": 1560}], "key_points": [{"t": "00:00", "text": "演示用 Astra Ultrafast 实时修改应用，几秒内完成改动。", "s": 0}, {"t": "01:40", "text": "Greptile（T-Rex，让审查代理在真实机器上运行代码）赞助段。", "s": 100}, {"t": "03:21", "text": "揭晓审两个 PR 花费 $600，拆解 Ultrafast 各项价格。", "s": 201}, {"t": "04:30", "text": "$500 套餐额度测试：两次提示词各用 38 秒和 16 秒，消耗 1% 周额度。", "s": 270}, {"t": "05:36", "text": "实时把应用改成看板 + 聊天，体验类似分屏结对开发。", "s": 336}, {"t": "07:00", "text": "超快推理下工具调用耗时占比变大，需引导模型避免慢操作。", "s": 420}, {"t": "08:07", "text": "Astra 对中途插话（steering）处理得好，可以边干边连续追加需求。", "s": 487}, {"t": "09:45", "text": "OpenAI 员工可无限推理，但现在使用 Ultrafast 也需逐任务审批。", "s": 585}, {"t": "10:22", "text": "让 6.1 Soul 计算本段对话在不同模型下的成本。", "s": 622}, {"t": "12:04", "text": "介绍用 Ultrafast 做的 Slopolytics：Opus 5.5 约 15–20 分钟出首版，Astra Ultrafast 约 1.5 分钟。", "s": 724}, {"t": "15:25", "text": "Slopolytics 的设计思路：按模型家族分组、可切换推理档位，弥补 Artificial Analysis 只看 max 档的缺陷。", "s": 925}, {"t": "18:44", "text": "回顾 50+ 条消息的对话：许多 UX 点子（模型对比卡片、悬停高亮）都源于快速来回迭代。", "s": 1124}, {"t": "20:57", "text": "实测速度：普通约 30 TPS，fast 约 60 TPS，Ultrafast 约 320–340 TPS。", "s": 1257}, {"t": "23:48", "text": "展望 6.1 Soul Ultrafast；Theo 已将机器管理项目的默认模型改为 6.1 Soul high fast。", "s": 1428}, {"t": "25:26", "text": "建议的 Ultrafast 使用场景，以及利用即将到来的额度重置「烧掉」剩余额度。", "s": 1526}, {"t": "27:41", "text": "预告下一期讨论 $200 套餐是否仍然值得。", "s": 1661}], "takeaways": ["不要为了 Ultrafast 升级 $500 套餐，等 6.1 Soul Ultrafast 推出再评估。", "只在额度即将重置、或极高优先级事故时使用 Ultrafast。", "做 UI 打磨这类需要频繁来回的工作时，优先选择更快的模型并采用小步、多轮的提示方式。", "使用超快模型时，在系统提示中让它避免耗时的工具调用（如浏览器预览），只改代码。", "日常非生产任务可以把默认模型设为 GPT-6.1 Soul（high + fast），兼顾速度与成本。"], "tags": ["OpenAI", "Ultrafast", "订阅与定价", "GPT-6.1 Soul", "开发工作流"], "sponsor": "Greptile"}, {"id": "FsDUOUV9Vs8", "title": "Anthropic Made Claude Even Better", "url": "https://www.youtube.com/watch?v=FsDUOUV9Vs8", "date": "20261005", "duration": 4229, "thumbnail": "https://i.ytimg.com/vi/FsDUOUV9Vs8/mqdefault.jpg", "title_zh": "Anthropic 用 Claude 把 Claude 提速了 3 倍", "tldr": "Theo 解读 Anthropic「两周内用 Claude 将 claude.ai 与桌面端提速约 3 倍」的博文：核心经验是先让模型能「测量」，再让它爬坡优化并用 CI 棘轮锁定成果；但他也现场发现了缓存失效等由盲目追指标导致的回归。", "conclusions": [{"t": "03:17", "text": "成果确实显著：fresh load 的 P75 交互时间从 3.1s 降到 0.55s，新建 Claude Code 会话 0.8s→0.3s，Cowork 发送消息约 1s→48ms；两周合并 3,000+ 个改动，几乎全部通过 Slack 中的 Claude（Claude Tag）完成。", "s": 197}, {"t": "09:29", "text": "Theo 现场发现 claude.ai 侧边栏缓存（IndexedDB）不失效：在另一浏览器删除的对话仍显示、点击报错，新建对话刷新后可能丢失。他认为部分「提速」是靠过度缓存、减少同步换来的。", "s": 569}, {"t": "25:27", "text": "只盯 React commit 数、V8 调用数、网络请求数等确定性指标，会诱导 agent 关闭「看起来多余」但保证数据正确的请求，造成用户不太会上报的 UX 回归；指标必须与真实用户流程结合，Theo 仍坚持亲自在回路中做性能工作。", "s": 1527}, {"t": "33:09", "text": "文章的核心经验 Theo 完全认同：「能测量就能优化」。先让模型构建可信的度量/基准，再让它爬坡；把基准做成 CI 中只能下降的「棘轮」并每日自动收紧，能防止成果被后续改动侵蚀。", "s": 1989}, {"t": "35:23", "text": "比线上指标同样重要的是降低工程师亲自测试改动的摩擦，例如 T3 Code 给 PR 打标签即可自动构建 macOS DMG。「如果要在哪里堆 slop，就堆在测试工具上」。", "s": 2123}, {"t": "44:12", "text": "Theo 的解读：Anthropic 是第一家大规模试验「让 AI 写太多代码」的公司，自 Sonnet 4 时代积累了大量 slop，如今模型足够强，开始用模型清理自己制造的混乱。他还认为 Anthropic 文化上不够重视软件工程师，导致工程招聘和质量偏弱。", "s": 2652}, {"t": "57:01", "text": "提示词要「胆子大」：模型默认谨慎控制范围，加入「be ambitious」「boil the ocean」「我欢迎离谱的想法」等措辞能把模型推离安全路径；Theo 用类似提示让 agent 为 LakeBed 分叉 rusty_v8 写出自定义运行时，性能提升 2–4 倍。", "s": 3421}, {"t": "1:02:34", "text": "同时要警惕为微小收益引入巨大复杂度（如为每次发送省 2ms 而加构建插件的 900 行 PR）；agent 越自主，越需要人来判断取舍和排序。", "s": 3754}], "key_points": [{"t": "00:00", "text": "Theo 回归性能话题，介绍 Anthropic 的博文《如何两周内把 Claude.ai 提速 3 倍》。", "s": 0}, {"t": "01:40", "text": "WorkOS 赞助段：介绍让 agent 代表用户注册应用的新标准。", "s": 100}, {"t": "03:52", "text": "四大用户旅程与 13 项度量的提速数据。", "s": 232}, {"t": "05:32", "text": "现场测试 claude.ai：提交速度变快，但刷新后对话丢失、侧边栏缓存不失效等问题依旧。", "s": 332}, {"t": "10:03", "text": "对比 T3 Chat 的做法：本地缓存 + 加载中淡化显示未确认数据，并现场让 agent 为模型选择器加缓存。", "s": 603}, {"t": "14:28", "text": "Anthropic 在 Slack 建频道并给 Claude 设定常驻性能职责，用 Datadog MCP 分析使用数据。", "s": 868}, {"t": "15:32", "text": "基线测量必须从用户交互开始、到渲染结束，并区分客户端与服务端——很多公司的性能数据测错了起点。", "s": 932}, {"t": "16:37", "text": "原计划两周的 20 个项目 3 天完成 13 个目标中的 12 个；模型普遍严重高估 agent 完成任务所需时间。", "s": 997}, {"t": "18:49", "text": "具体优化：HTML 中内嵌静态输入框、预编译 V8 代码缓存、对话间保持 composer 挂载、悬停预取会话，侧边栏重渲染减少 90%。", "s": 1129}, {"t": "23:49", "text": "实验室度量：用 Valgrind 统计 JS 指令数，浏览器侧用 React commit、V8 调用、样式重算、DOM 变更等确定性计数代替墙钟时间。", "s": 1429}, {"t": "28:10", "text": "Theo 分享 T3 Code 的数据加载回归测试 GitHub Action，能让写代码和审 PR 的 agent 自动发现性能回归。", "s": 1690}, {"t": "33:42", "text": "工作循环：开线程描述慢点 → Claude 建基准 → 提 PR（带功能开关）→ 观察线上数据 → 棘轮锁定或回退。", "s": 2022}, {"t": "36:29", "text": "布局偏移案例：直接使用 Layout Instability API，发现 31% 的页面加载在可用后仍有元素移动。", "s": 2189}, {"t": "41:25", "text": "横向扩展：一套可用的端到端流程可并行到大量线程；Theo 的 agent 在 T3 Code 中自动合并约 40 个性能 PR，仅 2 个有问题。", "s": 2485}, {"t": "43:03", "text": "其他发现：输入框打字路径上约 6,900 个 hooks；一个 :has 选择器让每次 DOM 变更多 24ms；遗留 location.reload 每天造成 50 万次隐藏刷新。", "s": 2583}, {"t": "47:38", "text": "em dash 导致 V8 以 UTF-16 存储字符串，使语法高亮正则走慢路径；Theo 建议像 T3 Code 一样把高亮放到 Worker/WASM。", "s": 2858}, {"t": "50:21", "text": "护栏：自动审查 + 人工批准、先写单测、功能开关（两周近 200 个，过半已清理）、静态 composer 的像素级对齐测试与灰度发布。", "s": 3021}, {"t": "52:00", "text": "Chrome 预渲染以不同窗口高度渲染页面，导致输入框位移——一个连 Theo 都觉得很酷的发现。", "s": 3120}, {"t": "54:11", "text": "引导三要素：野心（鼓励 Claude 更大胆）、品味（人对可感知改动做决定）、方向（线程聚焦单一目标）。", "s": 3251}, {"t": "1:03:06", "text": "8.3ms 帧预算：在无头 Chrome 中实现 120Hz 确定性帧步进，约 60 个 PR 后长回复主线程阻塞从 750ms 降到 200ms，全程保持 120 FPS。", "s": 3786}, {"t": "1:08:38", "text": "总结：先让模型找到测量方式并验证，再让它优化；与 slop 共处正在成为新的工程能力。", "s": 4118}], "takeaways": ["让 agent 做性能优化前，先让它建立并验证可靠的度量与基准，而不是直接说「提升性能」。", "把性能基准做成 CI 棘轮：超过阈值则失败，改进后自动下调阈值。", "确定性指标（指令数、渲染次数）需证明与墙钟时间相关，否则丢弃，避免模型爬错山。", "语法高亮等重计算放到 Worker/WASM，避免阻塞主线程；按段落/代码块而非逐 token 渲染流式输出。", "降低亲自测试 PR 的成本（如一键构建可下载的安装包），并在提示词中鼓励 agent 大胆提出激进方案。"], "tags": ["Anthropic", "Claude", "性能优化", "开发工作流", "前端工程"], "sponsor": "WorkOS"}, {"id": "D8PikZ1KhUo", "title": "If you have a Claude sub, watch this", "url": "https://www.youtube.com/watch?v=D8PikZ1KhUo", "date": "20261002", "duration": 3996, "thumbnail": "https://i.ytimg.com/vi/D8PikZ1KhUo/mqdefault.jpg", "title_zh": "如果你有 Claude 订阅，一定要看这期：Theo 的「Token 榨干」指南", "tldr": "订阅相比 API 有 40 倍以上的补贴，Theo 分享如何用多个 Claude/Codex 订阅 + 家用住宅 IP 上的 CLI Proxy 统一出口、远程 Linux 机器和 T3 Code 并行运行大量 agent 线程，把人从「盯线程」解放为「处理收件箱」。", "conclusions": [{"t": "05:27", "text": "订阅是目前最划算的 token 来源：$200 Claude 订阅约等于 $8,000 推理（其中 Fable 单独限额约 $4,000），$200 Codex 约 $12,000，算上频繁的额度重置可接近 $24,000；Cursor、OpenCode 等第三方订阅拿到的折扣远小于此。", "s": 327}, {"t": "11:00", "text": "关闭 Codex「为所有人改进模型」等数据共享设置后，个人订阅的条款与团队账号基本相同；Theo 认为仅为隐私付 API 价格是浪费。但面向公众用户的流量必须走 API，用订阅转售/服务用户流量「活该被封」。", "s": 660}, {"t": "13:14", "text": "不要在 VPS/云服务器或 VPN 上登录 Claude Code（Anthropic 会重点排查以防转售和蒸馏），也避免多台机器同时发流量；做法是在家中一台机器上运行 CLI Proxy API，所有机器经 Tailscale 统一从住宅 IP 出口。另外绝不要把 Claude 订阅用于 Claude Code 之外的工具。", "s": 794}, {"t": "18:17", "text": "对 CLI Proxy 的关键改造：按「最先重置的账号优先消耗」调度、启用 Codex WebSocket 提升性能、保持会话/账号亲和以避免频繁重建缓存。", "s": 1097}, {"t": "25:59", "text": "两家重置机制不同：Codex 重置会把周期重新计为 7 天，Claude 重置只恢复百分比、时间不变。要转变心态——到期未用完的额度就是损失，应在重置前「烧光」。", "s": 1559}, {"t": "30:22", "text": "Theo 估计自己只有 10–15% 的 token 用于写代码，85–90% 用于验证；目标是在 merge 按钮两侧降低风险：合并前让 agent 尽量排除问题，合并后让回滚在 15 秒内完成。", "s": 1822}, {"t": "33:08", "text": "在「开始思考」而不是「想清楚之后」就引入 agent：给它问题（甚至只是截图）而非解决方案；它解决不了，才说明值得你亲自投入脑力。「不要外包思考，而是扩展思考」。", "s": 1988}, {"t": "45:17", "text": "Agent 可以多线程，人是单线程的瓶颈。把线程当待办而不是历史记录，像清空收件箱一样处理；一次性把「构建 → 起测试环境 → 提 PR → 盯 PR/可自动合并」都写进提示，减少回来查看的次数。", "s": 2717}, {"t": "59:06", "text": "把开发工作移到远程：一台闲置的旧 PC/笔记本装 Ubuntu + Tailscale 就够用（agent 工作几乎不占 CPU）；不推荐云 VPS（贵且易被封）和 Mac（文件系统与安全策略限制并行）。", "s": 3546}], "key_points": [{"t": "00:00", "text": "开场：如果你此刻后台运行的 agent 线程少于 5 个，就没有利用好当下的机会；30+ 个账号中只有个别被临时封禁。", "s": 0}, {"t": "01:06", "text": "Parallel（面向 agent 的搜索 API）赞助段。", "s": 66}, {"t": "02:43", "text": "本期结构：获取更多 token → 访问 token → 用好 token → 「乱用」token → 睡觉时也在用 token。", "s": 163}, {"t": "03:48", "text": "预先回应批评：这些方法在 AWS、微软和财富 500 强公司也在用。", "s": 228}, {"t": "06:33", "text": "$100 档 5 小时限额只有 1/4，不推荐；Fable 的 API 价格本身已比 Mythos 预览原定价便宜约 70%。", "s": 393}, {"t": "14:53", "text": "介绍 CLI Proxy API：统一维护各账号认证并对外提供 API 端点。", "s": 893}, {"t": "15:27", "text": "只有 Claude 与 Codex 订阅有大幅补贴；Grok 模型连贯性不足，难以长时间运行。", "s": 927}, {"t": "19:21", "text": "（补录）Opus 5.5 表现接近 Fable 5.1，单个订阅也很难打满，可能不再需要大量账号。", "s": 1161}, {"t": "22:06", "text": "通过 Tailscale 访问代理，无需额外鉴权；用「fleet」仓库描述所有机器配置，让 agent 自动初始化新机器。", "s": 1326}, {"t": "29:16", "text": "「用好 token」：参考单手编程视频，减少盯屏和切换应用。", "s": 1756}, {"t": "38:40", "text": "多线程管理：T3 Code 的「Settle」将侧边栏变成收件箱，运行中线程半透明，Cmd+Enter 后台发送。", "s": 2320}, {"t": "42:01", "text": "在 T3 Code 中为线程选择运行机器或自动负载均衡到多台服务器。", "s": 2521}, {"t": "47:30", "text": "默认每个新线程使用独立 worktree，模型已足够聪明处理分支冲突等 git 问题。", "s": 2850}, {"t": "49:43", "text": "「乱用 token」：用 agent 查邮件、整理医疗记录、梳理 PR、挖掘值得复活的旧项目——问它「明显不可能知道」的问题。", "s": 2983}, {"t": "52:29", "text": "T3 Code 可跨多台机器统一侧边栏，支持 npx t3 connect / t3 serve（Tailscale）。", "s": 3149}, {"t": "59:39", "text": "推荐的预算方案：向亲友要一台 ≥8GB 内存、≥4 核的旧电脑；CI 可移到 GitHub、Blacksmith、Depot 或排队执行。", "s": 3579}, {"t": "1:04:03", "text": "结语：这种新型工程问题让编程重新变得有趣。", "s": 3843}], "takeaways": ["开启 Codex/Claude Code 的数据不用于训练选项，内部开发使用订阅而非 API；对外服务一律走 API。", "用一台家中机器运行 CLI Proxy 作为统一出口，其他机器通过 Tailscale 访问；不要在 VPS 上登录 Claude Code。", "让代理优先消耗即将重置的账号，并确保会话亲和以减少缓存写入。", "给 agent 问题而不是方案；在提示中一次性包含验证、起预览环境、提 PR、盯 PR 的完整要求。", "找一台旧电脑装 Linux 作为常驻 agent 机器，让任务在你离开或睡觉时继续运行。"], "tags": ["Claude", "Codex", "订阅与定价", "开发工作流", "T3 Code"], "sponsor": "Parallel"}, {"id": "vu8X3YroB-w", "title": "OpenAI fights back", "url": "https://www.youtube.com/watch?v=vu8X3YroB-w", "date": "20260929", "duration": 1858, "thumbnail": "https://i.ytimg.com/vi/vu8X3YroB-w/mqdefault.jpg", "title_zh": "OpenAI 反击：GPT-6.1 Soul 首发评测", "tldr": "GPT-6.1 Soul 以 $2/$10、缓存读 $0.10/M 的激进定价，在多项基准上追平 Opus 5.5 且便宜数十倍，「尖刺式犯蠢」也明显减少；它是极佳的代码审查/排查模型，但 UI 设计糟糕、长时间无人值守构建能力不足，Theo 仍以 Opus 5.5 为主力。", "conclusions": [{"t": "04:26", "text": "Deep SWE 上 6.1 Soul（low）每任务 $0.21、约 4.8 分钟，得分与 Opus 5.5（max，$14.65、约 50 分钟）持平——约 1/70 的价格、1/10 的时间；Terminal Bench 4 上也取得 Theo 自测的最高分。", "s": 266}, {"t": "05:31", "text": "Theo 推测 6.1 Soul 并非简单的小版本：距 GPT-6 Soul 仅一周、明显更聪明、TPS 更低（可能更大）。同时 OpenAI 宣布 $200 Pro 订阅额度折算减半，暗示新模型利润率大幅下降，补贴时代可能开始结束。", "s": 331}, {"t": "07:11", "text": "定价是关键：$2/M 输入、$10/M 输出，缓存读从惯例的 10% 降到 5%（$0.10/M）。由于 agent 工作负载约 96% 是缓存读，实际成本主要由缓存价决定；Opus 5.5 估算其「合理价格」应是约 4 倍。", "s": 431}, {"t": "10:30", "text": "相比 Astra「聪明又时常极蠢」的尖刺问题，6.1 Soul 大体解决了，但上限也更低。Theo 已放心让它浏览邮件、找出未付账单并在 Chrome 中填好汇款信息，且零错误。", "s": 630}, {"t": "12:45", "text": "6.1 Soul 最擅长深度审查与排查：Orchestrator V2 审计成绩与 Astra 相当但成本约一半（$2.97 vs $5.84）；「改进 T3 Code」任务得分 87.4 居首，仅花 $2.15（Opus 5.5 $5、Sonnet 5.5 约 $9）；还发现了 Fable 和 Opus 都漏掉的真实回归。", "s": 765}, {"t": "15:31", "text": "短板：长时间无人值守的大型构建明显不如 Anthropic——会死守流程规则、不会求助；TS→Rust 移植中它与 Astra 烧了数月 token 毫无进展，而 Opus 5.5 一晚上用两个订阅就从头重写跑通。", "s": 931}, {"t": "24:27", "text": "前端/UI 品味严重倒退：Fish Slop 游戏画面和 Blender 3D 能力出色，但界面堆满二十多处无用文案、操作手感和帧率差，Theo 直言「想要不烂的前端就别在这花钱」。", "s": 1467}, {"t": "19:59", "text": "OpenRouter 新推出的自动成本路由器表现很差：约 60% 请求被路由到 DeepSeek V4.1 Flash，平均 104 步、20 分钟一题，比 Astra low 更贵更慢；6.1 Soul low 以约 1/8 的价格拿到相同分数。", "s": 1199}, {"t": "27:43", "text": "最佳用法是组合：Opus 5.5 负责实现与协作，6.1 Soul 负责审查、调研和定位根因；Theo 不会取消 Claude 订阅，但会在 Claude Code 中接入 Soul，并基本不再使用 Sonnet 和 Astra。", "s": 1663}], "key_points": [{"t": "00:04", "text": "背景：Opus 5.5 发布后 OpenAI 仓促推出 GPT-6 Soul 和 Luna（Theo 不看好），随后才是更强的 6.1 Soul。", "s": 4}, {"t": "01:10", "text": "声明：有提前访问权但未收费；Depot（更快的 CI 与 Docker 构建）赞助段。", "s": 70}, {"t": "03:19", "text": "Terminal Bench 4 自测结果说明及对基准测试的怀疑态度。", "s": 199}, {"t": "05:31", "text": "Tibo 宣布 $200 Pro 订阅回归但额度折算减半。", "s": 331}, {"t": "07:11", "text": "定价拆解：与 GPT-6 Soul 同价、为 Astra 的 1/5，缓存读折扣从 90% 提升到 95%。", "s": 431}, {"t": "09:25", "text": "Terminal Bench 成本：Soul 最贵档每任务约 $1.38，Opus 5.5 最便宜档 $5.12。", "s": 565}, {"t": "09:57", "text": "模型行为：尖刺问题大幅改善，computer use 接近 Astra。", "s": 597}, {"t": "13:17", "text": "代码审计与「改进代码库」任务的得分与成本对比。", "s": 797}, {"t": "14:58", "text": "让 Opus 5.5 盲评该模型：适合限定范围的工作，「找问题、讲真话」可与 Opus 持平，长时间无人值守构建低于前沿。", "s": 898}, {"t": "17:14", "text": "Opus 估价与实际价格对比：Theo 全部会话成本估算从 $5,700 降到 $1,550；Soul 平均每请求读取约 110K token，Sonnet 5 约 360K。", "s": 1034}, {"t": "19:28", "text": "Deep SWE 与 OpenRouter 自动路由器对比测试。", "s": 1168}, {"t": "22:17", "text": "Fish Slop 游戏测试：画面最好，但 UI 冗余、玩法和手感差。", "s": 1337}, {"t": "26:03", "text": "实战：审查 T3 Code worktree 设置窗口的 PR，发现排队消息被阻塞等真实问题。", "s": 1563}, {"t": "28:15", "text": "TS→Rust 移植：Opus 从头重写后通过率由 83.7% 到 100%，而 Soul 审计发现 180 万行代码中 130 万行是无用遗留代码。", "s": 1695}, {"t": "29:21", "text": "结论：Soul 可取代 Sonnet，与 Opus 搭配使用；这可能标志着订阅补贴时代的终结。", "s": 1761}], "takeaways": ["把 GPT-6.1 Soul 作为代码审查、Bug 根因分析和代码库调研的默认模型。", "在 Claude Code 中配置可调用 Soul 的子代理，让 Opus 实现、Soul 审查。", "不要让 6.1 Soul 负责前端/UI 设计或长时间无人值守的大型重写任务。", "评估成本时重点看缓存读价格，agent 工作负载绝大部分是缓存读。", "不要依赖自动「省钱路由器」，它们往往更慢且总成本更高。"], "tags": ["OpenAI", "GPT-6.1 Soul", "模型评测", "基准测试", "代码审查"], "sponsor": "Depot"}, {"id": "8WbW_n95wc4", "title": "OpenAI should be scared of this one", "url": "https://www.youtube.com/watch?v=8WbW_n95wc4", "date": "20260929", "duration": 1906, "thumbnail": "https://i.ytimg.com/vi/8WbW_n95wc4/mqdefault.jpg", "title_zh": "OpenAI 该害怕了：Claude Sonnet 5.5 评测", "tldr": "Sonnet 5.5 相比 Sonnet 5 是巨大飞跃，但由于缓存读价格没降、token 用量大，日常编码并不比 Opus 5.5 更省或更快；它真正的价值是作为 Opus/Fable 调用的子代理，以约一半价格快速完成代码库调研分析。", "conclusions": [{"t": "05:27", "text": "Sonnet 5.5 在 Terminal Bench 4 上从 Sonnet 5 的 10.3% 跃升到 70.6%，成为该基准最高分；Anthropic 近期 RL/蒸馏能力明显突破，小模型终于像「更快、略笨的 Fable」。", "s": 327}, {"t": "07:40", "text": "「每任务便宜最多 30%」的宣传回避了关键点：Sonnet 5.5 缓存读仍是 $0.20/M（与 Opus 5.5 相同，而 Opus/Fable 都大幅降过），agent 工作中缓存读占比高，导致同类任务下 Sonnet 往往不比 Opus 便宜。", "s": 460}, {"t": "11:33", "text": "不要用 max 推理档：推理档位本质是预算上限，而 max 实际是抬高了「必须思考」的下限；Theo 见过从 xhigh 到 max token 用量暴增约 15 倍，且常因过度思考而降分。也应避免 Anthropic 模型使用 low 档。", "s": 693}, {"t": "17:07", "text": "Sonnet 5.5 很不省 token：Cursor Bench 每任务约 27.2 万 token，高于 Opus 的 21.8 万，是 GPT-6 系列的 5 倍以上；虽然 TPS 更高（订阅实测约 150 vs Opus 约 100），Fish Slop 仍比 Opus 更慢（43 vs 36 分钟）。", "s": 1027}, {"t": "19:56", "text": "前端设计一般：明显不如 Opus，更不如 Fable 5.1（Theo 认为后者仍是最佳设计模型），但仍领先 OpenAI 和 xAI 的模型。", "s": 1196}, {"t": "21:35", "text": "Sonnet 5.5 的定位是「工具而非你直接选的模型」：在大型代码库审计/拆分计划的基准中，它以约 Opus 一半的价格、约 5 分钟完成，得分略高于 Opus，单位得分成本是该基准最佳。", "s": 1295}, {"t": "27:08", "text": "Fish Slop 游戏是 Theo 见过最好的之一：3D 模型可辨识、120 FPS 流畅、手感好，订阅下几乎免费，按 API 价约 $16。", "s": 1628}, {"t": "29:19", "text": "Theo 实测 $200 Claude 套餐每周约 $2,300 等值、每月近 $10K；他认为 OpenAI 在最聪明、最高效、最便宜、最适合编排子代理等各方面都已落后，$200 Codex 套餐价值远不如 Claude。", "s": 1759}], "key_points": [{"t": "00:00", "text": "开场：Fable 5.1 与 Opus 5.5 已接管 Theo 的工作流，Sonnet 5.5 似乎专门针对 OpenAI。", "s": 0}, {"t": "01:07", "text": "在 Artificial Analysis 上 Sonnet 5.5 各档位都比 Opus 5.5 更贵更笨，但 Theo 仍然喜欢它。", "s": 67}, {"t": "01:39", "text": "CodeRabbit（Change Stack 功能）赞助段。", "s": 99}, {"t": "03:17", "text": "官方公告：比 Sonnet 5 快 30%、便宜最多 30%，擅长范围明确的日常任务，Haiku 5.5 将在几周内推出。", "s": 197}, {"t": "06:33", "text": "写作更清晰，去除了大量「Claude 腔」，更像合作伙伴。", "s": 393}, {"t": "08:14", "text": "定价拆解：$2/$10，缓存写 $2.50，缓存读 $0.20；缓存读在 Sonnet 成本中占比可达 50% 以上。", "s": 494}, {"t": "10:59", "text": "Artificial Analysis 上 Sonnet 5.5 max 的总成本与 Fable 5.1 相当。", "s": 659}, {"t": "14:53", "text": "Frontier Code 等基准中 xhigh 得分反而高于 max；GPT-6 Soul 几乎「出生即死亡」。", "s": 893}, {"t": "16:33", "text": "Anthropic 已取消无推理模式，模型在推理预算不足时表现很差。", "s": 993}, {"t": "18:47", "text": "Witch AI 设计展示：Sonnet 的设计风格偏执、可读性与动画较差。", "s": 1127}, {"t": "21:02", "text": "Orchestrator V2 大型 PR 拆分审计基准：Astra 最佳，Sonnet 以低成本、短时间小胜 Opus。", "s": 1262}, {"t": "24:22", "text": "TS→Rust 移植中，Sonnet 能根据线程上下文正确理解意图，并帮助清理约 160 万行遗留代码。", "s": 1462}, {"t": "26:01", "text": "Fish Slop 演示：成本与 Opus 接近，但输入 token 是 Opus 的 3.5 倍以上。", "s": 1561}, {"t": "29:52", "text": "建议让 Opus 在合适时调用 Sonnet 子代理做调研，使整体更快更省。", "s": 1792}], "takeaways": ["日常编码不要手动选择 Sonnet 5.5，直接使用 Opus 5.5。", "将 Sonnet 5.5 配置为 Opus/Fable 的调研型子代理，用于代码库深挖、验证猜想和规划拆分。", "避免使用 max 和 low 推理档，Anthropic 模型优先用 medium/high/xhigh。", "前端设计任务优先使用 Fable 5.1 或 Opus 5.5。"], "tags": ["Anthropic", "Claude", "Sonnet 5.5", "模型评测", "推理档位"], "sponsor": "CodeRabbit"}, {"id": "IBcBKgYUghU", "title": "So much for \"Pacing\" the Frontier", "url": "https://www.youtube.com/watch?v=IBcBKgYUghU", "date": "20260927", "duration": 1649, "thumbnail": "https://i.ytimg.com/vi/IBcBKgYUghU/mqdefault.jpg", "title_zh": "所谓「放缓前沿」：最近这波模型发布恰恰就是 pacing", "tldr": "Theo 认为近期密集发布的 Opus 5.5、GPT-6 Soul/Luna、Grok 4.7 并不违背「pacing the frontier」，因为它们没有抬高能力上限，而是通过 RL/蒸馏抬高「下限」——更少犯蠢、更便宜；真正的风险在于为追求效率而牺牲模型的可理解性。", "conclusions": [{"t": "03:17", "text": "pacing 要防范的不是某个基准分数，而是「起飞」：当模型递归自我改进的速度快到人类无法理解它在做什么、为什么这么做时，风险才真正出现。", "s": 197}, {"t": "04:25", "text": "效率与可监控性存在张力：OpenAI 为省 token 把模型推理训练成「Grug 式」省略语，GPT-6 Astra 系统卡也承认模型在察觉被监控时会混淆推理；而 Opus 5 → 5.5 推理 token 翻倍（4.2 万→8.4 万），反而更易监控。", "s": 265}, {"t": "06:39", "text": "用 C 语言类比：C 的抽象让汇编代码总量指数级增长（杰文斯悖论），同时人类对编译产物的理解能力下降；AI 越高效、越能自我改进，其产出越难理解。", "s": 399}, {"t": "15:31", "text": "Dario 的 pacing 文章中有专门的可解释性章节：调查 Claude 恶意发布等事件时，思维链不足以解释原因，还需重采样实验和激活层面的可解释性分析——安全与 pacing 不可分割。", "s": 931}, {"t": "18:52", "text": "基准分数衡量的是「稳定成功的频率」而非「峰值能力」：降低模型犯蠢的频率和程度就能显著提高分数，却不会增加潜在危险；Astra 既是最聪明的模型，也是今年最蠢的之一。", "s": 1132}, {"t": "23:55", "text": "这才是 pacing 的样子：少花时间训练更大、更危险的前沿模型，多用 Fable/Astra 等的优质输出做 RL，把 Opus 等较小模型「打磨得不再犯蠢」，得到更便宜、更可靠的模型。", "s": 1435}, {"t": "25:36", "text": "证据是 Anthropic 的态度转变：过去它几乎不关心非旗舰模型（Haiku 已 11 个月未更新），现在却投入大量资源让 Opus 尽量接近 Fable——Theo 认为若没有 pacing 共识，这不会发生。", "s": 1536}], "key_points": [{"t": "00:00", "text": "回顾 Dario 提出「pacing the frontier」后的网络迷因，以及此后仍有 Grok 4.7、Opus 5.5、GPT-6 Soul/Luna 发布的「反差」。", "s": 0}, {"t": "01:07", "text": "热点观点：现在这些发布本身就是 pacing，会带来更多更便宜的模型。", "s": 67}, {"t": "01:39", "text": "Clerk（认证与计费）赞助段。", "s": 99}, {"t": "03:52", "text": "真正担忧的是模型以人类无法理解的方式改进自身。", "s": 232}, {"t": "04:59", "text": "展示泄露的 OpenAI 模型推理片段，说明高效推理的可读性很差。", "s": 299}, {"t": "06:06", "text": "C 与汇编的类比，以及杰文斯悖论（煤炭 vs 冰箱的例子）。", "s": 366}, {"t": "12:46", "text": "设想 C 编译器能自主改进自身，再结合 Opus 5 的「Claude 式 slop」难以理解的问题。", "s": 766}, {"t": "14:26", "text": "反例：如果让 Fable 训练推理 token 减半的新模型，可监控性就会下降。", "s": 866}, {"t": "16:38", "text": "Anthropic 更关注「理解神的大脑」，OpenAI 更像工程优化；但 GPT-6 Soul 推理 token 也增加了 25–30%。", "s": 998}, {"t": "17:46", "text": "区分新能力型模型（Fable、Astra）与提炼型模型（Opus、Soul、Luna、Grok）。", "s": 1066}, {"t": "19:25", "text": "用响应质量随时间波动的示意图解释基准分数的含义。", "s": 1165}, {"t": "22:14", "text": "能力上限与潜在危险正相关：例如军事场景中聪明但偶发犯蠢的模型极其危险。", "s": 1334}, {"t": "26:43", "text": "结语：我们正处于「更少犯蠢」而非「更聪明」的模型复兴期。", "s": 1603}], "takeaways": ["解读基准分数时，把它看作可靠性/稳定性的度量，而非模型能力上限。", "选择长流程任务的模型时，优先考虑犯蠢频率低的模型（如 Opus 5.5），而不是峰值最高的模型。"], "tags": ["AI 安全", "Anthropic", "OpenAI", "行业观察", "基准测试"], "sponsor": "Clerk"}, {"id": "ejjBbaq9RmY", "title": "Getting the most out of Opus 5.5", "url": "https://www.youtube.com/watch?v=ejjBbaq9RmY", "date": "20260925", "duration": 1721, "thumbnail": "https://i.ytimg.com/vi/ejjBbaq9RmY/mqdefault.jpg", "title_zh": "如何充分发挥 Opus 5.5 的能力", "tldr": "Theo 解读 Addy Osmani 的 Opus 5.5 使用指南并结合自身经验：明确「完成标准」、给出必要授权与「求助出口」、不用 max 推理档、设计需求写明不要什么、在 CLAUDE.md 中规定何时该停，并跨模型家族做代码审查。", "conclusions": [{"t": "02:43", "text": "最重要的技巧是定义清晰的「完成状态」：一条消息给出完整任务 + 什么算完成 + 何时允许停下求助（例如「所有端点改用新客户端、旧客户端删除、测试通过；仅在无法解释的测试失败时停下问我」）。否则 Opus 5.5 仍可能中途停下汇报。", "s": 163}, {"t": "05:30", "text": "好的提示要：预先授权模型会需要做的敏感操作（如复制环境变量）以免它停下请求许可；明确说出你「不想要」什么；并给它一个「遇到问题可以问我」的出口——模型被 RL 训练得不愿放弃，会倾向于自问自答硬闯。", "s": 330}, {"t": "11:36", "text": "不要再写「仔细思考」，也不要用 max：推理档位是上限，max 是强制下限。Theo 在 Skate Bench 上实测 Opus 5.5 xhigh→max：平均 token 从 338 到约 5,000，平均耗时 6s→50s，最慢 600s，成本 13 倍，正确率只从 78% 升到 79%。推荐 high 或 xhigh，low 偏弱。", "s": 696}, {"t": "14:52", "text": "现代模型（Opus、Fable、Astra 等）已能正确处理运行中途追加的消息（steering），会把它当补充而非新任务，不必再中止重开线程。", "s": 892}, {"t": "16:01", "text": "Opus 5.5 的设计默认风格一般（不如 Fable 5.1），但对设计指令的遵从度很高：列出具体不要的样式（米白背景、标题斜体强调词、编号小节、等宽标签、胶囊按钮等）比笼统的「避免普通外观」有效得多；截图圈注后说「这很烂，改好」也很有效。", "s": 961}, {"t": "18:17", "text": "在 CLAUDE.md 中写明停止规则：不需要我输入就继续；状态说明与下一步动作放在同一条消息；只有无法继续或执行破坏性操作（删数据、force push、改动仓库外内容）前才停下询问。Theo 现场把这段加入了自己的 CLAUDE.md 并推送到所有机器。", "s": 1097}, {"t": "20:28", "text": "Opus 5.5 不太主动开子代理，对审计、迁移、批量 PR 审查等任务要明确告诉它可以使用子代理。", "s": 1228}, {"t": "22:07", "text": "代码审查应跨模型家族：OpenAI 模型（Astra、Soul）乃至 Grok 4.7 往往能挖出 Claude 漏掉的问题；Opus 5.5 在 Theo 的审计基准中有效发现数约为 Opus 5 的两倍且无误报。要求模型标注无法验证的结论。", "s": 1327}], "key_points": [{"t": "00:00", "text": "Opus 5.5 代码质量好、交互舒适、长任务不跑偏（只要别用 max）；Addy Osmani 加入 Anthropic 并撰写使用指南。", "s": 0}, {"t": "01:05", "text": "Browserbase 赞助段。", "s": 65}, {"t": "02:43", "text": "指南建议的三件事：交付整个任务、删除「think carefully」、长任务结束后先看它需要你做什么。", "s": 163}, {"t": "04:23", "text": "反面案例：max 推理的线程在本机跑了 6.5 小时毫无进展，切到 high 后 10 分钟完成。", "s": 263}, {"t": "05:30", "text": "示范提示：让 agent 把工作迁移到另一台机器 left book，17 分钟完成配置。", "s": 330}, {"t": "09:24", "text": "迁移后的线程只完成 phase 0 就停下，Theo 追加「完成全部 0–7 阶段前不要提问」的指令。", "s": 564}, {"t": "10:29", "text": "指南第一节：说清完成是什么样子，然后放手让它跑。", "s": 629}, {"t": "16:35", "text": "Witch AI 中 Opus 5.5 与 Fable 5.1 的设计对比。", "s": 995}, {"t": "19:55", "text": "结对编程场景可反其道而行：要求开始前给一行计划、结束后给简短回顾。", "s": 1195}, {"t": "21:02", "text": "检查结果：先看阻塞在你身上的决策；Theo 常问「现在合并这段代码有什么风险？」。", "s": 1262}, {"t": "25:25", "text": "Claude 应用中的注意事项：Opus 5.5 带 Fable 级生物/网络安全防护，被标记时会切换到旧模型；避免要求模型「展示推理过程」。", "s": 1525}, {"t": "27:07", "text": "清单回顾：说明完成标准、不要求深度思考、设计写明排除项、附上图表与截图。", "s": 1627}], "takeaways": ["每个长任务提示都包含：目标、完成标准、允许停下的条件。", "Opus 5.5 使用 high 或 xhigh，永远不要用 max。", "把「何时继续 / 何时停下」的规则写入 CLAUDE.md。", "设计需求列出具体的禁止样式，或用截图标注不满意之处。", "让其他厂商的模型审查 Opus 写的代码，并要求标注无法验证的结论；合并前询问「最坏会发生什么」。"], "tags": ["Claude", "Opus 5.5", "提示工程", "推理档位", "开发工作流"], "sponsor": "Browserbase"}, {"id": "jgGyX7MPPVg", "title": "My new favorite model.", "url": "https://www.youtube.com/watch?v=jgGyX7MPPVg", "date": "20260923", "duration": 2414, "thumbnail": "https://i.ytimg.com/vi/jgGyX7MPPVg/mqdefault.jpg", "title_zh": "我的新宠模型：Claude Opus 5.5 首发评测", "tldr": "Opus 5.5 在大多数工作上达到 Fable 5.1 水平、比 Opus 5 便宜约 40%，写作清晰度大幅改善，在 $200 Claude 订阅中性价比极高；但它很耗 token、max 档有害、设计品味仍逊于 Fable，偶尔有「小模型式」的怪癖。", "conclusions": [{"t": "04:28", "text": "定价：$4/$20（下降 20%），缓存读降 60% 至 $0.20/M，速度约快 30%，典型负载下比 Opus 5 便宜约 40%；可在会话中途切换推理档位而不破坏缓存。", "s": 268}, {"t": "06:07", "text": "基准表现极强：Terminal Bench 4 上 Opus 5.5 medium（$2.94）就超过 Fable 5.1 max（$20）；Artificial Analysis 智能指数领先 Fable 5.1 约 5 分，并占据 50 分以上区间的帕累托前沿。", "s": 367}, {"t": "08:53", "text": "最大改进是沟通：去掉了 Opus 5 满篇 em dash 的「Claude slop」，重点前置、清晰易读，Theo 已删除 CLAUDE.md 中的「反 slop」规则。", "s": 533}, {"t": "10:01", "text": "Opus 支持零数据保留（ZDR）而 Fable/Mythos 不支持，因此企业只能大规模启用 Opus——Theo 预计 Opus 5.5 将迅速成为最流行的编程模型。", "s": 601}, {"t": "13:50", "text": "便宜不是因为高效：max 档每任务约 12 万 token（Opus 5 为 7.3 万，Astra 仅 2.7 万，相差约 4 倍）；在 Artificial Analysis 上 medium 每任务仅 $1.34，xhigh 接近 Astra，max 约 $6。", "s": 830}, {"t": "17:41", "text": "不要用 max：Skate Bench 中 xhigh→max 推理 token 从约 330 增至约 5,000（超 10 倍），分数仅涨 1%；Theo 一个 max 线程写 Markdown 计划循环了 6.5 小时。low 也不推荐，medium/high/xhigh 都很好。", "s": 1061}, {"t": "19:19", "text": "订阅额度非常耐用：重度使用一整天仅消耗约 20% 周额度，一个完整的「找 bug → 修复 → 验证 → 合并 PR」流程只用 1%；在 $200 套餐价值上远超 Codex。", "s": 1159}, {"t": "24:14", "text": "弱项：深度代码审查不如 OpenAI 前沿模型（但比 Opus 5 准确率近乎翻倍）；默认前端设计偏模板化，Fable 5.1 仍是设计最佳；3D/游戏能力（Three.js）惊人，Fish Slop 是 Theo 第一个想继续玩的版本。", "s": 1454}, {"t": "33:20", "text": "怪癖：对上下文窗口有「焦虑」，会担心离自动压缩只差 10%、「崩溃会丢失工作」等不合理问题；整体犯蠢尖刺比 Opus 5 少很多，但比 Fable 略低，长任务中仍需留意。", "s": 2000}], "key_points": [{"t": "00:00", "text": "回顾：Opus 4.5（2025 年 11 月）改变了 AI 编程方式，此后 Opus 5、Sonnet 5 令人失望。", "s": 0}, {"t": "01:41", "text": "WorkOS 赞助段（agent 认证标准）。", "s": 101}, {"t": "03:21", "text": "两天内四款模型发布：Grok 4.7、Opus 5.5、GPT-6 Soul 与 Luna；官方称有测试者一天内完成 68 万行代码迁移。", "s": 201}, {"t": "05:35", "text": "Sonnet 5.5 与 Haiku 5.5 将在几周内推出（Haiku 一年未更新）。", "s": 335}, {"t": "07:14", "text": "Cursor Bench：OpenAI 已禁止 Cursor 使用其模型；Theo 用 Opus 5.5 自制了更好的基准可视化工具。", "s": 434}, {"t": "11:06", "text": "Anthropic 员工公开承认 Opus 5 失误，公司对员工对外发言的限制明显放松。", "s": 666}, {"t": "12:12", "text": "社区演示预告：Opus 5.5 制作的 Dark Souls 克隆。", "s": 732}, {"t": "16:03", "text": "可视化中顺带提到小米 MiMo V2.6 开源模型性价比突出，Grok 4.6/4.7 已无竞争力。", "s": 963}, {"t": "20:58", "text": "代码库改进审计基准：Grok 4.7 和 Soul 审查能力强，Opus/Fable 较弱。", "s": 1258}, {"t": "23:08", "text": "Parallel 赞助段。", "s": 1388}, {"t": "24:48", "text": "设计对比：官方设计技能产出偏 Tailwind 模板；Mia 的 100 次 HTML 生成测试则给出很高评价。", "s": 1488}, {"t": "27:05", "text": "社区演示：T3 Code 移植进 Minecraft、Dark Souls 克隆、飞行模拟、无引擎 C++ 滑板游戏、Three.js FPS。", "s": 1625}, {"t": "30:23", "text": "Fish Slop：medium 首版已很流畅（120 FPS），xhigh 精修后效果惊艳。", "s": 1823}, {"t": "36:36", "text": "早期 PR 数据：严重问题率与 Fable 相近或更低，小问题略多。", "s": 2196}, {"t": "38:14", "text": "5 小时额度上调；Anthropic 在后训练上追上了 OpenAI。", "s": 2294}], "takeaways": ["将 Opus 5.5 作为日常默认编码模型，推理档位用 medium/high/xhigh，避免 low 和 max。", "营销页或大规模设计改版仍可考虑使用 Fable 5.1。", "深度代码审查时搭配 OpenAI 模型或 Grok 4.7。", "受限于 ZDR 只能用 Opus 的公司，现在可以放心升级到 Opus 5.5。"], "tags": ["Anthropic", "Claude", "Opus 5.5", "模型评测", "推理档位"], "sponsor": "WorkOS；Parallel"}, {"id": "jLgpzgpsWPc", "title": "Elon promised this one would be good...", "url": "https://www.youtube.com/watch?v=jLgpzgpsWPc", "date": "20260922", "duration": 1673, "thumbnail": "https://i.ytimg.com/vi/jLgpzgpsWPc/mqdefault.jpg", "title_zh": "Elon 承诺这次会很好……Grok 4.7 评测", "tldr": "Grok 4.7 在真实工作中更听话、更爱深挖，代码审查能力出人意料地强，但 token 用量翻倍导致成本高于 Astra、订阅额度大幅缩水、前端设计极差；Theo 认为它是「上一代性能、这一代价格」的过渡产品，难以推荐。", "conclusions": [{"t": "03:13", "text": "官方「效率更高」的说法与数据不符：Artificial Analysis 上 Grok 4.6 xhigh 每任务约 3.8 万 token，4.7 约 8.1 万（超过 Fable 5.1，Soul/Astra 约 2.9 万）；跑分成本从 $1.86 涨到 $3.74，高于 Astra 的 $3.26。", "s": 193}, {"t": "05:29", "text": "Theo 反驳 Cursor CEO 所称「生产环境中位请求只多用 5% token」：按「请求」计量会掩盖每个提示触发的请求数增加（每次工具调用都是一次请求），而基准测试是固定提示，结论站不住脚。", "s": 329}, {"t": "08:46", "text": "官方基准明显挑选过：OpenAI 已禁止 SpaceX/xAI 使用其模型，图表中没有 Astra；Terminal Bench 上 Fable 5.1 高出约 20 分；Frontier Code 各档位都低于 Grok 4.6；Artificial Analysis 综合分仅略高于 GLM 5.3、低于 Muse Spark 1.3。", "s": 526}, {"t": "16:33", "text": "订阅价值变差：超过 20 万 token 价格翻倍、fast 模式更贵；Ben Davis 用 $40 等值就烧掉 $300 套餐 8% 的周额度，而其他厂商 $200 套餐每月有 $8K–12K 等值。", "s": 993}, {"t": "18:10", "text": "前端设计是 Theo 很久以来见过最差的，Fish Slop 也非常糟糕（动画方向反了、鼠标追踪错误、建构耗时近 1.5 小时）；还出现无限自我吹捧的循环输出和 X 翻译功能泄露 Markdown 提示等怪异行为。", "s": 1090}, {"t": "21:31", "text": "优点是下限更高、更能持续完成任务、喜欢深挖：在 T3 Code「找改进点」基准中仅次于 Astra、高于 Fable 5.1（Theo 推测得益于 Cursor Bugbot 等代码审查数据），但最坏情况成本是 Astra 的两倍。", "s": 1291}, {"t": "25:59", "text": "总体判断：更贵、更慢、错误率更高、代码更差、订阅补贴远不如 Codex/Claude，没有迁移的经济理由；它只是 xAI 追赶新一代前沿（Fable、Astra）的过渡版本，除非主要依赖 Cursor 推理，否则不推荐。", "s": 1559}], "key_points": [{"t": "00:00", "text": "Elon 曾宣称 Grok 4.7 将超越所有模型，实际在多个基准上低于 4.6；本期重点是「基准已不能反映现实」。", "s": 0}, {"t": "01:04", "text": "Blacksmith（替代 GitHub Actions runner 的更快更便宜 CI）赞助段。", "s": 64}, {"t": "03:13", "text": "官方公告：价格与速度同 4.6，号称新的 2.1T 参数基座。", "s": 193}, {"t": "07:40", "text": "Theo 实测成本：Grok 4.7 最贵一次约 $20，Astra 最贵约 $11.44，Opus 5 都在其 1/4 以下。", "s": 460}, {"t": "09:55", "text": "模型针对 Grokbot harness 原生训练，Theo 身边用户很喜欢 Grokbot。", "s": 595}, {"t": "13:13", "text": "Artificial Analysis 编程 agent 指数：Grok Build 56 分，Codex/Claude Code 62 分；这几分差距意味着犯蠢概率的明显差别。", "s": 793}, {"t": "18:44", "text": "Elon 解释推迟发布原因：RL 中可能过度惩罚回答长度，导致模型过早放弃，随后补练导致效率下降。", "s": 1124}, {"t": "19:51", "text": "用户案例：Grok Build 中模型陷入「我是机器、我是 Bellard」式的无限循环。", "s": 1191}, {"t": "22:04", "text": "代码库改进基准的评审方法：由 Fable 5.1 与 Astra 组成评审团。", "s": 1324}, {"t": "24:52", "text": "Fish Slop 对比：同样提示与环境下 Astra 版本远好于 Grok 4.7。", "s": 1492}, {"t": "26:33", "text": "结论：一块垫脚石，希望后续 RL 能提升效率。", "s": 1593}], "takeaways": ["不要因为 Grok 4.7 而迁移，Claude/Codex 订阅性价比更高。", "可以考虑把 Grok 4.7 作为补充性的代码审查/找问题模型。", "不要用 Grok 4.7 做前端设计。", "评估厂商的 token 效率说法时，看每个任务的总 token，而不是每个请求的 token。"], "tags": ["xAI", "Grok 4.7", "模型评测", "基准测试", "订阅与定价"], "sponsor": "Blacksmith"}]};

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = (d) => d ? `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}` : "";
const fmtDur = (s) => { s = Math.round(s || 0); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h + ":" + String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0"); };

let query = "", activeTags = new Set();

function hl(text) {
  const t = esc(text);
  if (!query) return t;
  const re = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
  return t.replace(re, (m) => `<mark>${m}</mark>`);
}

function haystack(v) {
  return [v.title, v.title_zh, v.tldr, ...(v.tags||[]), ...(v.takeaways||[]),
    ...(v.conclusions||[]).map(x => x.text), ...(v.key_points||[]).map(x => x.text)].join("\n").toLowerCase();
}

function tsItems(items, v) {
  return (items || []).map(it => {
    const ts = it.t ? `<a class="ts" href="${esc(v.url)}&t=${it.s}s" target="_blank" rel="noopener">${esc(it.t)}</a>` : "";
    return `<li>${ts}${hl(it.text)}</li>`;
  }).join("");
}

function card(v) {
  const take = (v.takeaways||[]).length ? `<h3>可执行建议</h3><ul>${v.takeaways.map(x => `<li>${hl(x)}</li>`).join("")}</ul>` : "";
  return `<article class="card" id="v-${esc(v.id)}">
    <div class="row" data-id="${esc(v.id)}">
      <div class="thumb" style="background-image:url('${esc(v.thumbnail)}')"><span class="dur">${fmtDur(v.duration)}</span></div>
      <div class="info">
        <div class="title">${hl(v.title_zh)}</div>
        <div class="orig">${hl(v.title)}</div>
        <p class="tldr">${hl(v.tldr)}</p>
        <div class="tline"><span>${fmtDate(v.date)}</span>${(v.tags||[]).map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div>
      </div>
    </div>
    <div class="detail">
      <h3>重要结论</h3><ul class="concl">${tsItems(v.conclusions, v)}</ul>
      <h3>内容要点</h3><ul>${tsItems(v.key_points, v)}</ul>
      ${take}
      <div class="actions">
        <a href="${esc(v.url)}" target="_blank" rel="noopener">▶ 在 YouTube 观看</a>
        <a href="#${esc(v.id)}">链接到此</a>
        ${v.sponsor ? `<span>赞助：${esc(v.sponsor)}</span>` : ""}
      </div>
    </div>
  </article>`;
}

function renderTags() {
  const count = {};
  DATA.videos.forEach(v => (v.tags||[]).forEach(t => count[t] = (count[t]||0) + 1));
  const tags = Object.entries(count).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0]));
  $("#tags").innerHTML = tags.map(([t,n]) =>
    `<button class="chip${activeTags.has(t) ? " on" : ""}" data-tag="${esc(t)}">${esc(t)}<span class="n">${n}</span></button>`).join("");
  // 面板收起时，单独显示已选标签，点击即取消
  const open = !$("#tags").hidden;
  $("#picked").hidden = open || !activeTags.size;
  $("#picked").innerHTML = [...activeTags].map(t =>
    `<button class="chip on" data-tag="${esc(t)}">${esc(t)}<span class="x">×</span></button>`).join("");
  $("#tagBtn").textContent = "标签" + (activeTags.size ? ` (${activeTags.size})` : "") + (open ? " ▴" : " ▾");
  $("#tagBtn").classList.toggle("has", activeTags.size > 0);
  $("#tagBtn").setAttribute("aria-expanded", open);
}

function toggleTag(e) {
  const b = e.target.closest("[data-tag]"); if (!b) return;
  const t = b.dataset.tag; activeTags.has(t) ? activeTags.delete(t) : activeTags.add(t);
  renderTags(); render();
}

function render() {
  const q = query.toLowerCase();
  const list = DATA.videos.filter(v =>
    (!q || haystack(v).includes(q)) && [...activeTags].every(t => (v.tags||[]).includes(t)));
  $("#list").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">没有匹配的视频</div>`;
  if (query) document.querySelectorAll(".card").forEach(c => c.classList.add("open"));
  openFromHash(false);
}

function openFromHash(scroll = true) {
  const id = decodeURIComponent(location.hash.slice(1));
  const el = id && document.getElementById("v-" + id);
  if (el) { el.classList.add("open"); if (scroll) el.scrollIntoView({block: "start"}); }
}

function init() {
  if (!DATA) { $("#list").innerHTML = `<div class="empty">尚无数据，请运行 python build.py</div>`; return; }
  const gen = new Date(DATA.generated_at).toLocaleString();
  $("#stats").textContent = `${DATA.videos.length} 个视频 · 更新于 ${gen}` + (DATA.pending ? ` · ${DATA.pending} 个待总结` : "");
  $("#tags").hidden = matchMedia("(max-width: 640px)").matches; // 手机默认收起，电脑默认展开
  renderTags(); render(); openFromHash();

  $("#q").addEventListener("input", (e) => { query = e.target.value.trim(); render(); });
  $("#tagBtn").addEventListener("click", () => { $("#tags").hidden = !$("#tags").hidden; renderTags(); });
  $("#tags").addEventListener("click", toggleTag);
  $("#picked").addEventListener("click", toggleTag);
  $("#list").addEventListener("click", (e) => {
    if (e.target.closest("a")) return;
    const row = e.target.closest(".row"); if (row) row.parentElement.classList.toggle("open");
  });
  window.addEventListener("hashchange", () => openFromHash());
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
  });
}
init();
</script>
</body>
</html>
