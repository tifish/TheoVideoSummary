<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theo 视频总结</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --fg: #1d2129; --muted: #6b7280; --line: #e5e7eb;
    --accent: #e11d48; --accent-soft: #ffe4e6; --chip: #eef2f7; --link: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #181b21; --fg: #e6e8eb; --muted: #9aa3af; --line: #2a2f37;
      --accent: #fb7185; --accent-soft: #3b1720; --chip: #232832; --link: #7aa7ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.65 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
  .top { display: flex; align-items: baseline; gap: 12px; padding: 14px 0 8px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; }
  .meta { color: var(--muted); font-size: 13px; }
  .controls { display: flex; gap: 10px; padding-bottom: 10px; flex-wrap: wrap; }
  input[type=search] { flex: 1; min-width: 220px; padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg); font-size: 14px; }
  .tag-btn { flex: none; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card);
    color: var(--fg); font-size: 14px; cursor: pointer; }
  .tag-btn.has { border-color: var(--accent); color: var(--accent); }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; padding-bottom: 12px; }
  .tags[hidden] { display: none; }
  .chip .x { margin-left: 4px; }
  .chip { border: 1px solid transparent; background: var(--chip); color: var(--fg); border-radius: 999px;
    padding: 2px 10px; font-size: 12px; cursor: pointer; }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .chip .n { color: var(--muted); margin-left: 4px; }
  main { padding: 16px 0 60px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 14px; overflow: hidden; }
  .row { display: flex; gap: 14px; padding: 14px; cursor: pointer; }
  .thumb { flex: none; width: 200px; aspect-ratio: 16/9; border-radius: 8px; background: var(--chip) center/cover; position: relative; }
  .dur { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.75); color: #fff; font-size: 12px; padding: 0 5px; border-radius: 4px; }
  .info { min-width: 0; flex: 1; }
  .title { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .orig { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .tldr { margin: 0 0 8px; }
  .tline { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); align-items: center; }
  .tline .chip { cursor: default; }
  .detail { display: none; border-top: 1px solid var(--line); padding: 6px 20px 18px; }
  .card.open .detail { display: block; }
  .detail h3 { font-size: 14px; margin: 16px 0 6px; color: var(--accent); letter-spacing: .02em; }
  .detail ul { margin: 0; padding-left: 20px; }
  .detail li { margin: 4px 0; }
  .ts { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: var(--chip);
    padding: 0 6px; border-radius: 4px; margin-right: 6px; white-space: nowrap; }
  .concl li::marker { color: var(--accent); }
  .actions { margin-top: 14px; font-size: 13px; display: flex; gap: 16px; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
  mark { background: #fde68a; color: inherit; border-radius: 2px; }
  @media (max-width: 640px) {
    .row { flex-direction: column; } .thumb { width: 100%; }
    /* 手机上压缩顶栏；展开的标签面板限制高度，避免占满屏幕 */
    .top { padding: 8px 0 6px; gap: 8px; }
    h1 { font-size: 16px; }
    .meta { font-size: 12px; }
    .controls { padding-bottom: 8px; gap: 8px; }
    input[type=search] { min-width: 0; padding: 6px 10px; }
    .tags { padding-bottom: 8px; }
    #tags { max-height: 40vh; overflow-y: auto; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>Theo (t3.gg) 视频总结</h1>
      <span class="meta" id="stats"></span>
    </div>
    <div class="controls">
      <input type="search" id="q" placeholder="搜索标题、结论、要点…（按 / 聚焦）">
      <button class="tag-btn" id="tagBtn" aria-expanded="false" aria-controls="tags">标签</button>
    </div>
    <div class="tags" id="picked" hidden></div>
    <div class="tags" id="tags" hidden></div>
  </div>
</header>
<main class="wrap" id="list"></main>

<script>
const DATA = /*__DATA__*/null;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = (d) => d ? `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}` : "";
const fmtDur = (s) => { s = Math.round(s || 0); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h + ":" + String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0"); };

let query = "", activeTags = new Set();

function hl(text) {
  const t = esc(text);
  if (!query) return t;
  const re = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
  return t.replace(re, (m) => `<mark>${m}</mark>`);
}

function haystack(v) {
  return [v.title, v.title_zh, v.tldr, ...(v.tags||[]), ...(v.takeaways||[]),
    ...(v.conclusions||[]).map(x => x.text), ...(v.key_points||[]).map(x => x.text)].join("\n").toLowerCase();
}

function tsItems(items, v) {
  return (items || []).map(it => {
    const ts = it.t ? `<a class="ts" href="${esc(v.url)}&t=${it.s}s" target="_blank" rel="noopener">${esc(it.t)}</a>` : "";
    return `<li>${ts}${hl(it.text)}</li>`;
  }).join("");
}

function card(v) {
  const take = (v.takeaways||[]).length ? `<h3>可执行建议</h3><ul>${v.takeaways.map(x => `<li>${hl(x)}</li>`).join("")}</ul>` : "";
  return `<article class="card" id="v-${esc(v.id)}">
    <div class="row" data-id="${esc(v.id)}">
      <div class="thumb" style="background-image:url('${esc(v.thumbnail)}')"><span class="dur">${fmtDur(v.duration)}</span></div>
      <div class="info">
        <div class="title">${hl(v.title_zh)}</div>
        <div class="orig">${hl(v.title)}</div>
        <p class="tldr">${hl(v.tldr)}</p>
        <div class="tline"><span>${fmtDate(v.date)}</span>${(v.tags||[]).map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div>
      </div>
    </div>
    <div class="detail">
      <h3>重要结论</h3><ul class="concl">${tsItems(v.conclusions, v)}</ul>
      <h3>内容要点</h3><ul>${tsItems(v.key_points, v)}</ul>
      ${take}
      <div class="actions">
        <a href="${esc(v.url)}" target="_blank" rel="noopener">▶ 在 YouTube 观看</a>
        <a href="#${esc(v.id)}">链接到此</a>
        ${v.sponsor ? `<span>赞助：${esc(v.sponsor)}</span>` : ""}
      </div>
    </div>
  </article>`;
}

function renderTags() {
  const count = {};
  DATA.videos.forEach(v => (v.tags||[]).forEach(t => count[t] = (count[t]||0) + 1));
  const tags = Object.entries(count).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0]));
  $("#tags").innerHTML = tags.map(([t,n]) =>
    `<button class="chip${activeTags.has(t) ? " on" : ""}" data-tag="${esc(t)}">${esc(t)}<span class="n">${n}</span></button>`).join("");
  // 面板收起时，单独显示已选标签，点击即取消
  const open = !$("#tags").hidden;
  $("#picked").hidden = open || !activeTags.size;
  $("#picked").innerHTML = [...activeTags].map(t =>
    `<button class="chip on" data-tag="${esc(t)}">${esc(t)}<span class="x">×</span></button>`).join("");
  $("#tagBtn").textContent = "标签" + (activeTags.size ? ` (${activeTags.size})` : "") + (open ? " ▴" : " ▾");
  $("#tagBtn").classList.toggle("has", activeTags.size > 0);
  $("#tagBtn").setAttribute("aria-expanded", open);
}

function toggleTag(e) {
  const b = e.target.closest("[data-tag]"); if (!b) return;
  const t = b.dataset.tag; activeTags.has(t) ? activeTags.delete(t) : activeTags.add(t);
  renderTags(); render();
}

function render() {
  const q = query.toLowerCase();
  const list = DATA.videos.filter(v =>
    (!q || haystack(v).includes(q)) && [...activeTags].every(t => (v.tags||[]).includes(t)));
  $("#list").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">没有匹配的视频</div>`;
  if (query) document.querySelectorAll(".card").forEach(c => c.classList.add("open"));
  openFromHash(false);
}

function openFromHash(scroll = true) {
  const id = decodeURIComponent(location.hash.slice(1));
  const el = id && document.getElementById("v-" + id);
  if (el) { el.classList.add("open"); if (scroll) el.scrollIntoView({block: "start"}); }
}

function init() {
  if (!DATA) { $("#list").innerHTML = `<div class="empty">尚无数据，请运行 python build.py</div>`; return; }
  const gen = new Date(DATA.generated_at).toLocaleString();
  $("#stats").textContent = `${DATA.videos.length} 个视频 · 更新于 ${gen}` + (DATA.pending ? ` · ${DATA.pending} 个待总结` : "");
  $("#tags").hidden = matchMedia("(max-width: 640px)").matches; // 手机默认收起，电脑默认展开
  renderTags(); render(); openFromHash();

  $("#q").addEventListener("input", (e) => { query = e.target.value.trim(); render(); });
  $("#tagBtn").addEventListener("click", () => { $("#tags").hidden = !$("#tags").hidden; renderTags(); });
  $("#tags").addEventListener("click", toggleTag);
  $("#picked").addEventListener("click", toggleTag);
  $("#list").addEventListener("click", (e) => {
    if (e.target.closest("a")) return;
    const row = e.target.closest(".row"); if (row) row.parentElement.classList.toggle("open");
  });
  window.addEventListener("hashchange", () => openFromHash());
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
  });
}
init();
</script>
</body>
</html>
